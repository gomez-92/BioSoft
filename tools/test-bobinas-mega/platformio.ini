; BioSoft - Banco de pruebas de las salidas de bobina (Mega2560)
;
; Proyecto PlatformIO independiente, de banco: NO es firmware del sistema.
; Maneja a mano, desde el monitor serie, las salidas que van a la etapa de
; potencia: habilitaciones (23-26), PWM (44/45/46/6 a 3906 Hz), senoidal
; del AD9833 (SPI, CS 5), selector de fase (22) e interruptor general (3).
;
; Incluye los headers REALES del firmware via -I (pwmdriver.hpp,
; signalgenerator.hpp), no copias: el PWM y el AD9833 se configuran con el
; mismo codigo que usa la placa. Los PINES si estan copiados en main.cpp
; (viven como #define en SoftMega2560.ino, que no se puede incluir):
; si cambian alla, cambiarlos aca.

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

lib_deps =
    robtillaart/AD9833@0.4.5

build_flags =
    -I ../../mega2560/src

monitor_speed = 115200
