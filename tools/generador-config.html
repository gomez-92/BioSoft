const EMBEDDED = typeof window !== "undefined" && window.parent !== window;

/* ===========================================================================
 * EDITOR DE ESCENARIOS: corrida de referencia, resultado previsto y un
 * grafico por fuente con los puntos de control arrastrables. Todo lo que se
 * dibuja sale de SIM.run(): es la prediccion de lo que el Mega haria con
 * esta configuracion, no un dibujo aparte.
 * =========================================================================== */

// La corrida contra la que se dibuja: los mismos menus de la pantalla. No se
// guarda en el archivo (el operador la elige en la placa al iniciar): solo
// dice "si en la placa eligen esto, pasa esto otro". Indices sobre los menus.
let refRun = null;
function refDefaults(){
  const m = state.menus;
  // Duracion: la primera de 5 min o mas (alcanza para todos los perfiles),
  // si no la mas larga.
  const durs = m.duration || [];
  let di = durs.findIndex(d => d.value >= 300000);
  if (di < 0) di = Math.max(0, durs.length - 1);
  return {intensity: 0, frequency: 0, tolerance: 0, tempNormal: 0, tempCritical: 0, duration: di, mode: "x"};
}
function refResolved(){
  if (!refRun) refRun = refDefaults();
  const m = state.menus;
  const pick = (list, i) => (list && list.length) ? list[Math.min(i, list.length - 1)] : null;
  const it = pick(m.fieldIntensity, refRun.intensity), fr = pick(m.frequency, refRun.frequency);
  const to = pick(m.fieldTolerance, refRun.tolerance), tn = pick(m.temperatureNormal, refRun.tempNormal);
  let tc = pick(m.temperatureCritical, refRun.tempCritical);
  const du = pick(m.duration, refRun.duration);
  // El critico tiene que CONTENER al normal (la pantalla de la placa no deja
  // elegir otra cosa): si no, se toma el primero que lo contiene.
  const contiene = c => tn && c && c.min <= tn.min && tn.max <= c.max;
  if (tn && !contiene(tc)) {
    const i = (m.temperatureCritical || []).findIndex(contiene);
    if (i >= 0) { refRun.tempCritical = i; tc = m.temperatureCritical[i]; }
  }
  if (!it || !fr || !to || !tn || !tc || !du) return null;
  return {intensity: it.value, frequency: fr.value, tolerance: to.value,
          tempNormal: {min: tn.min, max: tn.max}, tempCritical: {min: tc.min, max: tc.max},
          durationS: du.value / 1000, mode: refRun.mode};
}

// Simulacion de la corrida de referencia con el formulario actual. Devuelve
// null si el formulario no se puede simular (puntos mal escritos, etc.).
function simulateForm(){
  const ref = refResolved();
  if (!ref) return null;
  const ok = state.detector.sources.every(s => s.sensor !== "scenario" ||
    (s.scenario && Array.isArray(s.scenario.points) && s.scenario.points.every(p =>
      Array.isArray(p) && isNum(p[0]) && isNum(p[1]))));
  if (!ok) return null;
  try { return {ref, sim: SIM.run(state, ref)}; } catch (e) { return null; }
}

const TIPO_ALERTA = {critical: "critico", streak: "racha", frequency: "frecuencia", silence: "silencio"};
const fmtT = s => {
  s = Math.round(s);
  return s < 60 ? s + " s" : Math.floor(s / 60) + " min" + (s % 60 ? " " + (s % 60) + " s" : "");
};

function sScenarios(){
  if (state.runType === "normal") return "";
  const anyScenario = state.detector.sources.some(s => s.sensor === "scenario");
  let h = '<section id="escenarios"><h2>5b · Escenarios de prueba (sensores simulados)</h2>' +
    '<p class="hint">Para probar el equipo <b>sin sensores</b>: el Mega inventa las lecturas de CEM1 y/o ' +
    'TEMP1 con la forma que se dibuja aca, y todo lo demas es real (alertas, cortes, pantallas y monitor). ' +
    'Las corridas salen marcadas <b>PRUEBA</b> y, si CEM1 es simulado, <b>las bobinas no se energizan</b>.</p>' +
    '<h3 class="paso"><span>1</span> Elegir una prueba</h3>' +
    '<div class="etapas" id="profileStatus"></div>' + libraryBar() +
    '<div class="perfiles">' +
    scenarioList().map(p => {
      // Un escenario que necesita mas tiempo que la duracion mas larga del
      // menu no puede terminar como promete: se ofrece deshabilitado.
      const maxDur = Math.max(0, ...(state.menus.duration || []).map(o => o.value / 1000).filter(isNum));
      const corto = p.minDuration && maxDur && p.minDuration > maxDur;
      const sub = corto ? "necesita " + Math.ceil(p.minDuration / 60) + " min y la duracion mas larga del menu es " +
          Math.round(maxDur / 60) + " min"
        : p.expect ? expectText(p) + " · " + Math.ceil(p.minDuration / 60) + " min o mas"
        : (p.factoryKey ? "de fabrica, modificado · " : "propio · ") + predictText(p);
      return '<button type="button" class="prof" data-profile="' + esc(p.key) + '"' + (corto ? " disabled" : "") +
        ' title="' + esc(p.description) + '"><b data-profile="' + esc(p.key) + '">' + esc(p.name) +
        '</b><small data-profile="' + esc(p.key) + '">' + esc(sub) + '</small></button>';
    }).join("") +
    '<button type="button" class="prof" data-real="1"><b data-real="1">Sensores reales</b>' +
    '<small data-real="1">MLX90393 y DS18B20: nada simulado</small></button></div>';
  if (!anyScenario) return h + '<p class="hint" style="margin-top:12px">Ninguna fuente usa ' +
    '<code>scenario</code>. Elegir una prueba, o poner el sensor de una fuente en <code>scenario</code> ' +
    '(seccion 5), para editar su senal.</p></section>';

  const m = state.menus, r = refRun || (refRun = refDefaults());
  const opt = (key, list, labelOf) => '<label class="f"><span>' + key[1] + '</span><select data-ref="' +
    key[0] + '">' + (list || []).map((o, i) => '<option value="' + i + '"' + (i === r[key[0]] ? " selected" : "") +
    '>' + esc(labelOf(o)) + '</option>').join("") + '</select></label>';
  h += '<h3 class="paso"><span>2</span> Contra que corrida mirarla</h3>' +
    '<p class="hint">Lo que se elegiria en la pantalla de la placa al iniciar. No se guarda en el archivo: ' +
    'la senal esta en <b>niveles</b> (0 = centro del normal, 1 = borde del normal, 2 = borde del critico), ' +
    'asi que el mismo escenario se adapta a cualquier rango; esto solo cambia en que unidades se dibuja.</p>' +
    '<div class="grid ref">' +
    opt(["intensity", "Intensidad"], m.fieldIntensity, o => o.label) +
    opt(["tolerance", "Tolerancia"], m.fieldTolerance, o => o.label) +
    opt(["frequency", "Frecuencia"], m.frequency, o => o.label) +
    opt(["tempNormal", "Temperatura normal"], m.temperatureNormal, o => o.label) +
    // Solo los criticos que contienen al normal elegido (como en la placa).
    '<label class="f"><span>Temperatura critica</span><select data-ref="tempCritical">' +
    (m.temperatureCritical || []).map((o, i) => {
      const tn = (m.temperatureNormal || [])[r.tempNormal];
      const ok = !tn || (o.min <= tn.min && tn.max <= o.max);
      return '<option value="' + i + '"' + (i === r.tempCritical ? " selected" : "") + (ok ? "" : " disabled") +
        '>' + esc(o.label) + (ok ? "" : " (no contiene al normal)") + '</option>';
    }).join("") + '</select></label>' +
    opt(["duration", "Duracion"], m.duration, o => o.label) +
    '<label class="f"><span>Modo</span><select data-ref="mode">' +
    '<option value="x"' + (r.mode === "x" ? " selected" : "") + '>Campo X</option>' +
    '<option value="null"' + (r.mode === "null" ? " selected" : "") + '>Campo nulo</option></select></label>' +
    '</div>' +
    '<h3 class="paso"><span>3</span> Resultado previsto</h3><div id="scnOutcome"></div>' +
    '<h3 class="paso"><span>4</span> Dibujar la senal</h3>' +
    '<p class="hint"><b>Arrastrar</b> un punto para moverlo · <b>clic</b> en un lugar vacio para agregar ' +
    'uno (hasta 8) · <b>doble clic</b> en un punto para borrarlo. Dos puntos en el mismo segundo hacen un ' +
    'salto. La linea es la senal dibujada; los puntos chicos, lo que leeria el Mega (con ruido y, en CEM1, ' +
    'con el lazo de control corrigiendo).</p>';
  state.detector.sources.forEach((s, i) => {
    if (s.sensor !== "scenario" || !s.scenario) return;
    const b = "detector.sources." + i + ".scenario.";
    const unit = s.name === "CEM1" ? "mT" : "°C";
    h += '<div class="sub scn"><h3>' + s.name + ' <small>' + (s.name === "CEM1" ? "campo magnetico" :
      "temperatura") + ', en ' + unit + (s.enabled ? "" : ' · <span class="alerta">no vigilada: no ' +
      'puede cortar</span>') + '</small></h3>' +
      '<div class="chart" data-chart="' + s.name + '" data-src="' + i + '"></div>' +
      '<div class="grid" style="margin-top:10px">' +
      '<label class="f" style="grid-column:1/-1"><span>Puntos (segundo:nivel) — tambien se pueden ' +
      'escribir, ej. <code>0:0  60:0  60:2,5</code></span><input type="text" data-path="' + b +
      'points" data-kind="pts" placeholder="sin puntos: nivel 0 todo el tiempo" value="' +
      esc(pointsToText(s.scenario.points)) + '"></label>' +
      num(b + "noise", FLT, "Ruido ± (niveles, en cada lectura)") +
      num(b + "oscAmp", FLT, "Oscilacion ± (niveles)") +
      num(b + "oscPeriod", FLT, "Periodo de la oscilacion (s, 0 = no oscila)") +
      num(b + "dropAt", FLT, "El sensor deja de responder a los (s, 0 = nunca)") +
      (s.name === "CEM1" ? num(b + "setpointDuty", FLT,
        "Duty con el que las bobinas dan el objetivo (0 = el campo no responde al lazo)") : "") +
      '</div></div>';
  });
  return h + '</section>';
}

// Barra de la biblioteca: solo embebido. Las operaciones las ejecuta el
// monitor (que pide confirmacion para borrar y restaurar).
function libraryBar(){
  if (!LIBRARY) return "";
  const sel = scenarioList().find(p => p.key === selectedScenario);
  const status = libStatus ? '<span class="' + (libStatus.ok ? "ok" : "alerta") + '">' + esc(libStatus.text) + '</span>' : "";
  if (!LIB_ADMIN) return '<p class="hint">Biblioteca del monitor. Crear, editar y borrar escenarios es para ' +
    'administradores. ' + status + '</p>';
  return '<div class="libbar">' +
    '<span>' + (sel ? 'Escenario elegido: <b>' + esc(sel.name) + '</b>' : 'Ningun escenario elegido') + '</span>' +
    '<button type="button" class="mini" data-lib="update"' + (sel ? "" : " disabled") +
      ' title="Guarda la senal del formulario en el escenario elegido">Guardar cambios</button>' +
    '<button type="button" class="mini" data-lib="create">Guardar como nuevo…</button>' +
    '<button type="button" class="mini" data-lib="delete"' + (sel ? "" : " disabled") + '>Borrar</button>' +
    '<button type="button" class="mini" data-lib="restore" title="Vuelve los de fabrica a sus valores y ' +
      'recrea los borrados; los propios no se tocan">Restaurar los de fabrica</button>' + status + '</div>';
}

function libraryAction(action){
  const sel = scenarioList().find(p => p.key === selectedScenario);
  const post = msg => window.parent.postMessage(msg, window.location.origin);
  if (action === "restore") { post({type: "biosoft-scenario-restore"}); return; }
  if (action === "delete") { if (sel) post({type: "biosoft-scenario-delete", id: sel.key, name: sel.name}); return; }
  const data = scenarioFromForm();
  if (!Object.keys(data.sources).length) {
    libStatus = {ok: false, text: "Ninguna fuente esta en scenario: no hay senal para guardar."};
    render(); return;
  }
  const name = window.prompt("Nombre del escenario", action === "update" && sel ? sel.name : "");
  if (name === null || !name.trim()) return;
  const description = window.prompt("Descripcion (que prueba y que deberia pasar)",
    action === "update" && sel ? sel.description : "");
  if (description === null) return;
  post({type: "biosoft-scenario-save", id: action === "update" && sel ? sel.key : null,
        scenario: Object.assign({name: name.trim(), description: description.trim()}, data)});
}

function outcomeHtml(res){
  if (!res) return '<div class="msg w">No se puede simular: hay puntos mal escritos (ver los errores).</div>';
  const {sim, ref} = res;
  const prof = scenarioList().find(p => p.key === profileOf(state) && p.expect);
  if (sim.refused) return '<div class="msg e"><b>No inicia.</b> ' + (sim.refused === "nomap"
    ? "En campo nulo el Mega necesita un punto del mapa (seccion 3) para esta intensidad y frecuencia."
    : "El balance del punto del mapa supera balanceMax.") + '</div>';
  let h;
  if (sim.cut) {
    const tipo = TIPO_ALERTA[sim.cut.type] || sim.cut.type;
    h = '<div class="msg e outcome"><b>Corta a los ' + fmtT(sim.cut.at) + '</b> por ' + tipo + ' de ' +
        sim.cut.source + (sim.cut.type === "silence" ? " (" + sim.cut.source + " SIN LECTURAS)" : "") + '.';
  } else {
    h = '<div class="msg o outcome"><b>Termina completo</b> (' + fmtT(ref.durationS) + ').';
  }
  const alerts = sim.events.filter(e => !sim.cut || e.t < sim.cut.at || e.type !== sim.cut.type);
  if (alerts.length) {
    const byType = {};
    alerts.forEach(e => { const k = e.source + " " + (TIPO_ALERTA[e.type] || e.type); (byType[k] = byType[k] || []).push(e); });
    h += ' Alertas antes: ' + Object.entries(byType).map(([k, es]) => k + " (" + es.length + ", desde " +
         fmtT(es[0].t) + ")").join(", ") + '.';
  } else if (!sim.cut) h += ' Sin alertas.';
  const notSim = ["CEM1", "TEMP1"].filter(n => !sim.simulated[n]);
  if (notSim.length) h += '<br><small>' + notSim.join(" y ") + ' con sensor real: no entra en la prediccion.</small>';
  if (state.detector.enabled === false) h += '<br><small>Detector apagado: ninguna fuente puede cortar.</small>';
  h += '</div>';
  if (prof) {
    const e = prof.expect;
    const matches = e.reason === "completed" ? !sim.cut
      : sim.cut && sim.cut.source === e.source && sim.cut.type === e.type;
    if (!matches) h += '<div class="msg w">El perfil "' + esc(prof.name) + '" promete: ' + esc(expectText(prof)) +
      '.' + (ref.durationS < prof.minDuration ? " La duracion elegida (" + fmtT(ref.durationS) +
      ") es mas corta que la que necesita (" + fmtT(prof.minDuration) + ")." : "") + '</div>';
  }
  return h;
}

/* ---------- grafico ---------- */
const CH = {W: 860, H: 250, L: 64, R: 54, T: 22, B: 30};
function chartGeom(name, sim){
  const s = state.detector.sources.find(x => x.name === name);
  const r = sim.ranges[name], sc = s.scenario, dur = sim.durationS;
  let lo = -3, hi = 3;
  const lv = [];
  for (let k = 0; k <= 200; k++) lv.push(SIM.shapeAt(sc, dur * k / 200));
  (sc.points || []).forEach(p => lv.push(p[1]));
  lo = Math.min(lo, Math.min(...lv) - (sc.noise || 0) - 0.3);
  hi = Math.max(hi, Math.max(...lv) + (sc.noise || 0) + 0.3);
  let vLo = SIM.levelToValue(r, lo), vHi = SIM.levelToValue(r, hi);
  sim.samples[name].forEach(p => { if (p.valid) { vLo = Math.min(vLo, p.v); vHi = Math.max(vHi, p.v); } });
  if (name === "CEM1") vLo = Math.max(vLo, 0);
  const pw = CH.W - CH.L - CH.R, ph = CH.H - CH.T - CH.B;
  const x = t => CH.L + pw * t / dur;
  const y = v => CH.T + ph * (1 - (v - vLo) / (vHi - vLo));
  const tOf = px => (px - CH.L) / pw * dur;
  const vOf = py => vLo + (1 - (py - CH.T) / ph) * (vHi - vLo);
  return {s, r, sc, dur, vLo, vHi, x, y, tOf, vOf, pw, ph};
}
function niceStep(range, n){
  const raw = range / n, p = Math.pow(10, Math.floor(Math.log10(raw)));
  return [1, 2, 2.5, 5, 10].map(k => k * p).find(k => k >= raw) || 10 * p;
}
function chartSvg(name, sim){
  const g = chartGeom(name, sim), {r, sc, dur, x, y} = g;
  const unit = name === "CEM1" ? "mT" : "°C";
  const dec = name === "CEM1" ? 3 : 1;
  const clampY = v => Math.max(CH.T, Math.min(CH.H - CH.B, y(v)));
  const band = (a, b, cls) => {
    const y1 = clampY(b), y2 = clampY(a);
    return y2 > y1 ? '<rect class="' + cls + '" x="' + CH.L + '" y="' + y1 + '" width="' + g.pw + '" height="' + (y2 - y1) + '"/>' : "";
  };
  let h = '<svg viewBox="0 0 ' + CH.W + ' ' + CH.H + '" role="img" aria-label="Senal de ' + name + '">';
  // zonas: critica (afuera), advertencia, normal
  // Sin superponer: cada franja pinta solo su tramo.
  h += band(r.criticalMax, g.vHi, "z-crit") + band(g.vLo, r.criticalMin, "z-crit") +
       band(r.normalMax, r.criticalMax, "z-warn") + band(r.criticalMin, r.normalMin, "z-warn") +
       band(r.normalMin, r.normalMax, "z-ok");
  // estabilizacion
  const st = state.intervals.mega.settlingTime / 1000;
  h += '<rect class="z-settle" x="' + CH.L + '" y="' + CH.T + '" width="' + (x(Math.min(st, dur)) - CH.L) +
       '" height="' + g.ph + '"/><text class="lbl" x="' + (CH.L + 4) + '" y="' + (CH.T + 11) + '">estabiliz.</text>';
  // ejes
  const ys = niceStep(g.vHi - g.vLo, 5);
  for (let v = Math.ceil(g.vLo / ys) * ys; v <= g.vHi + 1e-9; v += ys)
    h += '<line class="grid" x1="' + CH.L + '" x2="' + (CH.W - CH.R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>' +
         '<text class="ax" x="' + (CH.L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' +
         (+v.toFixed(dec)).toString().replace(".", ",") + '</text>';
  h += '<text class="ax" x="' + (CH.L - 6) + '" y="' + (CH.T - 8) + '" text-anchor="end">' + unit + '</text>';
  // Pasos de tiempo "redondos" (no 50 s ni 1 min 40 s).
  const xs = [5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600].find(k => dur / k <= 8) || 7200;
  for (let t = 0; t <= dur + 1e-9; t += xs)
    h += '<text class="ax" x="' + x(t) + '" y="' + (CH.H - 10) + '" text-anchor="middle">' + fmtT(t) + '</text>';
  // niveles a la derecha
  [-2, -1, 0, 1, 2].forEach(l => {
    const v = SIM.levelToValue(r, l);
    if (v < g.vLo || v > g.vHi) return;
    h += '<text class="lv" x="' + (CH.W - CH.R + 6) + '" y="' + (y(v) + 4) + '">' +
         (l === 0 ? "nivel 0" : (l > 0 ? "+" : "") + l) + '</text>';
  });
  // caida del sensor
  if (sc.dropAt > 0 && sc.dropAt <= dur)
    h += '<line class="drop" x1="' + x(sc.dropAt) + '" x2="' + x(sc.dropAt) + '" y1="' + CH.T + '" y2="' + (CH.H - CH.B) +
         '"/><text class="lbl" x="' + (x(sc.dropAt) + 4) + '" y="' + (CH.H - CH.B - 6) + '">sensor caido</text>';
  // senal dibujada (forma, sin ruido)
  const N = 400, pts = [];
  for (let k = 0; k <= N; k++) {
    const t = dur * k / N;
    pts.push(x(t).toFixed(1) + "," + clampY(SIM.levelToValue(r, SIM.shapeAt(sc, t))).toFixed(1));
  }
  (sc.points || []).forEach(p => { if (p[0] <= dur) pts.push(null); });
  h += '<polyline class="shape" points="' + pts.filter(Boolean).join(" ") + '"/>';
  // lo que leeria el Mega
  sim.samples[name].forEach(p => {
    if (!p.valid) return;
    const cls = (p.v < r.criticalMin || p.v > r.criticalMax) ? "s-crit" : (p.v < r.normalMin || p.v > r.normalMax) ? "s-warn" : "s-ok";
    h += '<circle class="smp ' + cls + (p.settling ? " s-set" : "") + '" cx="' + x(p.t).toFixed(1) + '" cy="' +
         clampY(p.v).toFixed(1) + '" r="2"/>';
  });
  // alertas de esta fuente y corte
  sim.events.filter(e => e.source === name).forEach(e => {
    const px = x(e.t);
    h += '<path class="ev ev-' + e.type + '" d="M' + (px - 5) + ',' + CH.T + ' L' + (px + 5) + ',' + CH.T + ' L' + px + ',' +
         (CH.T + 8) + ' Z"><title>' + (TIPO_ALERTA[e.type] || e.type) + ' ' + e.count + '/' + e.limit + ' a los ' +
         fmtT(e.t) + '</title></path>';
  });
  if (sim.cut) {
    const px = x(sim.cut.at);
    h += '<line class="cut" x1="' + px + '" x2="' + px + '" y1="' + CH.T + '" y2="' + (CH.H - CH.B) + '"/>' +
         '<text class="lbl cutl" x="' + (px + 4) + '" y="' + (CH.T + 22) + '">corte ' + fmtT(sim.cut.at) + '</text>';
  }
  // puntos de control, arrastrables
  (sc.points || []).forEach((p, k) => {
    if (p[0] > dur) return;
    const v = SIM.levelToValue(r, p[1]);
    h += '<circle class="cp" data-pt="' + k + '" cx="' + x(p[0]).toFixed(1) + '" cy="' + clampY(v).toFixed(1) +
         '" r="7"><title>' + p[0] + ' s · nivel ' + String(p[1]).replace(".", ",") + ' · ' +
         (+v.toFixed(dec)).toString().replace(".", ",") + ' ' + unit + '</title></circle>';
  });
  const hidden = (sc.points || []).filter(p => p[0] > dur).length;
  if (hidden) h += '<text class="lbl" x="' + (CH.W - CH.R - 4) + '" y="' + (CH.T + 11) + '" text-anchor="end">' + hidden +
                   ' punto(s) despues del final de la corrida</text>';
  return h + '</svg>';
}

let lastSim = null;
function paintScenario(){
  if (typeof document.querySelectorAll !== "function") return;
  const box = document.getElementById("scnOutcome");
  if (!box || !box.isConnected) return;
  const res = simulateForm();
  lastSim = res;
  box.innerHTML = outcomeHtml(res);
  document.querySelectorAll("[data-chart]").forEach(el => {
    el.innerHTML = res && !res.sim.refused ? chartSvg(el.dataset.chart, res.sim) : "";
  });
}

/* ---------- interaccion con el grafico ---------- */
let drag = null;   // {el, src, k, moved}
function svgPoint(el, ev){
  const svg = el.querySelector("svg");
  const rc = svg.getBoundingClientRect();
  return {px: (ev.clientX - rc.left) * CH.W / rc.width, py: (ev.clientY - rc.top) * CH.H / rc.height};
}
function pointsPathOf(el){ return "detector.sources." + el.dataset.src + ".scenario.points"; }
function syncPointsInput(el){
  const input = document.querySelector('input[data-path="' + pointsPathOf(el) + '"]');
  if (input) input.value = pointsToText(getPath(pointsPathOf(el)));
}
function pointFromEvent(el, ev){
  if (!lastSim) return null;
  const g = chartGeom(el.dataset.chart, lastSim.sim);
  const {px, py} = svgPoint(el, ev);
  return {t: Math.round(Math.max(0, Math.min(g.dur, g.tOf(px)))),
          level: Math.max(-SCENARIO_MAX_LEVEL, Math.min(SCENARIO_MAX_LEVEL,
                   Math.round(SIM.valueToLevel(g.r, g.vOf(py)) * 20) / 20))};
}
if (typeof document.querySelectorAll === "function") {
  document.addEventListener("pointerdown", ev => {
    const el = ev.target.closest && ev.target.closest("[data-chart]");
    if (!el || ev.button !== 0) return;
    const k = ev.target.dataset && ev.target.dataset.pt;
    if (k === undefined) return;
    drag = {el, k: parseInt(k, 10), moved: false};
    try { el.setPointerCapture(ev.pointerId); } catch (e) { /* sin captura igual se arrastra */ }
    ev.preventDefault();
  });
  document.addEventListener("pointermove", ev => {
    if (!drag) return;
    const p = pointFromEvent(drag.el, ev);
    if (!p) return;
    const pts = getPath(pointsPathOf(drag.el));
    const prev = pts[drag.k - 1], next = pts[drag.k + 1];
    if (prev) p.t = Math.max(p.t, prev[0]);
    if (next) p.t = Math.min(p.t, next[0]);
    pts[drag.k] = [p.t, p.level];
    drag.moved = true;
    syncPointsInput(drag.el);
    validate();
  });
  document.addEventListener("pointerup", () => { if (drag) setTimeout(() => { drag = null; }, 0); });
  document.addEventListener("click", ev => {
    const el = ev.target.closest && ev.target.closest("[data-chart]");
    if (!el || (drag && drag.moved) || (ev.target.dataset && ev.target.dataset.pt !== undefined)) return;
    const pts = getPath(pointsPathOf(el));
    if (!Array.isArray(pts) || pts.length >= SCENARIO_MAX_POINTS) return;
    const p = pointFromEvent(el, ev);
    if (!p) return;
    let at = pts.findIndex(q => q[0] > p.t);
    if (at < 0) at = pts.length;
    pts.splice(at, 0, [p.t, p.level]);
    syncPointsInput(el);
    validate();
  });
  document.addEventListener("dblclick", ev => {
    const el = ev.target.closest && ev.target.closest("[data-chart]");
    const k = ev.target.dataset && ev.target.dataset.pt;
    if (!el || k === undefined) return;
    getPath(pointsPathOf(el)).splice(parseInt(k, 10), 1);
    syncPointsInput(el);
    validate();
  });
  document.addEventListener("change", ev => {
    const key = ev.target.dataset && ev.target.dataset.ref;
    if (!key) return;
    if (!refRun) refRun = refDefaults();
    refRun[key] = key === "mode" ? ev.target.value : parseInt(ev.target.value, 10);
    // Cambiar el normal cambia que criticos se pueden elegir.
    if (key === "tempNormal") { refResolved(); render(); return; }
    paintScenario();
  });
}

function render(){
  document.getElementById("app").innerHTML =
    sRunType() + sMenus() + sIntervals() + sControl() + sCoils() + sDetector() + sScenarios() + sCurrent() + sTelemetry() +
    (EMBEDDED ? "" : sWifi() + sBroker()) + sPreview();
  buildIndex();
  validate();
}

// Indice: un enlace por seccion, armado de sus <h2> ("5b · Escenarios ...").
// PASOS (fase 3): el formulario se recorre de a una seccion, con pestañas
// numeradas arriba y Anterior / Siguiente al pie, en vez de una sola pagina
// interminable. Los errores y avisos siguen arriba de todo, visibles desde
// cualquier paso: bloquean la descarga y el envio sin importar donde esten.
// Todas las secciones siguen en el DOM (solo se ocultan): validate() y
// buildJson() leen el estado, no lo que se ve.
let currentStep = 0;
const msgOpen = {avisos: false, info: false};
if (typeof document.querySelectorAll === "function") {
  // toggle no burbujea: se escucha en captura.
  document.addEventListener("toggle", ev => {
    const k = ev.target && ev.target.dataset && ev.target.dataset.pliegue;
    if (k) msgOpen[k] = ev.target.open;
  }, true);
}

function stepTitles(){
  return [...document.querySelectorAll("#app > section")].map((sec, i) => {
    const h = sec.querySelector("h2");
    const full = h ? h.textContent : "Seccion " + i;
    const m = full.match(/^\s*(\S+)\s*·\s*(.*)$/);
    // "Escenarios de prueba (sensores simulados)" -> "Escenarios de prueba"
    const title = (m ? m[2] : full).replace(/\s*\(.*\)\s*$/, "");
    return {num: m ? m[1] : "", title};
  });
}

function buildIndex(){
  const nav = document.getElementById("indice");
  if (!nav || typeof document.querySelectorAll !== "function") return;
  const secs = [...document.querySelectorAll("#app > section")];
  const titles = stepTitles();
  if (currentStep >= secs.length) currentStep = secs.length - 1;
  nav.innerHTML = titles.map((t, i) =>
    '<button type="button" data-paso="' + i + '" data-num="' + esc(t.num) + '" class="' + (i === currentStep ? "on" : "") + '"' +
    (i === currentStep ? ' aria-current="step"' : "") + '>' +
    (t.num ? '<span class="num">' + esc(t.num) + '</span>' : "") + esc(t.title) + '</button>').join("");
  secs.forEach((sec, i) => {
    if (!sec.id) sec.id = "sec-" + i;
    sec.classList.toggle("activa", i === currentStep);
    // Lugar para los errores de ESTE paso, debajo del titulo y la ayuda.
    if (!sec.querySelector(".paso-errores")) {
      const box = document.createElement("div");
      box.className = "paso-errores";
      box.dataset.num = titles[i].num;
      const h2 = sec.querySelector("h2");
      const hint = h2 && h2.nextElementSibling && h2.nextElementSibling.classList.contains("hint") ? h2.nextElementSibling : h2;
      if (hint) hint.insertAdjacentElement("afterend", box); else sec.prepend(box);
    }
    if (sec.querySelector(".pasos-nav")) return;
    const prev = titles[i - 1], next = titles[i + 1];
    const div = document.createElement("div");
    div.className = "pasos-nav";
    div.innerHTML =
      (prev ? '<button type="button" data-paso="' + (i - 1) + '">← ' + esc(prev.title) + '</button>' : '<span></span>') +
      '<span class="pasos-cuenta">Paso ' + (i + 1) + ' de ' + secs.length + '</span>' +
      (next ? '<button type="button" class="primary" data-paso="' + (i + 1) + '">' + esc(next.title) + ' →</button>' : '<span></span>');
    sec.appendChild(div);
  });
  const active = nav.querySelector("button.on");
  if (active && active.scrollIntoView) active.scrollIntoView({block: "nearest", inline: "nearest"});
}

// Primer paso (indice) con errores, o -1. Los pasos posteriores a el quedan
// bloqueados: no se avanza arrastrando errores (fase 3, pedido del usuario:
// "un paso condiciona el proximo"). Volver atras siempre se puede.
function firstErrorStep(){
  if (typeof document.querySelectorAll !== "function") return -1;
  const nums = stepTitles().map(t => t.num);
  return nums.findIndex(n => (secCount[n] || {}).e > 0);
}

/* FRONTERA (fase 3, pedido del usuario). `frontier` es el paso mas lejano
 * al que se llego AVANZANDO EN ORDEN despues del ultimo cambio:
 *  - hasta la frontera se salta libremente (volver a mirar no cambia nada);
 *  - mas alla, solo con "Siguiente" desde la frontera, de a un paso, y solo
 *    si no hay errores en ese paso ni en los anteriores;
 *  - CUALQUIER cambio en la configuracion hecho estando en el paso k lleva la
 *    frontera a k: lo que viene despues se vuelve a recorrer y a validar
 *    contra el cambio. Se detecta comparando el estado entero despues de
 *    cada accion (stateMark), no enganchando cada campo: asi no se escapa un
 *    cambio por un camino nuevo (un escenario, un punto del mapa, Deshacer).
 *  - Descargar / Enviar solo con la frontera en el ultimo paso y sin
 *    errores: nunca sale una configuracion a medio revisar.
 */
let frontier = 0;
let stateMark = null;

function lastStepIndex(){
  return typeof document.querySelectorAll === "function"
    ? document.querySelectorAll("#app > section").length - 1 : 0;
}
function errorsUpTo(i){
  return stepTitles().slice(0, i + 1).some(t => (secCount[t.num] || {}).e > 0);
}
// Todos los pasos recorridos despues del ultimo cambio, y sin errores.
function fullyReviewed(){
  if (typeof document.querySelectorAll !== "function") return errors.length === 0;
  return errors.length === 0 && frontier >= lastStepIndex();
}
// Llamada en cada paint(): si el estado cambio, la frontera vuelve al paso
// donde se hizo el cambio.
function trackChanges(){
  const mark = JSON.stringify(state);
  if (stateMark !== null && mark !== stateMark && frontier > currentStep) frontier = currentStep;
  stateMark = mark;
}
// Empezar el recorrido de cero (archivo cargado, configuracion de la placa,
// defaults restaurados).
function restartSteps(){
  frontier = 0;
  currentStep = 0;
  stateMark = null;
}

function updateStepBadges(){
  if (typeof document.querySelectorAll !== "function") return;
  const titles = stepTitles();
  document.querySelectorAll("#indice button[data-num]").forEach(b => {
    const i = parseInt(b.dataset.paso, 10);
    const c = secCount[b.dataset.num] || {e: 0, w: 0};
    const bloqueado = i > frontier;
    b.classList.toggle("has-e", !bloqueado && c.e > 0);
    b.classList.toggle("has-w", !bloqueado && !c.e && c.w > 0);
    b.classList.toggle("hecho", i < frontier && !c.e);
    b.disabled = bloqueado;
    b.title = bloqueado ? "Se habilita avanzando con Siguiente desde el paso " + (frontier + 1)
      : c.e ? c.e + " error(es) en este paso" : c.w ? c.w + " aviso(s) en este paso" : "";
  });
  // Errores del paso, adentro del paso; los avisos plegados debajo.
  document.querySelectorAll(".paso-errores").forEach(box => {
    const m = secMsgs[box.dataset.num] || {e: [], w: []};
    const li = arr => "<ul>" + arr.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>";
    box.innerHTML =
      (m.e.length ? '<div class="msg e"><b>Para seguir, corregir ' + (m.e.length === 1 ? "esto" : "estos " + m.e.length +
        " puntos") + ':</b>' + li(m.e) + '</div>' : '') +
      (m.w.length ? '<details class="msg w plegable" data-pliegue="w-' + esc(box.dataset.num) + '"' +
        (msgOpen['w-' + box.dataset.num] ? ' open' : '') + '><summary><b>' + m.w.length + ' aviso(s) en este paso</b>' +
        '</summary>' + li(m.w) + '</details>' : '');
  });
  // Siguiente: solo sin errores en este paso ni en los anteriores.
  document.querySelectorAll(".pasos-nav button.primary").forEach(b => {
    const i = parseInt(b.dataset.paso, 10) - 1;
    const bloquea = errorsUpTo(i);
    b.disabled = bloquea;
    b.title = bloquea ? "Corregir los errores de este paso (o de uno anterior) para seguir" : "";
  });
  // Descargar / Enviar: con todo recorrido despues del ultimo cambio.
  const listo = fullyReviewed();
  ["dl", "send"].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.disabled = !listo;
    el.title = listo ? "" : errors.length
      ? "Hay errores: corregirlos antes de " + (id === "dl" ? "descargar" : "enviar")
      : "Recorrer los pasos hasta el final (Siguiente) despues del ultimo cambio";
  });
  const pend = document.getElementById("pasosPendientes");
  if (pend) pend.textContent = listo ? "" : errors.length ? "" :
    "Revisado hasta el paso " + (frontier + 1) + " de " + titles.length + ": seguir con Siguiente para habilitar " +
    (EMBEDDED ? "el envio" : "la descarga") + ".";
}

function goToStep(i, focusSection){
  if (i > frontier) {
    // Solo se cruza la frontera de a un paso, desde ella y sin errores.
    if (i !== frontier + 1 || currentStep !== frontier || errorsUpTo(frontier)) return;
    frontier = i;
  }
  currentStep = i;
  buildIndex();
  updateStepBadges();
  if (typeof window !== "undefined" && window.scrollTo) window.scrollTo(0, 0);
  if (focusSection && focusSection.scrollIntoView) focusSection.scrollIntoView({block: "start"});
}

if (typeof window !== "undefined" && typeof document.querySelectorAll === "function") {
  document.addEventListener("click", ev => {
    const b = ev.target.closest && ev.target.closest("[data-paso]");
    if (b) { goToStep(parseInt(b.dataset.paso, 10)); return; }
    // Un enlace interno a otra seccion (ej. "ver 5b") cambia de paso.
    const a = ev.target.closest && ev.target.closest('a[href^="#"]');
    if (!a) return;
    const target = document.getElementById(a.getAttribute("href").slice(1));
    const sec = target && target.closest("#app > section");
    if (!sec) return;
    ev.preventDefault();
    goToStep([...document.querySelectorAll("#app > section")].indexOf(sec));
  });
}

function sControlMap(){
  const map = Array.isArray(state.control.map) ? state.control.map : [];
  let h = '<div class="sub"><h3>Mapa de calibracion (campo &harr; duty &harr; balance) ' +
    '<span style="color:var(--muted);font-weight:400">(' + map.length + '/' + MAX_MAP_POINTS + ')</span></h3>' +
    '<p class="hint">Un punto por <b>combinacion</b> de intensidad y frecuencia, indexado por <b>valor</b> y ' +
    'no por posicion en el menu (los menus son configurables). <b>duty</b> es el duty comun que da esa ' +
    'intensidad (en campo X el experimento <b>parte de ahi</b> y el lazo solo corrige; en campo nulo se ' +
    'excita con ese duty fijo y sin lazo). <b>balance</b> es el delta del campo nulo: las bobinas directas ' +
    'toman duty&middot;(1+balance) y las del mux duty&middot;(1&minus;balance); se mide en banco para cada ' +
    'punto, no es unico. Un valor de cada uno que no se midio <b>no se inventa</b>: sin punto, el campo X ' +
    'arranca de duty 0 como siempre y el <b>campo nulo se rechaza</b>. El procedimiento de medicion esta en ' +
    '<code>docs/protocolo-calibracion-intensidad.md</code>. Viaja al Mega2560 en frames <code>config_map</code>.</p>';

       '>Agregar las combinaciones del menu que faltan</button></div></div>';
  return h;
}

function sCoils(){
  let h = '<section><h2>4 · Canales de bobina</h2>' +
    '<p class="hint">Hay <b>un solo magnetometro</b>, asi que no existe lazo por bobina: el ' +

/* ===========================================================================
 * Edicion
 *
 * Los cambios de valor solo actualizan el estado y revalidan: NO re-renderizan,
 * porque reconstruir el DOM en cada tecla haria perder el foco del campo que se
 * esta escribiendo. Solo las operaciones estructurales (agregar/quitar opcion,
 * cargar archivo, restaurar defaults) vuelven a renderizar.
 * =========================================================================== */
document.addEventListener("input", onEdit);
document.addEventListener("change", onEdit);

// Nota corta debajo de un campo que volvio a su ultimo valor valido.
function limitNote(el, text){
  const lbl = el.closest && el.closest("label");
  if (!lbl) return;
  let n = lbl.querySelector(".limite-nota");
  if (!n) { n = document.createElement("span"); n.className = "limite-nota"; lbl.appendChild(n); }
  n.textContent = text;
  clearTimeout(n._t);
  n._t = setTimeout(() => n.remove(), 6000);
}

function onEdit(e){
  const el = e.target;
  const path = el.dataset && el.dataset.path;
  if (!path) return;
  const kind = el.dataset.kind;
  let v;
  if (kind === "bool") v = el.checked;
  // Puntos del escenario: si el texto no se entiende se guarda tal cual
  // (string) y validate() lo marca como error, en vez de perder lo escrito.
  else if (kind === "pts"){
    const pts = textToPoints(el.value);
    v = pts === null ? el.value : pts;
  }
  else if (kind === "str"){
    v = el.value;
    // address y channel de los ADS1115 son numericos aunque su widget sea un
    // <select>. Solo ahi: detector.sources[].address es el ROM code del
    // DS18B20, un texto, y parseInt lo dejaria en 28.
    if (/^currentSensors\.\d+\.(address|channel)$/.test(path)) v = parseInt(v, 10);
  } else {
    v = el.value === "" ? NaN : Number(el.value);
    const lim = limitsFor(path);
    if (lim) {
      const ok = withinLimits(v, lim);
      if (ok) lastValid[path] = v;
      else if (e.type === "change") {
        // Al salir del campo, fuera de rango no queda: vuelve al ultimo
        // valido (o al borde mas cercano si nunca hubo uno).
        const back = path in lastValid ? lastValid[path]
          : Math.min(lim.max, Math.max(lim.min, lim.int ? Math.round(isNum(v) ? v : lim.min) : (isNum(v) ? v : lim.min)));
        el.value = back;
        v = back;
        limitNote(el, "Permitido: " + fmtLim(lim.min) + " a " + fmtLim(lim.max) + (lim.int ? ", entero" : "") +
                      " · volvio a " + fmtLim(back));
      }
      if (el.classList) el.classList.toggle("fuera", !withinLimits(v, lim));
    }
  }
  setPath(path, v);
  if (path === "runType") {
    if (v === "normal") enforceExperiment(); else runTypeNotice = null;
    render(); return;
  }
  // Cambiar el sensor de una fuente cambia que campos tiene (escenario,
  // direccion del DS18B20): es estructural, se vuelve a dibujar.
  if (/^detector\.sources\.\d+\.sensor$/.test(path)) { render(); return; }
  validate();
}

document.addEventListener("click", e => {
  const add = e.target.dataset && e.target.dataset.add;
  const del = e.target.dataset && e.target.dataset.del;
  if (e.target.dataset && e.target.dataset.mapadd){
    if (!Array.isArray(state.control.map)) state.control.map = [];
    if (state.control.map.length < MAX_MAP_POINTS)
      {
        // El punto nuevo arranca en la primera combinacion del menu que no
        // tiene punto (o la primera, si estan todas).
        const combos = menuCombos();
        const libre = combos.find(cb => !state.control.map.some(p => mapMatches(p, cb))) || combos[0] || {intensity: 0, frequency: 0};
        state.control.map.push({intensity: libre.intensity, frequency: libre.frequency, duty: 0, balance: 0});
      }
    render();
  } else if (e.target.dataset && e.target.dataset.mapfill){
    fillMapGaps();
    render();
  } else if (e.target.dataset && e.target.dataset.mapdel !== undefined){
    state.control.map.splice(parseInt(e.target.dataset.mapdel, 10), 1);
    render();
  } else if (add){
    const m = MENUS.find(x => x.key === add);
    state.menus[add].push(m.range ? {label:"", min:0, max:0} : {label:"", value:0});
    render();
  } else if (del){
    state.menus[del].splice(parseInt(e.target.dataset.i, 10), 1);
    render();
  } else if (e.target.dataset && e.target.dataset.undoRuntype){
    undoExperiment();
  } else if (e.target.dataset && e.target.dataset.lib){
    libraryAction(e.target.dataset.lib);
  } else if (e.target.dataset && e.target.dataset.profile){
    applyProfile(e.target.dataset.profile);
  } else if (e.target.dataset && e.target.dataset.real){
    realSensors();
  }
});

/* ===========================================================================
 * Validacion
 *
 * Dos niveles, y la diferencia importa:
 *   error -> el firmware descartaria ese valor (o el archivo entero) EN
 *            SILENCIO. Bloquea la descarga.
 *   aviso -> el archivo es valido, pero la combinacion tiene una consecuencia
 *            que recien se ve en banco. No bloquea.
 * =========================================================================== */
let errors = [], warns = [], info = "";
// En que paso cae cada error/aviso (el numero del <h2>: "0".."9", "5b"):
// validate() lo fija al empezar cada seccion, y la pestaña de ese paso se
// marca en rojo o ambar. Asi se sabe DONDE esta el problema sin leer la lista.
let vsec = "";
let secCount = {};
let secMsgs = {};
const bumpSec = (k, m) => {
  (secCount[vsec] = secCount[vsec] || {e: 0, w: 0})[k]++;
  ((secMsgs[vsec] = secMsgs[vsec] || {e: [], w: []})[k]).push(m);
};
const err  = m => { errors.push(m); bumpSec("e", m); };
const warn = m => { warns.push(m); bumpSec("w", m); };

const isInt = v => Number.isFinite(v) && Number.isInteger(v);
const isNum = v => Number.isFinite(v);

/* Combinaciones intensidad x frecuencia que el operador puede elegir en la
 * pantalla. Un menu vacio cae a los defaults compilados (como en el firmware),
 * y los que exceden el tope se ignoran en la placa, asi que no cuentan. */
function menuCombos(){
  const pick = key => {
    const l = (state.menus[key] && state.menus[key].length ? state.menus[key] : DEFAULTS.menus[key])
      .slice(0, menuMax(key)).map(o => o.value).filter(isNum);
    return [...new Set(l)];
  };
  const out = [];
  pick("fieldIntensity").forEach(i => pick("frequency").forEach(f => out.push({intensity: i, frequency: f})));
  return out;
}
const mapMatches = (p, c) => isNum(p.intensity) && isNum(p.frequency) &&
  Math.abs(p.intensity - c.intensity) <= MAP_MATCH_INT && Math.abs(p.frequency - c.frequency) <= MAP_MATCH_FREQ;

function fillMapGaps(){
  if (!Array.isArray(state.control.map)) state.control.map = [];
  menuCombos().forEach(c => {
    if (state.control.map.length >= MAX_MAP_POINTS) return;
    if (!state.control.map.some(p => mapMatches(p, c)))
      state.control.map.push({intensity: c.intensity, frequency: c.frequency, duty: 0, balance: 0});
  });
}

function validateControlMap(){
  const c = state.control;
  const bmax = c.balanceMax;
  const bmaxOk = isNum(bmax) && bmax >= 0 && bmax <= MAX_BALANCE;
  if (!bmaxOk)
    err("control.balanceMax tiene que estar entre 0 y " + MAX_BALANCE + ": el Mega lo rechaza fuera de ese " +
        "rango y se queda con su valor anterior.");
  if (!Array.isArray(c.map)){
    err("control.map tiene que ser una lista de puntos.");
    return;
  }
  if (c.map.length > MAX_MAP_POINTS)
    err("control.map tiene " + c.map.length + " puntos: el Mega guarda " + MAX_MAP_POINTS +
        " como maximo (3 intensidades x 3 frecuencias) y los demas se ignoran.");
  c.map.forEach((p, i) => {
    const tag = "Mapa, punto " + (i + 1);
    if (!isNum(p.intensity) || p.intensity <= 0 || p.intensity > 100)
      err(tag + ": la intensidad tiene que estar entre 0 (excluido) y 100 mT.");
    if (!isNum(p.frequency) || p.frequency <= 0 || p.frequency > 1000)
      err(tag + ": la frecuencia tiene que estar entre 0 (excluida) y 1000 Hz.");
    if (!isNum(p.duty) || p.duty <= 0 || p.duty > 1)
      err(tag + ": el duty tiene que ser mayor que 0 y no pasar de 1" +
          (p.duty === 0 ? " (todavia sin medir en banco)." : "."));
    if (!isNum(p.balance) || Math.abs(p.balance) > MAX_BALANCE)
      err(tag + ": el balance tiene que estar entre -" + MAX_BALANCE + " y " + MAX_BALANCE + ".");
    else if (bmaxOk && Math.abs(p.balance) > bmax)
      err(tag + ": |balance| " + Math.abs(p.balance) + " supera control.balanceMax (" + bmax +
          "): el Mega rechazaria el arranque de campo nulo en este punto, no lo recortaria.");
    c.map.forEach((q, j) => {
      if (j > i && mapMatches(p, q))
        err(tag + " y " + (j + 1) + ": misma intensidad y frecuencia. Un punto por combinacion.");
    });
  });

  // Cobertura: el campo nulo sin punto se rechaza en el Mega (la pantalla
  // muestra "NO INICIO"). Mejor avisar aca, antes de llegar al banco.
  const combos = menuCombos();
  const faltan = combos.filter(cb => !c.map.some(p => mapMatches(p, cb)));
  if (faltan.length)
    warn("Campo nulo no disponible para " + faltan.map(cb => cb.intensity + " mT / " + cb.frequency + " Hz").join(", ") +
         ": no tienen punto en control.map y el Mega rechaza ese arranque. El campo X sigue funcionando " +
         "(parte de duty 0, sin mapa).");
  const sobran = c.map.filter(p => !combos.some(cb => mapMatches(p, cb)));
  if (sobran.length)
    err("control.map tiene " + sobran.length + " punto(s) que no coinciden con ninguna combinacion de los " +
         "menus de intensidad y frecuencia: nunca se van a usar.");
}

function validate(){
  errors = []; warns = []; info = ""; secCount = {}; secMsgs = {}; vsec = "";

  /* --- 0. runType --- */
  vsec = "0";
  if (state.runType === "normal") {
    state.detector.sources.forEach(s => {
      const real = REAL_SENSOR[s.name];
      if (real && s.sensor !== real)
        err("Experimento con " + s.name + " en " + s.sensor + ": un experimento corre solo con sensores reales (" +
            real + "). Cambiarlo, o declarar la corrida como test.");
    });
    if (state.detector.enabled !== true)
      err("Experimento con el Detector apagado: un experimento corre siempre con el Detector encendido.");
  }
  if (!RUN_TYPES.includes(state.runType))
    err('Tipo de corrida "' + state.runType + '": el firmware solo entiende "normal" o "test". ' +
        'Cualquier otro valor lo lee como "normal", y las corridas de prueba entrarian al historico ' +
        'como experimentos.');
  else if (state.runType === "test")
    warn("Tipo de corrida test: todas las corridas con esta tarjeta salen marcadas como PRUEBA y el " +
         "monitor remoto no las lista junto a los experimentos. Para un experimento real, volver a normal.");
  if (state.requireMega === false)
    warn("No se exige la placa de control: sin Mega conectado se puede iniciar y recorrer las " +
         "pantallas sin que nada se energice. Solo para banco.");
  else if (state.requireMega !== true)
    err("requireMega tiene que ser true o false: con cualquier otra cosa el ESP32 lo ignora y exige el Mega.");

  /* --- 1. menus --- */
  vsec = "1";
  MENUS.forEach(m => {
    const list = state.menus[m.key];
    if (list.length === 0)
      warn('Menu "' + m.title + '" vacio: la pantalla usaria los defaults compilados.');
    if (list.length > menuMax(m.key))
      err('Menu "' + m.title + '" tiene ' + list.length + ' opciones: a partir de la ' +
          (menuMax(m.key) + 1) + ' se ignoran' +
          (MENU_CAP[m.key] ? " (el mapa del campo nulo no pasa de 3 x 3 = 9 combinaciones)." : "."));
    list.forEach((o, i) => {
      const tag = m.title + " — opcion " + (i + 1);
      if (!o.label || !o.label.trim()) err(tag + ": falta la etiqueta.");
      else if (o.label.length > MAX_LABEL)
        warn(tag + ": la etiqueta se truncara a " + MAX_LABEL + " caracteres.");
      if (m.range){
        if (!isNum(o.min) || !isNum(o.max)) err(tag + ": min y max tienen que ser numeros.");
        else if (o.min >= o.max) err(tag + ": min (" + o.min + ") tiene que ser menor que max (" + o.max + ").");
      } else if (!isNum(o.value)){
        err(tag + ": el valor tiene que ser un numero.");
      } else if (m.kind === INT && !isInt(o.value)){
        err(tag + ": " + m.title + " es un entero. Escrito con decimales, ConfigLoader lo lee con " +
            '"value | 0" y el fallback se aplica cuando el tipo no coincide: la opcion quedaria en 0.');
      } else if (o.value <= 0){
        err(tag + ": el valor tiene que ser mayor que 0.");
      }
    });
  });

  // El Detector del Mega da por sentado que los dos rangos de temperatura
  // estan ANIDADOS: criticalMin <= normalMin < normalMax <= criticalMax (ver
  // Source::addSample en mega2560/src/detector.hpp).
  //
  // La pantalla Configuraciones YA NO deja armar un par que no lo cumpla:
  // al elegir uno de los dos rangos rellena el otro combo solo con los
  // compatibles. Asi que no hace falta que todos los pares sirvan -- lo que
  // si hace falta es que ninguna opcion quede HUERFANA: una opcion sin
  // ningun compatible del otro lado se puede elegir y deja el otro combo
  // vacio, sin forma de completar la configuracion.
  const normales = state.menus.temperatureNormal || [];
  const criticos = state.menus.temperatureCritical || [];
  const anidado = (n, c) => c.min <= n.min && n.min < n.max && n.max <= c.max;
  const rangoOk = o => isNum(o.min) && isNum(o.max);

  normales.forEach((n, ni) => {
    if (!rangoOk(n)) return;
    if (criticos.filter(rangoOk).some(c => anidado(n, c))) return;
    err("Rango normal opcion " + (ni + 1) + " (" + n.min + "~" + n.max + "): ningun rango critico " +
        "lo contiene. Elegirlo en la pantalla dejaria el combo de temperatura critica vacio.");
  });

  criticos.forEach((c, ci) => {
    if (!rangoOk(c)) return;
    if (normales.filter(rangoOk).some(n => anidado(n, c))) return;
    err("Rango critico opcion " + (ci + 1) + " (" + c.min + "~" + c.max + "): no contiene a ningun " +
        "rango normal. Elegirlo en la pantalla dejaria el combo de temperatura normal vacio.");
  });

  /* --- 2. intervals --- */
  vsec = "2";
  const chkInterval = (grp, meta) => meta.forEach(([k, lbl]) => {
    const v = state.intervals[grp][k];
    if (!isInt(v))
      err("Intervalo " + lbl + " (" + grp + "." + k + "): tiene que ser un entero en ms. " +
          "Con decimales, is<unsigned long>() lo rechaza y queda el default compilado.");
    else if (v <= 0)
      err("Intervalo " + lbl + " (" + grp + "." + k + "): un 0 se rechaza, esa tarea nunca correria.");
  });
  chkInterval("esp32", INTERVALS_ESP32);
  chkInterval("mega", INTERVALS_MEGA);

  const mt = state.intervals.mega.measureTemperature;
  if (isInt(mt) && mt < 1000)
    err("measureTemperature en " + mt + " ms: ThermometerDS18B20::update() bloquea ~750 ms por " +
        "llamada aunque no haya sensor en el bus, asi que no puede bajar de 1000.");
  // Los dos timeouts de pantalla: por debajo de 1 s el splash no llega a
  // verse y el Busy se rinde antes de que el Mega alcance a contestar.
  [["splashTimeout","Duracion del splash"],["busyTimeout","Espera en pantalla Procesando"]]
    .forEach(([k, lbl]) => {
      const v = state.intervals.esp32[k];
      if (isInt(v) && v < 1000)
        err("Intervalo " + lbl + " (esp32." + k + ") en " + v + " ms: es un timeout de pantalla, " +
            "no puede bajar de 1000.");
    });

  // El Busy espera el state_data que el Mega difunde cada sendState; con
  // menos margen que eso, Detener siempre cae por el timeout en vez de por
  // la confirmacion real.
  const bt = state.intervals.esp32.busyTimeout, ss = state.intervals.mega.sendState;
  if (isInt(bt) && isInt(ss) && bt <= ss)
    warn("busyTimeout (" + bt + " ms) no supera a mega.sendState (" + ss + " ms): la pantalla " +
         "Procesando se va a rendir por timeout antes de recibir la confirmacion del Mega.");

  const st = state.intervals.mega.settlingTime;
  if (isInt(st) && st < DEFAULTS.intervals.mega.settlingTime)
    warn("settlingTime por debajo del default (" + DEFAULTS.intervals.mega.settlingTime + " ms): " +
         "acerca el primer flag posible al arranque, cuando el lazo de control todavia no convergio.");

  /* --- 3. control --- */
  vsec = "3";
  if (!isNum(state.control.kp) || state.control.kp <= 0) err("control.kp tiene que ser mayor que 0.");
  if (!isNum(state.control.maxStep) || state.control.maxStep <= 0) err("control.maxStep tiene que ser mayor que 0.");
  if (!isNum(state.control.deadBand) || state.control.deadBand < 0) err("control.deadBand no puede ser negativo.");
  if (!state.control.enabled)
    warn("control.enabled en false: el lazo mide y reporta pero NO excita las bobinas. Es el modo de " +
         "sensado para bring-up, no una corrida real.");
  validateControlMap();

  /* --- 4. coils --- */
  vsec = "4";
  const usados = new Set();
  state.coils.forEach((c, i) => {
    const tag = "Bobina " + (i + 1);
    if (!c.name || !c.name.trim())
      err(tag + ": falta el nombre. El frame config_coil identifica el canal por nombre, no por indice.");
    else if (c.name.length > MAX_LABEL)
      warn(tag + ": el nombre se truncara a " + MAX_LABEL + " caracteres.");
    else if (usados.has(c.name))
      err(tag + ': el nombre "' + c.name + '" esta repetido, y es lo que usa findByName() para ' +
          "resolver a que canal aplicar el frame.");
    if (c.name) usados.add(c.name);
    if (!isNum(c.calibrationFactor) || c.calibrationFactor < 0.1 || c.calibrationFactor > 5.0)
      err(tag + ": calibrationFactor fuera del rango 0,1 a 5,0 — el Mega lo rechaza y deja 1.0.");
  });
  const on = state.coils.map((c, i) => c.enabled ? i : -1).filter(i => i >= 0);
  if (on.length === 0)
    warn("Ninguna bobina habilitada: no habria campo en ningun modo.");
  else if (on.every(i => i % 2 === 0) || on.every(i => i % 2 === 1))
    warn("Todas las bobinas habilitadas caen en el mismo grupo de fase (1 y 3 directa, 2 y 4 mux): " +
         "el modo de campo nulo no cancelaria nada y no seria verificable.");

  /* --- 5. detector --- */
  vsec = "5";
  if (state.detector.enabled === false)
    warn("Detector apagado: ninguna fuente puede generar flags ni cortar el experimento, aunque " +
         "la temperatura o el campo salgan de rango. Solo para banco.");
  else if (state.detector.enabled !== true)
    err("detector.enabled tiene que ser true o false: con cualquier otra cosa el ESP32 no lo manda " +
        "y el Mega se queda con el detector encendido.");
  state.detector.sources.forEach(s => {
    const allowed = SOURCE_SENSORS[s.name];
    if (allowed && !allowed.includes(s.sensor))
      err(s.name + ': sensor "' + s.sensor + '" no es valido (' + allowed.join(", ") + '). ' +
          "El Mega lo rechaza y sigue con el driver que tenia, sin avisar en pantalla.");
    if (s.sensor === "scenario") {
      vsec = "5b";
      const sc = s.scenario || {};
      const tag = s.name + " / escenario";
      SCENARIO_KEYS.forEach(([k, , lbl]) => {
        if (!isNum(sc[k])) err(tag + ": " + lbl + " tiene que ser un numero.");
      });
      ["noise", "oscPeriod", "dropAt"].forEach(k => {
        if (isNum(sc[k]) && sc[k] < 0)
          err(tag + ": " + k + " no puede ser negativo; el Mega lo ignora y deja el valor anterior.");
      });
      const pts = sc.points;
      const ptsErr = m => err(tag + ": puntos -- " + m + ". El Mega rechaza la lista entera y sigue " +
                              "con los puntos que tenia.");
      if (!Array.isArray(pts)) ptsErr('no se entiende "' + pts + '" (formato segundo:nivel, separados por espacios)');
      else if (pts.length > SCENARIO_MAX_POINTS) ptsErr("son " + pts.length + ", el maximo es " + SCENARIO_MAX_POINTS);
      else pts.forEach(([t, l], j) => {
        if (!Number.isInteger(t) || t < 0 || t > SCENARIO_MAX_SECOND)
          ptsErr("el segundo " + t + " tiene que ser entero, de 0 a " + SCENARIO_MAX_SECOND);
        else if (j > 0 && t < pts[j - 1][0])
          ptsErr("el segundo " + t + " va despues de " + pts[j - 1][0] + ": tienen que ir en orden");
        if (!isNum(l) || Math.abs(l) > SCENARIO_MAX_LEVEL)
          ptsErr("el nivel " + l + " tiene que estar entre -" + SCENARIO_MAX_LEVEL + " y " + SCENARIO_MAX_LEVEL);
      });
      const cadKey = SCENARIO_CADENCE[s.name];
      const cad = cadKey && state.intervals && state.intervals.mega ? state.intervals.mega[cadKey] / 1000 : 0;
      if (isNum(sc.oscAmp) && sc.oscAmp !== 0 && sc.oscPeriod > 0 && cad > 0 && sc.oscPeriod < 4 * cad)
        warn(tag + ": la oscilacion (periodo " + sc.oscPeriod + " s) es demasiado rapida para la medicion " +
             "(cada " + cad + " s): se lee deformada o no se ve. Usar un periodo de " + (4 * cad) + " s o mas.");
      if (s.name === "CEM1" && sc.setpointDuty > 0 && state.control && state.control.enabled === false)
        warn(tag + ": con el lazo apagado (control.enabled false) el duty queda en 0 y la planta da campo 0: " +
             "CEM1 se lee fuera de rango toda la corrida. Usar duty que da el objetivo 0 (sin planta).");
      vsec = "5";
      if (s.name === "CEM1" && (!isNum(sc.setpointDuty) || sc.setpointDuty < 0 || sc.setpointDuty > 1))
        err(tag + ": el duty que da el objetivo tiene que estar entre 0 y 1.");
      if (isNum(sc.oscAmp) && sc.oscAmp !== 0 && !(sc.oscPeriod > 0))
        warn(tag + ": hay amplitud de oscilacion pero periodo 0, asi que no oscila.");
    }
    if (s.name === "CEM1" && (s.sensor === "sim" || s.sensor === "scenario"))
      warn("CEM1 no es el sensor real: el lazo regula contra un campo inventado, asi que la etapa de " +
           "potencia y las bobinas quedan BLOQUEADAS (el duty se calcula y se muestra, no sale), y las " +
           "corridas salen marcadas PRUEBA.");
    if (s.name === "TEMP1" && s.sensor === "ds18b20" && String(s.address ?? "").trim()) {
      const rom = parseRomCode(s.address);
      if (rom.error)
        err("TEMP1: direccion del DS18B20 \"" + s.address + "\": " + rom.error + ". El Mega la " +
            "rechazaria y seguiria con la anterior. Se copia del log del Mega al arrancar ([ONEWIRE]).");
    }
    if (s.name === "TEMP1" && s.sensor === "scenario")
      warn("TEMP1 con escenario: la temperatura es calculada, no medida. Las corridas salen marcadas PRUEBA.");
    if (s.name === "TEMP1" && s.sensor === "sim")
      warn("TEMP1 con sensor sim: la temperatura sale de la entrada A1, no del DS18B20. No mide la " +
           "temperatura del gabinete -- nunca para un experimento con animales.");
    const mm = s.maxMissedSamples;
    if (!isInt(mm) || mm < 1 || mm > 20)
      err(s.name + ": las lecturas perdidas antes del corte tienen que ser un entero entre 1 y 20. " +
          "Fuera de rango el Mega lo ignora y se queda con 3.");
    // Una fuente vigilada sin sensor no da lecturas, y desde la tarjeta 25 el
    // silencio corta: el experimento se cortaria en cada corrida.
    if (s.name === "TEMP1" && s.sensor === "none" && s.enabled)
      err("TEMP1 vigilada sin termometro (sensor none): sin lecturas, el corte por silencio la " +
          "cortaria en cada corrida. Desmarcar 'Vigilada por el Detector' o elegir un sensor.");
    const bs = s.bufferSize;
    if (!isInt(bs) || bs < 8 || bs > 32)
      err(s.name + ": bufferSize tiene que ser un entero entre 8 y 32 (tope de RAM del Mega).");
    if (s.range.mode === "derived"){
      const cm = s.range.criticalMultiplier;
      if (!isNum(cm) || cm < 1.0 || cm > 3.0)
        err(s.name + ": criticalMultiplier fuera del rango 1,0 a 3,0.");
    }
    RULES.forEach(([k, lbl]) => {
      const r = s.rules[k], tag = s.name + " / regla " + lbl;
      if (!isInt(r.threshold) || r.threshold < 1 || (isInt(bs) && r.threshold > bs))
        err(tag + ": threshold tiene que ser un entero entre 1 y bufferSize (" + bs + "). " +
            "Si algo cae fuera, el Mega descarta la regla entera y queda su default compilado.");
      if (!isInt(r.cooldown) || r.cooldown < 0 || r.cooldown > 64)
        err(tag + ": cooldown tiene que ser un entero entre 0 y 64.");
      if (!isInt(r.maxEvents) || r.maxEvents < 1 || r.maxEvents > 10)
        err(tag + ": maxEvents tiene que ser un entero entre 1 y 10.");
    });
    if (!s.enabled)
      warn(s.name + " deshabilitada: se sigue midiendo y mostrando en pantalla, pero no puede " +
           "generar flags ni cortar el experimento.");
  });
  const temp1 = state.detector.sources.find(s => s.name === "TEMP1");
  if (temp1 && isInt(mt) && isInt(temp1.bufferSize))
    info = "Ventana del Detector para TEMP1: " + temp1.bufferSize + " muestras x " + mt + " ms = " +
           (temp1.bufferSize * mt / 1000).toFixed(0) + " s de tiempo real. La regla de frecuencia " +
           "cuenta dentro de esa ventana, asi que cambiar measureTemperature corre su significado.";

  /* --- 6. currentSensors --- */
  vsec = "6";
  const slots = new Set();
  state.currentSensors.forEach((c, i) => {
    const tag = "Canal de corriente " + (i + 1);
    if (c.address !== 72 && c.address !== 73)
      err(tag + ": address tiene que ser 72 (0x48) o 73 (0x49).");
    if (c.channel !== 0 && c.channel !== 1)
      err(tag + ": channel tiene que ser 0 o 1 — el ADS1115 no tiene un par diferencial 2 ni 3.");
    const slot = c.address + "/" + c.channel;
    if (slots.has(slot))
      err(tag + ": el par (address " + c.address + ", channel " + c.channel + ") esta repetido. " +
          "Ese par es la identidad fisica de la entrada y es como se matchea con su slot.");
    slots.add(slot);
    if (!c.name || !c.name.trim())
      err(tag + ": falta el nombre, que es el identificador que viaja en current_data.");
    else if (c.name.length > MAX_LABEL)
      warn(tag + ": el nombre se truncara a " + MAX_LABEL + " caracteres.");
    if (!isInt(c.sampleRate) || c.sampleRate <= 0)
      err(tag + ": sampleRate tiene que ser un entero positivo (SPS).");
    if (!isInt(c.integrationTimeMs) || c.integrationTimeMs <= 0)
      err(tag + ": integrationTimeMs tiene que ser un entero positivo.");
    [["ratedCurrent", "la corriente nominal"], ["ratedVoltage", "la tension nominal"],
     ["calibration", "el factor de calibracion"]].forEach(([k, lbl]) => {
      if (!isNum(c[k]) || c[k] <= 0) err(tag + ": " + lbl + " tiene que ser mayor que 0.");
    });
  });
  [72, 73].forEach(addr => {
    const mod = state.currentSensors.filter(c => c.enabled && c.address === addr);
    if (mod.length === 2 && mod[0].sampleRate !== mod[1].sampleRate)
      warn("Modulo 0x" + addr.toString(16) + ": sus dos canales habilitados piden sampleRate distinto (" +
           mod[0].sampleRate + " y " + mod[1].sampleRate + "). Es un registro del ADS1115 que ambos " +
           "comparten: gana el ultimo que se configura, en silencio.");
  });

  /* --- 8. wifi --- */
  vsec = "8";
  const redes = state.wifi.filter(n => n.ssid.trim());
  if (redes.length === 0) {
    warn("Ninguna red WiFi cargada: la seccion no se escribe y quedan las compiladas en secrets.h.");
  }
  state.wifi.forEach((n, i) => {
    const tag = "Red WiFi " + (i + 1);
    if (!n.ssid.trim()) {
      // Fila vacia: es lo normal en las que sobran. Pero una clave sin SSID
      // es casi seguro un renglon a medio cargar.
      if (n.password.trim()) err(tag + ": tiene contrasena pero no SSID.");
      return;
    }
    if (n.ssid.length > MAX_SSID) err(tag + ': el SSID no puede pasar de ' + MAX_SSID + " caracteres.");
    if (n.password.length > MAX_WIFI_PASS)
      err(tag + ": la contrasena no puede pasar de " + MAX_WIFI_PASS + " caracteres (tope de WPA2).");
    if (!n.password.trim())
      warn(tag + ' ("' + n.ssid + '"): sin contrasena, se conectaria como red abierta.');
  });
  const ssids = redes.map(n => n.ssid.trim());
  ssids.forEach((ssid, i) => {
    if (ssids.indexOf(ssid) !== i)
      warn('Red WiFi "' + ssid + '" repetida: la segunda entrada nunca se llega a probar.');
  });
  if (redes.length > MAX_WIFI_NETWORKS)
    err("No entran mas de " + MAX_WIFI_NETWORKS + " redes (WiFiConfig::MAX_NETWORKS).");

  /* --- 9. broker --- */
  vsec = "9";
  if (!state.broker.server.trim())
    warn("Broker sin host: se usa el compilado en secrets.h.");
  else if (state.broker.server.length > MAX_BROKER_HOST)
    err("El host del broker no puede pasar de " + MAX_BROKER_HOST + " caracteres.");
  if (!isInt(state.broker.port) || state.broker.port <= 0 || state.broker.port > 65535)
    err("El puerto del broker tiene que ser un entero entre 1 y 65535.");
  // El dashboard esta fuera de la red del equipo: sin TLS las credenciales y
  // los datos del experimento viajan en claro por internet.
  else if (state.broker.port === 1883)
    warn("Puerto 1883: es MQTT sin cifrar. Con el broker fuera de la red local, las credenciales y " +
         "la telemetria viajarian en texto plano. El puerto con TLS suele ser 8883.");
  if (state.broker.user.length > MAX_BROKER_USER)
    err("El usuario del broker no puede pasar de " + MAX_BROKER_USER + " caracteres.");
  if (state.broker.password.length > MAX_BROKER_PASS)
    err("La contrasena del broker no puede pasar de " + MAX_BROKER_PASS + " caracteres.");
  if (state.broker.clientId.length > MAX_BROKER_CLIENTID)
    err("El clientId no puede pasar de " + MAX_BROKER_CLIENTID + " caracteres.");

  /* --- 7. telemetry --- */
  vsec = "7";
  const topicsUsados = new Map();
  TELEMETRY_GROUPS.forEach(([k, lbl, desc, periodic]) => {
    const g = state.telemetry.groups[k];
    if (!g.topic.trim()) { err('Grupo de telemetria "' + lbl + '": falta el topic MQTT.'); }
    else if (g.topic.length > MAX_TOPIC) {
      warn('Grupo "' + lbl + '": el topic se truncara a ' + MAX_TOPIC + " caracteres.");
    }
    else if (g.topic !== DEFAULTS.telemetry.groups[k].topic) {
      warn('Grupo "' + lbl + '": topic cambiado a "' + g.topic + '". Hay que actualizar el ' +
           "dashboard o ese grupo no llega.");
    }

    // Dos grupos en el mismo topic mezclan formas de JSON distintas en una
    // sola suscripcion, y el Decoder no tiene como saber cual recibio.
    if (g.enabled && g.topic.trim()) {
      if (topicsUsados.has(g.topic))
        err('Los grupos "' + topicsUsados.get(g.topic) + '" y "' + lbl + '" publican en el mismo ' +
            'topic ("' + g.topic + '"): el Decoder no puede distinguir un mensaje del otro.');
      else topicsUsados.set(g.topic, lbl);
    }

    if (periodic && (!isInt(g.interval) || g.interval <= 0))
      err('Cadencia del grupo "' + lbl + '": tiene que ser un entero positivo en ms.');

    // Una alerta retenida se le entrega a cada nuevo suscriptor como si
    // acabara de ocurrir: el dashboard mostraria una alerta vieja de un
    // experimento terminado hace rato como si fuera actual.
    if (k === "alerts" && g.retain)
      warn('Grupo "Alertas" con retencion: son eventos, no estado. El broker le entregaria la ' +
           "ultima alerta a cualquiera que se conecte despues, como si acabara de ocurrir.");
  });
  if (TELEMETRY_GROUPS.every(([k]) => !state.telemetry.groups[k].enabled))
    warn("Todos los grupos de telemetria estan deshabilitados: no se publica nada al monitor remoto.");
  if (!state.telemetry.groups.result.enabled)
    warn("Grupo Resultado deshabilitado: el monitor remoto no se entera de por que termino un " +
         "experimento, ni siquiera cuando corta por una alerta critica.");
  TELEMETRY_FIELDS.forEach(([k, lbl]) => {
    const f = state.telemetry.fields[k];
    if (f.enabled && !f.name.trim())
      err('Campo de telemetria "' + lbl + '": esta habilitado pero no tiene clave.');
    else if (f.name.length > MAX_LABEL)
      warn('Campo de telemetria "' + lbl + '": la clave se truncara a ' + MAX_LABEL + " caracteres.");
    else if (f.enabled && f.name !== DEFAULTS.telemetry.fields[k].name)
      warn('Campo "' + lbl + '" renombrado a "' + f.name + '": el dashboard espera "' +
           DEFAULTS.telemetry.fields[k].name + '". Si no se actualiza alla, ese valor deja de llegar.');
  });
  checkPayload("mediciones", ["magneticField", "temperature"]);
  checkPayload("estado",     ["health", "progress", "elapsedTime"]);
  const pm = payloadBytes(["magneticField", "temperature"]);
  const ps = payloadBytes(["health", "progress", "elapsedTime"]);
  info += (info ? " · " : "") + "Payload MQTT de los campos con clave configurable: " + pm +
          " bytes el grupo de mediciones y " + ps + " el de estado, sobre un buffer de " +
          MQTT_BUFFER + ". Los demas grupos usan claves fijas y cortas.";

  paint();
}

/* Peso del payload MQTT contra el char[128] de _publishTelemetry().
 *
 * Deliberadamente NO es una validacion: es informativo, y vale la pena saber
 * por que. El firmware guarda cada clave en un `char name[16]` (Topics::
 * TelemetryField) y trunca al copiar, asi que ninguna clave puede superar los
 * 15 caracteres por mas larga que venga en el archivo. Con ese tope, la tanda
 * mas pesada -- mediciones, 3 floats -- da 4 + 3x(15+3+12) = 94 bytes, y la de
 * estado 81. El buffer de 128 no puede desbordar.
 *
 * O sea que la guarda de _publishTelemetry() (no publicar en vez de mandar un
 * JSON cortado) es defensiva de verdad: correcta, pero inalcanzable mientras
 * los buffers de nombre midan 16. Poner aca un error que bloquee la descarga
 * por algo que no puede pasar seria peor que no tenerlo: sugeriria un riesgo
 * inexistente y mandaria a acortar claves sin motivo. Se muestra el numero y
 * listo. Si alguna vez se agranda MaxFieldNameLength, este calculo es el que
 * dice cuanto margen queda. */
const WORST = {magneticField:12, temperature:12, health:10, progress:3, elapsedTime:10};

function payloadBytes(keys){
  const on = keys.filter(k => state.telemetry.fields[k].enabled);
  if (on.length === 0) return 0;
  let bytes = 2 + (on.length - 1);   // llaves mas las comas
  // Se mide sobre el nombre YA truncado, que es el que el firmware publica.
  on.forEach(k => { bytes += Math.min(state.telemetry.fields[k].name.length, MAX_LABEL) + 3 + WORST[k]; });
  return bytes;
}

function checkPayload(batch, keys){
  const on = keys.filter(k => state.telemetry.fields[k].enabled);
  if (on.length === 0)
    warn("Tanda de " + batch + ": no hay ningun campo habilitado, esa publicacion no se manda.");
}

/* ===========================================================================
 * Salida
 * =========================================================================== */
function buildJson(){
  // Mismo orden de claves que el esquema, para que el archivo sea diffeable
  // contra docs/config.example.json.
  return {
    schemaVersion: 1,
    runType: state.runType,
    requireMega: state.requireMega,
    menus: state.menus,
    intervals: state.intervals,
    control: state.control,
    coils: state.coils,
    // address vacia no se escribe (rige la del firmware); una valida sale
    // normalizada, "28:3F:...", que es como la imprime el Mega.
    detector: Object.assign({}, state.detector, {
      sources: state.detector.sources.map(s => {
        const copy = Object.assign({}, s);
        const text = String(s.address ?? "").trim();
        if (!text) delete copy.address;
        else {
          const rom = parseRomCode(text);
          copy.address = rom.bytes ? formatRomCode(rom.bytes) : text;
        }
        return copy;
      })
    }),
    currentSensors: state.currentSensors,
    telemetry: state.telemetry,
    // Las filas sin SSID son lugares vacios del formulario, no redes: se
    // descartan en vez de escribir entradas que el firmware ignoraria.
    // Embebido no van: las credenciales no viajan por MQTT.
    ...(EMBEDDED ? {} : {
      wifi: state.wifi.filter(n => n.ssid.trim()),
      broker: state.broker
    })
  };
}

function paint(){
  document.getElementById("preview").textContent = JSON.stringify(buildJson(), null, 2);
  document.getElementById("dl").disabled = errors.length > 0;
  document.getElementById("send").disabled = errors.length > 0;

  const li = arr => "<ul>" + arr.map(m => "<li>" + esc(m) + "</li>").join("") + "</ul>";
  let h = "";
  if (errors.length === 0 && warns.length === 0)
    h += '<div class="msg o">Sin errores ni avisos. El archivo se puede descargar.</div>';
  // Los errores se muestran ADENTRO de su paso; aca solo cuantos y donde.
  if (errors.length) {
    const titles = typeof document.querySelectorAll === "function" ? stepTitles() : [];
    const pasos = titles.map((t, i) => ({t, i, n: (secCount[t.num] || {}).e || 0})).filter(x => x.n);
    h += '<div class="msg e"><b>' + errors.length + ' error(es)</b> — la descarga esta bloqueada (el firmware ' +
         'descartaria estos valores en silencio). ' + (pasos.length
           ? 'Estan en: ' + pasos.map(x => x.i <= frontier
               ? '<button type="button" class="mini" data-paso="' + x.i + '">' +
                 esc((x.t.num ? x.t.num + " · " : "") + x.t.title) + ' (' + x.n + ')</button>'
               : '<span class="mini-txt">' + esc((x.t.num ? x.t.num + " · " : "") + x.t.title) + ' (' + x.n +
                 ', se corrige al llegar)</span>').join(" ")
           : li(errors)) + "</div>";
  }
  // Avisos y datos utiles PLEGADOS (fase 3): con el formulario por pasos se
  // veian enteros en cada pestaña y se comian medio paso. Los errores no se
  // pliegan: bloquean la descarga y el envio. Lo abierto o cerrado sobrevive
  // al repintado (paint corre en cada tecla).
  if (warns.length)
    h += '<details class="msg w plegable" data-pliegue="avisos"' + (msgOpen.avisos ? " open" : "") + '><summary><b>' +
         warns.length + ' aviso(s)</b> — el archivo es valido, pero estas combinaciones tienen consecuencias ' +
         "que recien se ven en banco.</summary>" + li(warns) + "</details>";
  if (info) h += '<details class="msg o plegable" data-pliegue="info"' + (msgOpen.info ? " open" : "") +
         '><summary><b>Datos utiles</b> sobre esta configuracion</summary><p style="margin:6px 0 0">' +
         esc(info) + "</p></details>";
  document.getElementById("msgs").innerHTML = h;

  // El resumen fijo: cuantos errores y avisos hay, y un toque lleva a la
  // lista (que esta arriba del formulario, fuera de la cabecera fija).
  let r = "";
  if (errors.length) r += '<button type="button" class="pill e" data-ir="msgs">' + errors.length + " error(es)</button> ";
  if (warns.length) r += '<button type="button" class="pill w" data-ir="msgs">' + warns.length + " aviso(s)</button> ";
  if (!errors.length && !warns.length) r += '<span class="pill o">Sin errores ni avisos</span>';
  document.getElementById("msgSummary").innerHTML = r;
  updateProfileMarks();
  paintScenario();
  trackChanges();
  updateStepBadges();
}

// Un solo listener (delegado) para las pastillas del resumen, que se
// redibujan con cada validacion.
document.getElementById("msgSummary").addEventListener("click", ev => {
  if (ev.target && ev.target.dataset && ev.target.dataset.ir)
    document.getElementById("msgs").scrollIntoView({behavior: "smooth", block: "start"});
});

function download(){
  validate();
  if (!fullyReviewed()) return;
  const blob = new Blob([JSON.stringify(buildJson(), null, 2) + "\n"], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "config.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* Cargar un archivo existente para editarlo. Se mergea sobre los defaults en
 * vez de reemplazar el estado entero: un archivo al que le falta una seccion
 * tiene que comportarse aca igual que en el firmware (seccion 1.1 del esquema,
 * los defaults compilados nunca desaparecen). */
function loadParsed(parsed){
  state = clone(DEFAULTS);
  ["runType", "requireMega", "menus", "intervals", "control", "coils", "detector", "currentSensors", "telemetry"]
    .forEach(k => { if (parsed[k] !== undefined) state[k] = parsed[k]; });
  // wifi y broker tambien: antes no se cargaban, y abrir una tarjeta para
  // editarla y volver a descargarla BORRABA las credenciales en silencio --
  // la placa perdia la red en el proximo reinicio. Las filas de WiFi son
  // fijas en el formulario, asi que se completan hasta el tope.
  if (Array.isArray(parsed.wifi)) {
    state.wifi = parsed.wifi.slice(0, MAX_WIFI_NETWORKS)
      .map(n => ({ssid: String(n.ssid || ""), password: String(n.password || "")}));
    while (state.wifi.length < MAX_WIFI_NETWORKS) state.wifi.push({ssid: "", password: ""});
  }
  if (parsed.broker && typeof parsed.broker === "object")
    state.broker = Object.assign(clone(DEFAULTS.broker), parsed.broker);
  // Un archivo anterior a detector.enabled trae la seccion sin esa clave:
  // en el firmware eso es "encendido", y asi tiene que verse aca.
  if (state.detector.enabled === undefined) state.detector.enabled = true;
  // Un archivo anterior al mapa trae `control` sin balanceMax ni map: se completan con
  // los de fabrica (mapa vacio), no se dejan undefined.
  state.control = Object.assign(clone(DEFAULTS.control), state.control);
  // `tare` ya no existe (el campo se mide como RMS, que no necesita tara): un
  // archivo viejo que la traiga se lee, pero no se vuelve a escribir.
  delete state.control.tare;
  // Una fuente sin `scenario` toma el de fabrica, para que elegir el
  // sensor "scenario" en el formulario tenga numeros que editar.
  // Uno con las claves de la tarjeta 22 (base/ramp/stepAt/step) se pasa a
  // puntos: el firmware ya no las lee.
  state.detector.sources.forEach(s => {
    const def = DEFAULTS.detector.sources.find(d => d.name === s.name);
    if (!s.scenario && def) s.scenario = clone(def.scenario);
    else if (s.scenario) s.scenario = normalizeScenario(s.scenario);
  });
  restartSteps();
  render();
}

document.getElementById("file").addEventListener("change", ev => {
  const f = ev.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let parsed;
    try { parsed = JSON.parse(r.result); }
    catch (e){ alert("El archivo no es JSON valido:\n\n" + e.message); return; }
    if (parsed.schemaVersion !== 1)
      alert("schemaVersion " + parsed.schemaVersion + " — el firmware solo entiende la 1 y " +
            "descartaria el archivo entero. Se carga igual para que lo puedas corregir.");
    loadParsed(parsed);
  };
  r.readAsText(f);
  ev.target.value = "";
});

// Estado del ultimo envio a la placa, que pasa el monitor. Va en la cabecera
// fija, al lado del boton Enviar, porque es ahi donde se esta mirando.
function showSendStatus(st){
  const box = document.getElementById("sendStatus");
  if (!st || !st.text) { box.innerHTML = ""; return; }
  const cls = {ok: "o", error: "e", progress: "i"}[st.kind] || "i";
  box.innerHTML = '<div class="msg ' + cls + '"><b>' + esc(st.text) + '</b>' +
    (st.detail ? '<br>' + esc(st.detail) : '') + '</div>';
}

if (typeof location !== "undefined" && /[?&]tema=(oscuro|claro)/.test(location.search))
  document.documentElement.dataset.tema = location.search.match(/[?&]tema=(oscuro|claro)/)[1];

if (EMBEDDED) {
  document.body.classList.add("embebido");
  document.getElementById("dl").hidden = true;
  const send = document.getElementById("send");
  send.hidden = false;
  send.addEventListener("click", () => {
    validate();
    if (!fullyReviewed()) return;
    window.parent.postMessage({type: "biosoft-send", config: buildJson()}, window.location.origin);
  });
  // Solo se aceptan mensajes del monitor que lo embebe (mismo origen).
  window.addEventListener("message", ev => {
    if (ev.origin !== window.location.origin || !ev.data) return;
    if (ev.data.type === "biosoft-load" && ev.data.config) loadParsed(ev.data.config);
    if (ev.data.type === "biosoft-board") {
      stages = {placa: ev.data.placa || null, enviado: ev.data.enviado || null};
      updateProfileMarks();
    }
    if (ev.data.type === "biosoft-status") showSendStatus(ev.data.status);
    // El monitor cambio de tema (claro/oscuro): se sigue sin recargar.
    if (ev.data.type === "biosoft-tema" && (ev.data.tema === "claro" || ev.data.tema === "oscuro"))
      document.documentElement.dataset.tema = ev.data.tema;
    if (ev.data.type === "biosoft-scenarios" && Array.isArray(ev.data.items)) {
      LIBRARY = ev.data.items;
      LIB_ADMIN = !!ev.data.admin;
      if (selectedScenario && !LIBRARY.some(e => e.id === selectedScenario)) selectedScenario = null;
      render();
    }
    if (ev.data.type === "biosoft-scenario-result") {
      libStatus = {ok: !!ev.data.ok, text: String(ev.data.text || "")};
      if (ev.data.selectId !== undefined) selectedScenario = ev.data.selectId;
      render();
    }
    // Un usuario de solo lectura ve y edita (para descargar o mirar), pero no
    // envia: el servidor lo rechazaria igual, mejor no ofrecer el boton.
    if (ev.data.type === "biosoft-readonly") {
      document.getElementById("send").hidden = true;
      document.getElementById("readonlyNote").hidden = false;
      document.getElementById("dl").hidden = false;
    }
  });
}

render();
if (EMBEDDED) window.parent.postMessage({type: "biosoft-ready"}, window.location.origin);
</script>
