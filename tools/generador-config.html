<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de config.json — BioSoft</title>
<style>
  :root{
    --bg:#f3f5f9; --panel:#ffffff; --ink:#18202c; --muted:#5b6577; --line:#dbe1ea;
    --accent:#2f62d8; --err:#b3261e; --errbg:#fdeceb; --warn:#8a5a00; --warnbg:#fff6e0;
    --ok:#136a3a; --okbg:#e8f5ee; --code:#f2f4f7;
  }
  /* Oscuro: los mismos tokens que el monitor (web/client/src/styles.css),
     para que embebido no parezca otra aplicacion. El monitor lo pide con
     ?tema=oscuro (data-tema); abierto suelto, sigue al sistema. */
  @media (prefers-color-scheme: dark){
    :root:not([data-tema="claro"]){
      --bg:#0d1016; --panel:#151a22; --ink:#e8ebf1; --muted:#8e97a9; --line:#252c38;
      --accent:#6b9bff; --err:#f87171; --errbg:#3a1f22; --warn:#fbbf24; --warnbg:#3a2f16;
      --ok:#34d399; --okbg:#13301f; --code:#10141b;
    }
  }
  :root[data-tema="oscuro"]{
      --bg:#0d1016; --panel:#151a22; --ink:#e8ebf1; --muted:#8e97a9; --line:#252c38;
      --accent:#6b9bff; --err:#f87171; --errbg:#3a1f22; --warn:#fbbf24; --warnbg:#3a2f16;
      --ok:#34d399; --okbg:#13301f; --code:#10141b;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:10;background:var(--panel);
         border-bottom:1px solid var(--line);padding:12px 20px}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;max-width:1100px;margin:0 auto}
  h1{font-size:16px;margin:0;flex:1;min-width:240px}
  h1 small{display:block;font-weight:400;color:var(--muted);font-size:12px}
  main{max-width:1100px;margin:0 auto;padding:20px}
  button{font:inherit;padding:7px 13px;border-radius:6px;border:1px solid var(--line);
         background:var(--panel);color:var(--ink);cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary:disabled{opacity:.45;cursor:not-allowed}
  button.mini{padding:3px 8px;font-size:12px}
  section{background:var(--panel);border:1px solid var(--line);border-radius:8px;
          padding:16px 18px;margin-bottom:16px}
  section > h2{font-size:15px;margin:0 0 4px}
  .hint{color:var(--muted);font-size:12.5px;margin:0 0 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  label.f{display:block}
  label.f > span:first-child{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
  input[type=text],input[type=number],select{width:100%;padding:6px 8px;border-radius:5px;
    border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
  .row{display:flex;gap:10px;align-items:flex-end;padding:8px 0;border-bottom:1px dashed var(--line)}
  .row:last-of-type{border-bottom:0}
  .row .grow{flex:1}
  .row .w110{width:110px;flex:none}
  .chk{display:flex;gap:7px;align-items:center;white-space:nowrap}
  .sub{border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-top:12px}
  .sub h3{font-size:13.5px;margin:0 0 10px}
  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:5px 8px 5px 0;vertical-align:bottom}
  th{color:var(--muted);font-weight:500;font-size:12px}
  .msgs{max-width:1100px;margin:0 auto}
  /* La cabecera fija lleva SOLO la barra de botones y una linea de resumen.
     La lista completa de errores y avisos va debajo, en el flujo de la
     pagina: con una configuracion de prueba (sensores simulados, detector
     apagado) son facilmente diez avisos, y fijos ocupaban media pantalla --
     embebido en el monitor, casi todo el marco --, dejando un hueco minimo
     para recorrer el formulario. */
  /* Indice de secciones: el formulario es largo y sin esto habia que bajar
     a ciegas buscando "Escenarios" o "Fuentes" (fase 3). */
  .indice{display:flex;gap:4px;overflow-x:auto;max-width:1100px;margin:10px auto 0;scrollbar-width:none}
  .indice::-webkit-scrollbar{display:none}
  /* Embebido en un celular la cabecera fija se come media pantalla: se
     compacta (sin subtitulo, botones chicos en una fila). */
  @media (max-width:600px){
    body.embebido header{padding:8px 12px}
    body.embebido h1{min-width:0;font-size:14px}
    body.embebido h1 small{display:none}
    body.embebido .bar{gap:6px}
    body.embebido .bar button{padding:5px 9px;font-size:12.5px}
    body.embebido .indice{margin-top:6px}
  }
  .indice button{flex:none;font-size:12.5px;padding:5px 11px 5px 6px;border-radius:999px;color:var(--muted);
            border:1px solid transparent;background:none;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .indice button:hover{color:var(--ink);border-color:var(--line)}
  .indice button.on{color:var(--ink);border-color:var(--accent);background:var(--bg);font-weight:600}
  .indice .num{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;
               background:var(--code);border:1px solid var(--line);font-size:11px;font-weight:600}
  .indice button.on .num{background:var(--accent);border-color:var(--accent);color:#fff}
  .indice button.has-e .num{background:var(--err);border-color:var(--err);color:#fff}
  .indice button.has-w .num{background:var(--warn);border-color:var(--warn);color:#1a1d24}
  /* Una seccion por vez: buildIndex() marca la activa en cada render. */
  #app > section{display:none}
  #app > section.activa{display:block}
  .pasos-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;
             padding-top:14px;border-top:1px solid var(--line)}
  .pasos-cuenta{color:var(--muted);font-size:12.5px}
  .indice button:disabled{opacity:.4;cursor:not-allowed}
  .indice button:disabled:hover{border-color:transparent;color:var(--muted)}
  .paso-errores:empty{display:none}
  input.fuera{border-color:var(--err);background:var(--errbg)}
  .limite-nota{display:block;font-size:11.5px;color:var(--warn);margin-top:3px}
  .indice button.hecho .num{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
  .pendiente{color:var(--muted)} .pendiente:empty{display:none}
  .mini-txt{font-size:12px;opacity:.85}
  .paso-errores{margin:0 0 14px}
  section{scroll-margin-top:150px}
  body.embebido .indice{max-width:1400px}
  .resumen{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:1100px;margin:8px auto 0;
           font-size:12.5px}
  .resumen .pill{padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg);
                 cursor:pointer;font:inherit;font-size:12.5px}
  .resumen .pill.e{color:var(--err);border-color:var(--err);background:var(--errbg)}
  .resumen .pill.w{color:var(--warn);border-color:var(--warn);background:var(--warnbg)}
  .resumen .pill.o{color:var(--ok);border-color:var(--ok);background:var(--okbg)}
  .resumen .envio{flex:1;min-width:200px}
  .resumen .envio .msg{margin:0;padding:4px 10px}
  #msgs{margin-bottom:16px;scroll-margin-top:120px}
  #msgs .msg:first-child{margin-top:0}
  #msgs .msg ul{max-height:none}
  body.embebido .bar, body.embebido .resumen, body.embebido main, body.embebido .msgs{max-width:1400px}
  .solo-lectura{color:var(--muted);font-size:12.5px}
  .msg{padding:8px 12px;border-radius:6px;margin-top:8px;font-size:13px}
  .msg ul{margin:6px 0 0;padding-left:20px}
  .msg.e{background:var(--errbg);color:var(--err);border:1px solid var(--err)}
  .msg.w{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn)}
  .msg.o{background:var(--okbg);color:var(--ok);border:1px solid var(--ok)}
  /* Perfil de escenario. Los botones marcan SOLO lo que se esta editando;
     lo que corre en la placa y lo enviado van en un bloque aparte, una fila
     por etapa: mezclarlos en los mismos botones confundia. */
  button.prof.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.prof.on::before{content:"✓ "}
  .etapas{display:grid;grid-template-columns:auto auto 1fr;gap:6px 14px;align-items:baseline;
          font-size:13px;margin:0 0 12px;padding:10px 12px;border-radius:6px;
          background:var(--code);border:1px solid var(--line)}
  .etapas .et{font-weight:600;white-space:nowrap}
  .etapas .et::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;
                      margin-right:6px;vertical-align:-1px}
  .etapas .et.placa::before{background:var(--ok)}
  .etapas .et.enviado::before{background:var(--warn)}
  .etapas .et.form::before{background:var(--accent)}
  .etapas .val{font-weight:600}
  .etapas .nota{color:var(--muted)}
  .etapas .nada{color:var(--muted);font-weight:400}
  .etapas .alerta{color:var(--warn);font-weight:600}
  @media (max-width:600px){ .etapas{grid-template-columns:1fr} .etapas .nota{margin-bottom:6px} }
  .msg.i{background:var(--code);color:var(--ink);border:1px solid var(--accent)}
  details.plegable summary{cursor:pointer;list-style:none}
  details.plegable summary::-webkit-details-marker{display:none}
  details.plegable summary::after{content:" — ver";text-decoration:underline;opacity:.8}
  details.plegable[open] summary::after{content:" — ocultar"}
  /* Editor de escenarios (5b). */
  h3.paso{font-size:13.5px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
  h3.paso span{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;
               background:var(--accent);color:#fff;font-size:12px}
  .perfiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
  .perfiles button.prof{text-align:left;display:flex;flex-direction:column;gap:2px;padding:9px 12px}
  .perfiles button.prof small{font-size:11.5px;color:var(--muted);font-weight:400}
  .perfiles button.prof.on small{color:#fff;opacity:.9}
  .msg.outcome{font-size:14px}
  .libbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px;padding:8px 10px;
          border:1px dashed var(--line);border-radius:6px;font-size:13px}
  .libbar span:first-child{flex:1;min-width:200px}
  .libbar .ok{color:var(--ok);font-weight:600} .libbar .alerta{color:var(--warn);font-weight:600}
  button:disabled{opacity:.45;cursor:not-allowed}
  .sub.scn h3 small{font-weight:400;color:var(--muted)}
  .sub.scn .alerta{color:var(--warn);font-weight:600}
  .chart{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--bg);
         touch-action:none;user-select:none;cursor:crosshair}
  .chart svg{display:block;width:100%;height:auto}
  .chart .z-ok{fill:var(--ok);opacity:.10}
  .chart .z-warn{fill:var(--warn);opacity:.16}
  .chart .z-crit{fill:var(--err);opacity:.12}
  .chart .z-settle{fill:var(--muted);opacity:.10}
  .chart .grid{stroke:var(--line);stroke-width:1}
  .chart .ax,.chart .lv,.chart .lbl{fill:var(--muted);font-size:11px}
  .chart .lv{font-size:10.5px}
  .chart .shape{fill:none;stroke:var(--accent);stroke-width:2}
  .chart .smp{stroke:none}
  .chart .s-ok{fill:var(--ok)} .chart .s-warn{fill:var(--warn)} .chart .s-crit{fill:var(--err)}
  .chart .s-set{opacity:.35}
  .chart .drop{stroke:var(--muted);stroke-dasharray:4 3}
  .chart .cut{stroke:var(--err);stroke-width:2}
  .chart .cutl{fill:var(--err);font-weight:600}
  .chart .ev-critical{fill:var(--err)} .chart .ev-streak,.chart .ev-frequency{fill:var(--warn)}
  .chart .ev-silence{fill:var(--muted)}
  .chart .cp{fill:var(--panel);stroke:var(--accent);stroke-width:2.5;cursor:grab}
  .chart .cp:hover{fill:var(--accent)}
  pre{background:var(--code);border:1px solid var(--line);border-radius:6px;
      padding:12px;overflow:auto;max-height:340px;font-size:12px}
</style>
</head>
<body>

<header>
  <div class="bar">
    <h1>Generador de <code>config.json</code>
      <small>BioSoft — esquema v1 · destino <code>/biosoft/config.json</code> en la SD del CYD</small></h1>
    <input type="file" id="file" accept=".json,application/json" hidden>
    <button id="btnLoad">Cargar archivo…</button>
    <button id="btnReset">Restaurar defaults</button>
    <button class="primary" id="dl">Descargar config.json</button>
    <button class="primary" id="send" hidden>Enviar a la placa</button>
    <span class="solo-lectura" id="readonlyNote" hidden>Solo lectura: enviar a la placa es para administradores.</span>
  </div>
  <nav class="indice" id="indice" aria-label="Secciones"></nav>
  <div class="resumen">
    <span id="pasosPendientes" class="pendiente"></span>
    <span id="msgSummary"></span>
    <span class="envio" id="sendStatus" role="status" aria-live="polite"></span>
  </div>
</header>

<main>
  <div class="msgs" id="msgs"></div>
  <div id="app"></div>
</main>

<script>
"use strict";

/* ===========================================================================
 * Defaults: identicos a docs/config.example.json, que a su vez son identicos
 * a los defaults compilados del firmware. Arrancar de aca significa que un
 * archivo generado sin tocar nada no cambia el comportamiento del equipo.
 * =========================================================================== */
const DEFAULTS = {
  schemaVersion: 1,
  runType: "normal",
  requireMega: true,
  menus: {
    fieldIntensity: [{label:"1.0 mT",value:1.0},{label:"2.0 mT",value:2.0}],
    frequency: [{label:"10 Hz",value:10},{label:"50 Hz",value:50}],
    duration: [{label:"00h 01m",value:60000},{label:"00h 05m",value:300000},
               {label:"00h 10m",value:600000},{label:"01h 00m",value:3600000},
               {label:"01h 30m",value:5400000},{label:"02h 00m",value:7200000}],
    fieldTolerance: [{label:"5%",value:5},{label:"10%",value:10}],
    temperatureNormal: [{label:"30~40 C",min:30,max:40},{label:"28~42 C",min:28,max:42},
                        {label:"26~44 C",min:26,max:44}],
    temperatureCritical: [{label:"25~45 C",min:25,max:45},{label:"23~47 C",min:23,max:47},
                          {label:"20~50 C",min:20,max:50}]
  },
  intervals: {
    esp32: {updateScreens:50,reSendStart:4000,reSendStop:4000,reSendReset:4000,updateProgress:5000,
            reSendConfig:4000,splashTimeout:4000,busyTimeout:6000},
    mega: {ping:2000,sendState:5000,measureTemperature:5000,measureCurrent:8500,
           measureMagneticField:2000,updateProgress:1000,sendFlags:25000,sendResult:1000,
           settlingTime:10000}
  },
  control: {enabled:true,kp:0.1,maxStep:0.05,deadBand:0.01,balanceMax:0.2,map:[]},
  coils: [
    {name:"BOB1",enabled:true, calibrationFactor:1.0},
    {name:"BOB2",enabled:true, calibrationFactor:1.0},
    {name:"BOB3",enabled:false,calibrationFactor:1.0},
    {name:"BOB4",enabled:false,calibrationFactor:1.0}
  ],
  detector: { enabled: true, sources: [
    {name:"CEM1",enabled:false,sensor:"mlx90393",bufferSize:32,maxMissedSamples:3,
     range:{mode:"derived",criticalMultiplier:1.25},
     rules:{critical:{threshold:3,cooldown:1,maxEvents:2},
            streak:{threshold:5,cooldown:4,maxEvents:5},
            frequency:{threshold:16,cooldown:16,maxEvents:3}},
     scenario:{points:[],noise:0.1,oscAmp:0,oscPeriod:0,dropAt:0,setpointDuty:0.5}},
    {name:"TEMP1",enabled:true,sensor:"ds18b20",bufferSize:32,maxMissedSamples:3,
     range:{mode:"operator"},
     rules:{critical:{threshold:3,cooldown:1,maxEvents:2},
            streak:{threshold:5,cooldown:4,maxEvents:5},
            frequency:{threshold:16,cooldown:16,maxEvents:3}},
     scenario:{points:[],noise:0.1,oscAmp:0,oscPeriod:0,dropAt:0}}
  ]},
  currentSensors: [
    {name:"SCT013-1",enabled:true, address:72,channel:0,ratedCurrent:5.0,ratedVoltage:1.0,calibration:0.775,sampleRate:860,integrationTimeMs:200},
    {name:"SCT013-2",enabled:false,address:72,channel:1,ratedCurrent:5.0,ratedVoltage:1.0,calibration:0.775,sampleRate:860,integrationTimeMs:200},
    {name:"SCT013-3",enabled:false,address:73,channel:0,ratedCurrent:5.0,ratedVoltage:1.0,calibration:0.775,sampleRate:860,integrationTimeMs:200},
    {name:"SCT013-4",enabled:false,address:73,channel:1,ratedCurrent:5.0,ratedVoltage:1.0,calibration:0.775,sampleRate:860,integrationTimeMs:200}
  ],
  // Marcadores a proposito: este archivo se versiona en el repo y el
  // generador lo usa de base. Las credenciales reales las escribe el
  // operador en el formulario, nunca viajan aca.
  wifi: [
    {ssid:"RED_1", password:"CLAVE_1"},
    {ssid:"RED_2", password:"CLAVE_2"},
    {ssid:"",      password:""},
    {ssid:"",      password:""},
    {ssid:"",      password:""}
  ],
  broker: {
    server:"broker.example.com",
    port:8883,
    user:"usuario_mqtt",
    password:"password_mqtt",
    clientId:"biosoft-esp32"
  },
  telemetry: {
    groups:{
      measures:{enabled:true,topic:"biosoft/telemetry/measures",interval:2000,retain:true},
      coils:   {enabled:true,topic:"biosoft/telemetry/coils",   interval:5000,retain:true},
      status:  {enabled:true,topic:"biosoft/telemetry/status",  interval:5000,retain:true},
      targets: {enabled:true,topic:"biosoft/telemetry/targets",                retain:true},
      alerts:  {enabled:true,topic:"biosoft/telemetry/alerts",                 retain:false},
      result:  {enabled:true,topic:"biosoft/telemetry/result",                 retain:true}
    },
    fields:{
      magneticField:{enabled:true,name:"CEM1"},
      temperature:{enabled:true,name:"TEMP1"},
      health:{enabled:true,name:"ESTADO"},
      progress:{enabled:true,name:"PROGRESS"},
      elapsedTime:{enabled:true,name:"ELAPSED_TIME"}
    }
  }
};

/* Topes del esquema (seccion 1.3: todo tope de memoria es de compilacion). */
const MAX_MENU_OPTIONS = 8;
// Intensidad y frecuencia tienen tope 3 cada una (ConfigurationOptions::
// MaxFieldIntensityOptions / MaxFrequencyOptions): el mapa de calibracion del
// campo nulo es uno por combinacion, y 3 x 3 = 9 puntos es lo que cabe en el
// Mega (ControlMap::MaxPoints). Una cuarta opcion del menu se ignora en la placa.
const MENU_CAP = {fieldIntensity: 3, frequency: 3};
const menuMax = key => MENU_CAP[key] || MAX_MENU_OPTIONS;
const MAX_MAP_POINTS = 9;       // ControlMap::MaxPoints
const MAX_BALANCE = 0.5;        // CoilChannels::MaxBalance
const MAP_MATCH_INT = 0.001;    // ControlMapLimits::IntensityMatch (mT)
const MAP_MATCH_FREQ = 0.5;     // ControlMapLimits::FrequencyMatch (Hz)
const MAX_WIFI_NETWORKS = 5;   // WiFiConfig::MAX_NETWORKS
const MAX_SSID = 32;
const MAX_WIFI_PASS = 63;      // maximo de WPA2
const MAX_BROKER_HOST = 63;
const MAX_BROKER_USER = 31;
const MAX_BROKER_PASS = 63;
const MAX_BROKER_CLIENTID = 31;
const MAX_LABEL  = 15;   // label de menu, name de bobina, de sensor y de campo
const MAX_TOPIC  = 63;
const MQTT_BUFFER = 384; // Topics::MaxPayloadLength, el buffer de MySystem::_publishTelemetry()

const clone = o => JSON.parse(JSON.stringify(o));
let state = clone(DEFAULTS);

/* ===========================================================================
 * Enteros vs. floats: NO es cosmetico.
 *
 * Verificado contra ArduinoJson 7, la version que compila el firmware:
 *   is<float>()         acepta 1 y 1.0   -> un float se puede escribir entero
 *   is<unsigned long>() acepta 1, RECHAZA 1.0
 *
 * O sea que una clave entera escrita con punto decimal se pierde en silencio.
 * En intervals y bufferSize queda el default compilado; en los menus es peor,
 * porque ConfigLoader los lee con `option["value"] | 0` y el fallback del
 * operador | se aplica justamente cuando is<T>() da false: la opcion queda
 * en 0, y el operador ve un menu con una duracion de 0 ms.
 *
 * Por eso todo campo INT se valida con Number.isInteger antes de dejar
 * descargar. Es la razon principal por la que conviene generar el archivo
 * con esta herramienta en vez de editarlo a mano.
 * =========================================================================== */
const INT = "int", FLT = "float";

// Drivers que el Mega acepta para cada fuente (SensorChoices::parse en
// mega2560/src/sensorchoice.hpp). Un valor fuera de la lista lo rechaza y se
// queda con el anterior: la tarjeta diria "sim" y el equipo seguiria
// leyendo el sensor real, o al reves. CEM1 no admite "none": es la
// realimentacion del lazo de control.
const SOURCE_SENSORS = { CEM1: ["mlx90393", "sim", "scenario"], TEMP1: ["ds18b20", "sim", "scenario", "none"] };

// Direccion (ROM code) del DS18B20 de TEMP1: mismas reglas que
// mega2560/src/onewireaddress.hpp -- 16 digitos hex, con o sin ":" "-" o
// espacios, familia 0x28 y CRC8 Dallas en el ultimo byte. El Mega rechaza
// una direccion mala y sigue con la anterior; aca se frena antes. Mismo
// riesgo de deriva que MAX_BALANCE: si cambia una regla, cambian las dos.
function crc8Dallas(bytes){
  let crc = 0;
  for (let b of bytes){
    for (let i = 0; i < 8; i++){
      const mix = (crc ^ b) & 1;
      crc >>= 1;
      if (mix) crc ^= 0x8C;
      b >>= 1;
    }

// Que se espera de un perfil, en palabras (para el boton y la lista).
function expectText(prof){
  const e = prof.expect || {};
  const nombre = t => ({critical: "critico", streak: "racha", frequency: "frecuencia", silence: "silencio"}[t] || t);
  if (e.reason === "completed")
    return "termina completa" + (e.alerts && e.alerts.length ? ", con alertas de " + e.alerts.map(nombre).join(" y ") : "");
  const tipo = nombre(e.type);
  return "corta por " + tipo + " de " + e.source + " a los ~" + e.at + " s";
}

// Formato de la tarjeta 22 (base/ramp/stepAt/step) -> puntos. Es la misma
// senal: rampa = recta, salto = dos puntos en el mismo segundo. Una rampa
// sin fin se corta donde llega al tope de nivel (o a las 2 h, la corrida
// mas larga del menu de fabrica). Lo usan la carga de archivos y la
// deteccion de perfil, para que una tarjeta vieja se lea como lo que era.
function legacyToPoints(sc){
  const n = k => (typeof sc[k] === "number" && isFinite(sc[k])) ? sc[k] : 0;
  const base = n("base"), ramp = n("ramp"), stepAt = n("stepAt"), step = n("step");
  const lim = SCENARIO_MAX_LEVEL;
  const clampL = v => Math.max(-lim, Math.min(lim, Math.round(v * 100) / 100));
  const at = t => base + ramp * t / 60;
  const pts = [];
  if (base !== 0 || ramp !== 0 || (stepAt > 0 && step !== 0)) pts.push([0, clampL(base)]);
  if (stepAt > 0 && step !== 0) {
    const t = Math.round(stepAt);
    pts.push([t, clampL(at(t))], [t, clampL(at(t) + step)]);
  }
  if (ramp !== 0) {
    const off = (stepAt > 0) ? step : 0;
    let end = 7200;
    const tLim = (Math.sign(ramp) * lim - base - off) * 60 / ramp;
    if (tLim > 0 && tLim < end) end = Math.floor(tLim);
    if (end > (pts.length ? pts[pts.length - 1][0] : 0)) pts.push([end, clampL(at(end) + off)]);
  }
  return pts;
}

// Deja un escenario en el formato actual: convierte las claves viejas y
// quita las que el firmware ya no lee. No toca uno que ya tiene `points`.
function normalizeScenario(sc){
  if (!sc || typeof sc !== "object") return sc;
  const legacy = ["base", "ramp", "stepAt", "step"].some(k => k in sc);
  const out = Object.assign({}, sc);
  if (legacy && !Array.isArray(sc.points)) out.points = legacyToPoints(sc);
  ["base", "ramp", "stepAt", "step"].forEach(k => delete out[k]);
  if (!("points" in out)) out.points = [];
  return out;
}

// Texto <-> puntos para el campo de edicion: "0:0  60:0  60:2,5". Acepta
// coma decimal. Devuelve null si algo no se entiende.
function pointsToText(pts){
  if (!Array.isArray(pts)) return String(pts ?? "");
  return pts.map(([t, l]) => t + ":" + String(l).replace(".", ",")).join("  ");
}
function textToPoints(text){
  const toks = String(text).split(/[;\s]+/).filter(Boolean);
  const pts = [];
  for (const tok of toks) {
    const m = tok.match(/^(-?\d+(?:[.,]\d+)?):(-?\d+(?:[.,]\d+)?)$/);
    if (!m) return null;
    pts.push([Number(m[1].replace(",", ".")), Number(m[2].replace(",", "."))]);
  }
  return pts;
}

// Biblioteca del monitor (tarjeta de escenarios propios). Embebido, el
// monitor manda la lista de su base (los de fabrica sembrados mas los que se
// hayan creado, editado o borrado); abierto con doble clic no hay biblioteca y
// se ofrecen los de fabrica de SCENARIO_FILE. Solo un admin la modifica, y
// las operaciones las hace el monitor (postMessage), no este archivo.
let LIBRARY = null;        // null = sin monitor
let LIB_ADMIN = false;
let selectedScenario = null;   // key del ultimo elegido o guardado
let libStatus = null;          // {ok, text}
function scenarioList(){
  if (!LIBRARY) return SCENARIO_PROFILES;
  return LIBRARY.map(e => ({key: e.id, name: e.name, description: e.description || "", sources: e.sources,
    reference: e.reference, expect: e.expect, minDuration: e.minDuration, factoryKey: e.factoryKey,
    modificado: e.modificado, updatedBy: e.updatedBy}));
}

function applyProfile(key){
  const prof = scenarioList().find(p => p.key === key);
  if (!prof) return;
  // Un escenario es una prueba de banco por definicion: un experimento no
  // puede simular sensores (enforceExperiment).
  state.runType = "test";
  runTypeNotice = null;
  state.detector.sources.forEach(s => {
    const def = prof.sources[s.name];
    if (!def) return;
    s.sensor = "scenario";
    s.enabled = def.enabled;
    s.scenario = clone(def.scenario);
  });
  selectedScenario = key;
  if (prof.reference) refFromValues(prof.reference);
  render();
}

// La corrida de referencia guardada con un escenario -> indices de los menus
// actuales (si una opcion ya no existe, queda la que estaba).
function refFromValues(v){
  if (!refRun) refRun = refDefaults();
  const m = state.menus;
  const idx = (list, pred) => { const i = (list || []).findIndex(pred); return i; };
  const set = (k, i) => { if (i >= 0) refRun[k] = i; };
  set("intensity", idx(m.fieldIntensity, o => o.value === v.intensity));
  set("frequency", idx(m.frequency, o => o.value === v.frequency));
  set("tolerance", idx(m.fieldTolerance, o => o.value === v.tolerance));
  set("tempNormal", idx(m.temperatureNormal, o => o.min === v.tempNormal.min && o.max === v.tempNormal.max));
  set("tempCritical", idx(m.temperatureCritical, o => o.min === v.tempCritical.min && o.max === v.tempCritical.max));
  set("duration", idx(m.duration, o => o.value === v.durationS * 1000));
  if (v.mode === "x" || v.mode === "null") refRun.mode = v.mode;
}

// Lo que se guarda en la biblioteca: la senal de cada fuente SIMULADA (las
// que estan en sensor real no son parte del escenario) y la corrida de
// referencia que se esta mirando.
function scenarioFromForm(){
  const sources = {};
  state.detector.sources.forEach(s => {
    if (s.sensor === "scenario" && s.scenario)
      sources[s.name] = {enabled: s.enabled !== false, scenario: clone(normalizeScenario(s.scenario))};
  });
  return {sources, reference: refResolved()};
}

// Que pasaria con un escenario de la lista, segun el simulador, contra su
// corrida de referencia (o la que se esta mirando). Para los propios, que no
// traen promesa comprobada.
function predictText(prof){
  const ref = prof.reference || refResolved();
  if (!ref) return "";
  const cfg = clone(state);
  cfg.detector.sources.forEach(s => {
    const def = prof.sources[s.name];
    if (def) { s.sensor = "scenario"; s.enabled = def.enabled; s.scenario = clone(def.scenario); }
  });
  try {
    const r = SIM.run(cfg, ref);
    if (r.refused) return "no inicia (" + (r.refused === "nomap" ? "falta el mapa" : "balance") + ")";
    return r.cut ? "prevision: corta por " + (TIPO_ALERTA[r.cut.type] || r.cut.type) + " de " + r.cut.source +
                   " a los " + fmtT(r.cut.at)
                 : "prevision: termina completa";
  } catch (e) { return ""; }
}

// Que perfil describe una configuracion: la clave del perfil, "real" (los dos
// sensores reales) o "custom" (cualquier otra cosa: un escenario editado a
// mano, sim, TEMP1 en none...). Se DEDUCE de los valores en vez de recordar
// el ultimo boton apretado: asi tambien acierta con un archivo cargado, con
// la configuracion que trae la placa y despues de editar un numero (que
// deja de ser el perfil, y tiene que dejar de verse como tal).
function profileOf(cfg){
  const sources = cfg && cfg.detector && Array.isArray(cfg.detector.sources) ? cfg.detector.sources : [];
  const realOf = name => name === "CEM1" ? "mlx90393" : "ds18b20";
  // Sin seccion (o sin clave sensor) rigen los compilados: sensores reales.
  if (sources.every(s => s.sensor === undefined || s.sensor === realOf(s.name))) return "real";
  const match = scenarioList().find(prof => sources.every(s => {
    const def = prof.sources[s.name];
    if (!def) return true;
    if (s.sensor !== "scenario" || !s.scenario) return false;
    // enabled ausente = el default compilado (CEM1 apagada, TEMP1 vigilada).
    const enabled = s.enabled === undefined ? s.name !== "CEM1" : s.enabled;
    if (enabled !== def.enabled) return false;
    const sc = normalizeScenario(s.scenario);
    const want = def.scenario;
    return Object.keys(want).every(k => k === "points"
      ? JSON.stringify(sc.points) === JSON.stringify(want.points)
      : Number(sc[k]) === want[k]);
  }));
  return match ? match.key : "custom";
}

function profileName(key){
  if (key === "real") return "sensores reales";
  if (key === "custom") return "personalizado (no coincide con ningun perfil)";
  const p = scenarioList().find(x => x.key === key);
  return p ? p.name : key;
}

// Las etapas que el monitor pasa cuando el generador esta embebido:
//   placa   = lo que corre ahora ({config, configId, texto, aviso}; config
//             null = valores de fabrica; texto = por que corre eso, armado
//             por el monitor -- lib/format.ts motivoConfig -- para que exista
//             en un solo lugar), o null si la placa todavia no informo nada;
//   enviado = lo mandado que todavia no corre ({config, configId, fase}:
//             "enviando" o "grabado" esperando el reinicio), o null.
// Abierto con doble clic no hay placa: solo existe la fila "Editando".
let stages = {placa: null, enviado: null};

// Marca el perfil que se esta editando y llena el bloque de etapas. Se llama
// desde paint(), que corre en cada edicion: los cambios de valor no
// re-renderizan.
function updateProfileMarks(){
  if (typeof document.querySelectorAll !== "function") return;
  const form = profileOf(state);
  document.querySelectorAll("button.prof").forEach(b => {
    const key = b.dataset.real ? "real" : b.dataset.profile;
    b.classList.toggle("on", key === form);
    b.setAttribute("aria-pressed", key === form ? "true" : "false");
  });
  const box = document.getElementById("profileStatus");
  if (!box) return;

  const row = (cls, label, value, note) =>
    '<span class="et ' + cls + '">' + label + '</span><span class="val">' + value + '</span>' +
    '<span class="nota">' + note + '</span>';
  const placa = stages.placa;
  const enviado = stages.enviado;
  const placaProf = placa ? profileOf(placa.config || {}) : null;
  const enviadoProf = enviado && enviado.config ? profileOf(enviado.config) : null;

  let h = "";
  if (EMBEDDED) {
    // "default" no es un perfil sino la ausencia de configuracion: se dice
    // asi, con el motivo, en vez de "sensores reales" a secas (que es cierto
    // -- de fabrica los sensores son los reales -- pero esconde el porque).
    const motivo = placa && placa.texto
      ? '<span class="' + (placa.aviso ? "alerta" : "") + '">' + esc(placa.texto) + '</span>' : "";
    h += placa
      ? (placa.configId === "default"
          ? row("placa", "En la placa", "Valores de fabrica",
                motivo + ". De fabrica los sensores son los reales.")
          : row("placa", "En la placa", esc(profileName(placaProf)),
                "config " + esc(placa.configId) + " · es lo que corre ahora"))
      : row("placa", "En la placa", '<span class="nada">sin informar</span>',
            "la placa todavia no publico su configuracion");
    if (!enviado)
      h += row("enviado", "Enviado", '<span class="nada">nada pendiente</span>',
               "no hay ningun envio esperando aplicarse");
    else if (enviado.fase === "enviando")
      h += row("enviado", "Enviado", enviadoProf ? esc(profileName(enviadoProf)) : "...",
               "enviandose a la placa");
    else
      h += row("enviado", "Enviado", enviadoProf ? esc(profileName(enviadoProf)) : "?",
               "config " + esc(enviado.configId || "?") + " · la placa confirmo y la grabo en la SD; " +
               "se aplica cuando la placa vuelva a Principal (se reinicia sola)");
  }
  let nota;
  if (!EMBEDDED) nota = "queda en el archivo al descargarlo";
  else if (enviado && enviadoProf === form) nota = "mismo perfil que lo enviado";
  else if (!enviado && placa && placaProf === form) nota = "mismo perfil que la placa";
  else nota = "sin enviar: no corre en la placa hasta enviarlo";
  h += row("form", "Editando", esc(profileName(form)), nota);
  box.innerHTML = h;
}

// Los dos unicos valores que ConfigLoader::loadRunType() entiende. Cualquier
// otro cae en "normal" en el firmware: una tarjeta pensada para banco
// marcaria sus corridas como experimento.
const RUN_TYPES = ["normal", "test"];
const REAL_SENSOR = { CEM1: "mlx90393", TEMP1: "ds18b20" };
// Un EXPERIMENTO corre si o si con los sensores reales y el Detector
// encendido (decision del 2026-11-19): datos inventados o un experimento sin
// nadie mirando los limites no pueden entrar al historico como experimento.
// Pasar a "normal" lo impone; lo que se cambio se puede deshacer (vuelve a
// prueba con lo que habia).
let runTypeNotice = null;   // {changed: [...], undo: {...}}
function enforceExperiment(){
  const undo = {sources: clone(state.detector.sources), detectorEnabled: state.detector.enabled};
  const changed = [];
  state.detector.sources.forEach(s => {
    const real = REAL_SENSOR[s.name];
    if (real && s.sensor !== real) { changed.push(s.name + ": " + s.sensor + " -> " + real); s.sensor = real; }
  });
  if (state.detector.enabled !== true) { changed.push("Detector encendido"); state.detector.enabled = true; }
  runTypeNotice = changed.length ? {changed, undo} : null;
}
function undoExperiment(){
  if (!runTypeNotice) return;
  state.detector.sources = runTypeNotice.undo.sources;
  state.detector.enabled = runTypeNotice.undo.detectorEnabled;
  state.runType = "test";
  runTypeNotice = null;
  render();
}


const getPath = p => p.split(".").reduce((o,k) => o[k], state);
function setPath(p, v){
  const parts = p.split(".");
  const last = parts.pop();
  parts.reduce((o,k) => o[k], state)[last] = v;
}

/* ===========================================================================
 * SIMULADOR DE ESCENARIOS -- copia en JS de lo que hace el Mega con una
 * corrida sintetica, para dibujar la senal y predecir el final ANTES de
 * mandarla. Replica, en este orden:
 *   mega2560/src/scenario.hpp          niveles, puntos, ruido, planta
 *   mega2560/src/scenariosensors.hpp   lo que lee cada sensor de escenario
 *   mega2560/src/fieldcontroller.hpp   el lazo de CEM1
 *   mega2560/src/detector.hpp          reglas, ventana, rachas, silencio
 *   mega2560/src/controlmap.hpp        duty de partida / rechazo en nulo
 *   mega2560/src/engine.hpp            estabilizacion, cadencias, corte
 * Mismo riesgo de deriva que las dos copias de seriallink.hpp: lo ataja
 * tools/test-generador.js, que corre cada perfil de tools/escenarios.json
 * con las mismas combinaciones que mega2560/test/test_scenario_runs y exige
 * el mismo final. Si se cambia algo de esa logica en el Mega, este bloque
 * tiene que cambiar igual.
 * No reproduce: el ruido exacto (en la placa el generador pseudoaleatorio
 * sigue de una corrida a la otra), la fase real del Timer ni el envio por
 * serie. Por eso el corte puede correrse unos segundos en la placa.
 * =========================================================================== */
const SIM = (() => {
  const f32 = Math.fround;

  // ---- scenario.hpp
  function pointsLevelAt(points, t){
    if (!Array.isArray(points) || points.length === 0) return 0;
    if (t < points[0][0]) return points[0][1];
    let i = 0;
    while (i + 1 < points.length && points[i + 1][0] <= t) i++;
    if (i + 1 >= points.length) return points[i][1];
    const [t0, l0] = points[i], [t1, l1] = points[i + 1];
    return l0 + (l1 - l0) * (t - t0) / (t1 - t0);
  }
  // Sin ruido: la forma que se dibuja.
  function shapeAt(sc, t){
    let level = pointsLevelAt(sc.points, t);
    if (sc.oscPeriod > 0) level += sc.oscAmp * Math.sin(2 * Math.PI * t / sc.oscPeriod);
    return level;
  }
  function levelAt(sc, t, unitNoise){ return shapeAt(sc, t) + (sc.noise || 0) * unitNoise; }
  // xorshift32, identico al del Mega (uint32 y float de 32 bits).
  function makeNoise(seed){
    let state = seed >>> 0;
    return () => {
      if (state === 0) state = 0x9E3779B9;
      state = (state ^ (state << 13)) >>> 0;
      state = (state ^ (state >>> 17)) >>> 0;
      state = (state ^ (state << 5)) >>> 0;
      return f32(f32(state) / f32(4294967295)) * 2 - 1;
    };
  }
  const center = r => (r.normalMin + r.normalMax) / 2;
  function levelToValue(r, level){
    const c = center(r), half = (r.normalMax - r.normalMin) / 2;
    if (level >= 0) {
      if (level <= 1) return c + level * half;
      let gap = r.criticalMax - r.normalMax; if (gap <= 0) gap = half;
      return r.normalMax + (level - 1) * gap;
    }
    if (level >= -1) return c + level * half;
    let gap = r.normalMin - r.criticalMin; if (gap <= 0) gap = half;
    return r.normalMin + (level + 1) * gap;
  }
  // Inversa de levelToValue (para arrastrar puntos sobre el grafico).
  function valueToLevel(r, v){
    const c = center(r), half = (r.normalMax - r.normalMin) / 2;
    if (half <= 0) return 0;
    if (v >= r.normalMax) {
      let gap = r.criticalMax - r.normalMax; if (gap <= 0) gap = half;
      return 1 + (v - r.normalMax) / gap;
    }
    if (v <= r.normalMin) {
      let gap = r.normalMin - r.criticalMin; if (gap <= 0) gap = half;
      return -1 - (r.normalMin - v) / gap;
    }
    return (v - c) / half;
  }
  function fieldValue(sc, r, level, duty){
    const value = levelToValue(r, level);
    if (!(sc.setpointDuty > 0)) return value;
    const target = center(r);
    return target * (duty / sc.setpointDuty) + (value - target);
  }

  // ---- detectorconfigbuilder.hpp
  function cemRanges(target, tol, mult, mode){
    if (mode === "null") {
      const band = target * tol / 100;
      return {normalMin: -band, normalMax: band, criticalMin: -mult * band, criticalMax: mult * band};
    }
    return {criticalMin: target * (1 - mult * tol / 100), criticalMax: target * (1 + mult * tol / 100),
            normalMin: target * (1 - tol / 100), normalMax: target * (1 + tol / 100)};
  }

  // ---- fieldcontroller.hpp
  function makeController(ctl, intervalMs){
    const c = {kp: ctl.kp, maxStep: ctl.maxStep, deadBand: ctl.deadBand, sampleTime: intervalMs / 1000,
               driftThreshold: 0.02, driftWindow: 5, integralGain: 0.001, integralLimit: 0.2};
    const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
    let setpoint = 0, output = 0, integral = 0, win = [], idx = 0, filled = false;
    return {
      setSetpoint(v){ setpoint = v; },
      preload(v){ output = clamp(v, 0, 1); },
      get output(){ return output; },
      update(measured){
        win[idx] = measured; idx++;
        if (idx >= c.driftWindow) { idx = 0; filled = true; }
        const error = setpoint - measured;
        const n = filled ? c.driftWindow : idx;
        let variation = 0;
        if (n >= 2) { const w = win.slice(0, n); variation = Math.max(...w) - Math.min(...w); }
        if (Math.abs(error) > c.deadBand) output += clamp(c.kp * error, -c.maxStep, c.maxStep);
        else if (filled && variation > c.driftThreshold) {
          integral = clamp(integral + error * c.sampleTime * c.integralGain, -c.integralLimit, c.integralLimit);
          output += integral;
        }
        output = clamp(output, 0, 1);
        return output;
      }
    };
  }

  // ---- detector.hpp (Rule + Source + silencio)
  function makeRule(r){
    let total = 0, cd = 0;
    return {
      maxEvents: r.maxEvents,
      get total(){ return total; },
      cool(n){ cd = n >= cd ? 0 : cd - n; },
      evaluate(value){
        if (!r.threshold || value < r.threshold || cd > 0) return false;
        if (r.maxEvents > 0 && total >= r.maxEvents) return false;
        total++; cd = r.cooldown; return true;
      }
    };
  }
  const MIN_SILENCE_MS = 5000;
  function makeSource(name, src, ranges, intervalMs, emit){
    const size = src.bufferSize, buf = [];
    let head = 0, outCount = 0, critStreak = 0, outStreak = 0;
    const rules = {critical: makeRule(src.rules.critical), streak: makeRule(src.rules.streak),
                   frequency: makeRule(src.rules.frequency)};
    const isOut = v => v < ranges.normalMin || v > ranges.normalMax;
    const isCrit = v => v < ranges.criticalMin || v > ranges.criticalMax;
    let lastAlive = 0, armed = false, reported = false;
    const maxMissed = src.maxMissedSamples;
    const limitMs = (maxMissed && intervalMs) ? Math.max(maxMissed * intervalMs, MIN_SILENCE_MS) : 0;
    function fire(type, rule, now){
      if (rule.evaluate(type === "critical" ? critStreak : type === "streak" ? outStreak : outCount))
        emit({t: now / 1000, source: name, type, count: rule.total, limit: rule.maxEvents});
    }
    return {
      addSample(v, now){
        if (size > 0) {
          if (buf.length < size) buf.push(v);
          else { if (isOut(buf[head])) outCount = Math.max(0, outCount - 1); buf[head] = v; head = (head + 1) % size; }
        }
        if (isOut(v)) outCount++;
        critStreak = isCrit(v) ? critStreak + 1 : 0;
        outStreak = isOut(v) ? outStreak + 1 : 0;
        rules.critical.cool(1); rules.streak.cool(1); rules.frequency.cool(1);
        fire("critical", rules.critical, now);
        fire("streak", rules.streak, now);
        fire("frequency", rules.frequency, now);
      },
      resetSilence(now){ lastAlive = now; armed = false; reported = false; },
      noteAlive(now){ lastAlive = now; },
      arm(){ armed = true; },
      checkSilence(now){
        if (!armed || reported || !limitMs) return;
        const silent = now - lastAlive;
        if (silent < limitMs) return;
        reported = true;
        const missed = Math.max(Math.floor(silent / intervalMs), maxMissed);
        emit({t: now / 1000, source: name, type: "silence", count: missed, limit: maxMissed});
      }
    };
  }

  // ---- controlmap.hpp
  function findMapPoint(map, intensity, frequency){
    return (map || []).find(p => Math.abs(p.intensity - intensity) <= 0.001 &&
                                 Math.abs(p.frequency - frequency) <= 0.5) || null;
  }

  // ---- la corrida (engine.hpp)
  // cfg = el estado del formulario; ref = {intensity, frequency, tolerance,
  // tempNormal:{min,max}, tempCritical:{min,max}, durationS, mode:"x"|"null"}.
  function run(cfg, ref, opts){
    opts = opts || {};
    const stepMs = opts.stepMs || 100;
    const iv = cfg.intervals.mega;
    const cemMs = iv.measureMagneticField, tempMs = iv.measureTemperature, settleMs = iv.settlingTime;
    const ctl = cfg.control;
    const byName = n => cfg.detector.sources.find(s => s.name === n);
    const cemS = byName("CEM1"), tempS = byName("TEMP1");
    const detectorOn = cfg.detector.enabled !== false;
    const ranges = {
      CEM1: cemRanges(ref.intensity, ref.tolerance, cemS.range.criticalMultiplier, ref.mode),
      TEMP1: {normalMin: ref.tempNormal.min, normalMax: ref.tempNormal.max,
              criticalMin: ref.tempCritical.min, criticalMax: ref.tempCritical.max}
    };
    const out = {ranges, samples: {CEM1: [], TEMP1: []}, duty: [], events: [], cut: null, refused: null,
                 durationS: ref.durationS,
                 simulated: {CEM1: cemS.sensor === "scenario", TEMP1: tempS.sensor === "scenario"}};

    // Plan de arranque: en campo nulo sin punto mapeado (o con balance de
    // mas) el Mega ni arranca.
    const point = findMapPoint(ctl.map, ref.intensity, ref.frequency);
    let openLoop = false, startDuty = 0;
    if (ref.mode === "null") {
      if (!point) { out.refused = "nomap"; return out; }
      if (Math.abs(point.balance) > ctl.balanceMax) { out.refused = "balance"; return out; }
      openLoop = true; startDuty = point.duty;
    } else if (point) startDuty = point.duty;
    else if (out.simulated.CEM1 && cemS.scenario.setpointDuty > 0) startDuty = cemS.scenario.setpointDuty;
    const loopOn = ctl.enabled !== false;
    const controller = makeController(ctl, cemMs);
    controller.setSetpoint(ref.mode === "null" ? 0 : ref.intensity);
    controller.preload(loopOn ? startDuty : 0);
    let duty = loopOn ? controller.output : 0;

    const emit = ev => {
      out.events.push(ev);
      if (!out.cut && ev.count >= ev.limit) out.cut = {at: ev.t, source: ev.source, type: ev.type};
    };
    // Solo entran al Detector las fuentes vigiladas Y simuladas: una con
    // sensor real no se puede predecir desde aca.
    const src = {};
    if (cemS.enabled && out.simulated.CEM1) src.CEM1 = makeSource("CEM1", cemS, ranges.CEM1, cemMs, emit);
    if (tempS.enabled && out.simulated.TEMP1) src.TEMP1 = makeSource("TEMP1", tempS, ranges.TEMP1, tempMs, emit);
    Object.values(src).forEach(s => s.resetSilence(0));
    const cemNoise = makeNoise(0x1234567), tempNoise = makeNoise(0x7654321);

    // Silencio del LAZO (Engine::_checkControlSilence): con el lazo activo en
    // campo X, CEM1 sin lecturas corta aunque no este vigilada ni haya
    // Detector, porque el lazo seguiria excitando a ciegas.
    let lastMagAlive = 0;
    const cemSilenceMs = (cemS.maxMissedSamples && cemMs)
      ? Math.max(cemS.maxMissedSamples * cemMs, MIN_SILENCE_MS) : 0;

    let settling = true;
    let nextCem = cemMs + (opts.cemPhaseMs || 0), nextTemp = tempMs + (opts.tempPhaseMs || 0);
    const endMs = ref.durationS * 1000;
    for (let now = 0; now <= endMs && !out.cut; now += stepMs) {
      if (settling && now >= settleMs) { settling = false; Object.values(src).forEach(s => s.arm()); }
      const t = now / 1000;
      if (now >= nextCem) {
        nextCem += cemMs;
        if (out.simulated.CEM1) {
          const sc = cemS.scenario;
          if (sc.dropAt > 0 && t >= sc.dropAt) out.samples.CEM1.push({t, valid: false});
          else {
            let v = fieldValue(sc, ranges.CEM1, levelAt(sc, t, cemNoise()), duty);
            if (v < 0) v = 0;
            out.samples.CEM1.push({t, v, valid: true, settling});
            lastMagAlive = now;
            if (src.CEM1) src.CEM1.noteAlive(now);
            if (loopOn && !openLoop) duty = controller.update(v);
            if (src.CEM1 && !settling && detectorOn) src.CEM1.addSample(v, now);
          }
        }
        out.duty.push({t, d: duty});
      }
      if (now >= nextTemp) {
        nextTemp += tempMs;
        if (out.simulated.TEMP1) {
          const sc = tempS.scenario;
          if (sc.dropAt > 0 && t >= sc.dropAt) out.samples.TEMP1.push({t, valid: false});
          else {
            const v = levelToValue(ranges.TEMP1, levelAt(sc, t, tempNoise()));
            out.samples.TEMP1.push({t, v, valid: true, settling});
            if (src.TEMP1) src.TEMP1.noteAlive(now);
            if (src.TEMP1 && !settling && detectorOn) src.TEMP1.addSample(v, now);
          }
        }
      }
      if (detectorOn) Object.values(src).forEach(s => s.checkSilence(now));
      if (!out.cut && out.simulated.CEM1 && loopOn && !openLoop && !settling && cemSilenceMs &&
          now - lastMagAlive >= cemSilenceMs) {
        const missed = Math.max(Math.floor((now - lastMagAlive) / cemMs), cemS.maxMissedSamples);
        emit({t, source: "CEM1", type: "silence", count: missed, limit: cemS.maxMissedSamples});
      }
    }
    return out;
  }

  return {pointsLevelAt, shapeAt, levelToValue, valueToLevel, fieldValue, cemRanges, makeNoise, run};
})();

/* ---------- helpers de render ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* LIMITES por campo (fase 3): los MISMOS rangos que validate() y que el
 * firmware acepta. Con ellos el campo trae min/max (las flechas no se pasan),
 * se pone en rojo mientras se escribe un valor fuera de rango y, al salir del
 * campo, un valor fuera de rango vuelve al ultimo valido: un valor que el
 * Mega descartaria no llega a quedar en la configuracion. validate() sigue
 * siendo la red de seguridad para lo que venga de un archivo.
 * Cada entrada: [regex del path, min, max, entero?]; min/max pueden ser
 * funciones del path (threshold depende del bufferSize de su fuente). */
const EPS = 0.001;   // "mayor que 0" en un campo decimal
const FIELD_LIMITS = [
  [/^menus\.\w+\.\d+\.value$/, EPS, 1e9, false],
  [/^intervals\.\w+\.\w+$/, 1, 3600000, true],
  [/^control\.kp$/, EPS, 100, false],
  [/^control\.maxStep$/, EPS, 1, false],
  [/^control\.deadBand$/, 0, 100, false],
  [/^control\.balanceMax$/, 0, MAX_BALANCE, false],
  [/^control\.map\.\d+\.duty$/, EPS, 1, false],
  [/^control\.map\.\d+\.balance$/, -MAX_BALANCE, MAX_BALANCE, false],
  [/^coils\.\d+\.calibrationFactor$/, 0.1, 5, false],
  [/^detector\.sources\.\d+\.bufferSize$/, 8, 32, true],
  [/^detector\.sources\.\d+\.maxMissedSamples$/, 1, 20, true],
  [/^detector\.sources\.\d+\.range\.criticalMultiplier$/, 1, 3, false],
  [/^detector\.sources\.\d+\.rules\.\w+\.threshold$/, 1, path => {
    const bs = getPath(path.replace(/\.rules\.\w+\.threshold$/, ".bufferSize"));
    return isInt(bs) && bs >= 8 && bs <= 32 ? bs : 32;
  }, true],
  [/^detector\.sources\.\d+\.rules\.\w+\.cooldown$/, 0, 64, true],
  [/^detector\.sources\.\d+\.rules\.\w+\.maxEvents$/, 1, 10, true],
  [/^detector\.sources\.\d+\.scenario\.noise$/, 0, SCENARIO_MAX_LEVEL, false],
  [/^detector\.sources\.\d+\.scenario\.oscAmp$/, -SCENARIO_MAX_LEVEL, SCENARIO_MAX_LEVEL, false],
  [/^detector\.sources\.\d+\.scenario\.(oscPeriod|dropAt)$/, 0, SCENARIO_MAX_SECOND, false],
  [/^detector\.sources\.\d+\.scenario\.setpointDuty$/, 0, 1, false],
  [/^currentSensors\.\d+\.(ratedCurrent|ratedVoltage|calibration)$/, EPS, 1e6, false],
  [/^currentSensors\.\d+\.sampleRate$/, 1, 860, true],
  [/^currentSensors\.\d+\.integrationTimeMs$/, 1, 60000, true],
  [/^telemetry\.groups\.\w+\.interval$/, 1, 3600000, true],
  [/^broker\.port$/, 1, 65535, true],
];
function limitsFor(path){
  const f = FIELD_LIMITS.find(([re]) => re.test(path));
  if (!f) return null;
  const val = x => typeof x === "function" ? x(path) : x;
  return {min: val(f[1]), max: val(f[2]), int: f[3]};
}
const fmtLim = n => String(n).replace(".", ",");
function withinLimits(v, lim){
  return isNum(v) && v >= lim.min && v <= lim.max && (!lim.int || Number.isInteger(v));
}
// Ultimo valor valido de cada campo, para volver a el.
const lastValid = {};

function num(path, kind, label){
  const step = kind === INT ? "1" : "any";
  const lim = limitsFor(path);
  const v = getPath(path);
  if (lim && withinLimits(v, lim)) lastValid[path] = v;
  return '<label class="f"><span>' + esc(label) + '</span>' +
    '<input type="number" step="' + step + '" data-path="' + path + '" data-kind="' + kind + '"' +
    (lim ? ' min="' + lim.min + '" max="' + lim.max + '" title="Permitido: ' + fmtLim(lim.min) + ' a ' +
      fmtLim(lim.max) + (lim.int ? ' (entero)' : '') + '"' +
      (withinLimits(v, lim) ? '' : ' class="fuera"') : '') +
    ' value="' + v + '"></label>';
}
function txt(path, label, maxlen){
  return '<label class="f"><span>' + esc(label) + '</span>' +
    '<input type="text" maxlength="' + (maxlen || 60) + '" data-path="' + path + '" data-kind="str"' +
    ' value="' + esc(getPath(path) ?? "") + '"></label>';
}
function chk(path, label){
  return '<label class="chk"><input type="checkbox" data-path="' + path + '" data-kind="bool"' +
    (getPath(path) ? " checked" : "") + '> <span>' + esc(label) + '</span></label>';
}
function sel(path, label, opts){
  const v = String(getPath(path));
  return '<label class="f"><span>' + esc(label) + '</span>' +
    '<select data-path="' + path + '" data-kind="str">' +
    opts.map(o => '<option value="' + o + '"' + (o === v ? " selected" : "") + '>' + o + '</option>').join("") +
    '</select></label>';
}

const TELEMETRY_GROUPS = [

// Solo estos campos tienen clave configurable. Las claves de los grupos
// nuevos son estructurales ("c1".."d4", "REASON", "SRC"...): forman parte de
// la forma del mensaje, no son valores que el operador elija.
const TELEMETRY_FIELDS = [
  ["magneticField","Campo magnetico",     "measures"],
  ["temperature",  "Temperatura",         "measures"],
  ["health",       "Salud",               "status"],
  ["progress",     "Progreso",            "status"],
  ["elapsedTime",  "Tiempo transcurrido", "status"]
];

/* ===========================================================================
 * Modo embebido (tarjeta 24): el monitor web carga este mismo archivo dentro
 * de su seccion Configuracion, para que la validacion tenga UNA sola fuente.
 * Embebido: no muestra ni produce wifi/broker (las credenciales no viajan
