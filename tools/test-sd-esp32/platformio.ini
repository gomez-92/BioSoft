; BioSoft - Banco de pruebas del modulo SD (ESP32)
;
; Proyecto PlatformIO independiente, de banco: NO es firmware del sistema.
; Ejercita esp32/src/sdstorage.hpp contra una tarjeta real y reporta por
; el monitor serie.
;
; Incluye el header REAL del firmware via -I, no una copia. Duplicarlo
; dejaria al banco validando una version vieja mientras la placa corre
; otra -- la misma deriva que ya paso con los dos seriallink.hpp.
; Como sdstorage.hpp es header-only (inline), alcanza con el include path.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Sin lib_deps: SD y SPI vienen con el core, y sdstorage.hpp no necesita
; nada mas. Sin LVGL, sin TFT_eSPI, sin secrets.h.

build_flags =
    -I ../../esp32/src

monitor_speed = 115200
