<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de config.json — BioSoft</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#16191d; --muted:#5f6873; --line:#dfe3e8;
    --accent:#1f6feb; --err:#b3261e; --errbg:#fdeceb; --warn:#8a5a00; --warnbg:#fff6e0;
    --ok:#136a3a; --okbg:#e8f5ee; --code:#f2f4f7;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171b; --panel:#1b1f24; --ink:#e6e9ee; --muted:#9aa4b0; --line:#2c333b;
      --accent:#6ea8ff; --err:#ff8a80; --errbg:#3a1f1d; --warn:#ffcf70; --warnbg:#3a2f16;
      --ok:#7ee0a8; --okbg:#17301f; --code:#12151a;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:10;background:var(--panel);
         border-bottom:1px solid var(--line);padding:12px 20px}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;max-width:1100px;margin:0 auto}
  h1{font-size:16px;margin:0;flex:1;min-width:240px}
  h1 small{display:block;font-weight:400;color:var(--muted);font-size:12px}
  main{max-width:1100px;margin:0 auto;padding:20px}
  button{font:inherit;padding:7px 13px;border-radius:6px;border:1px solid var(--line);
         background:var(--panel);color:var(--ink);cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary:disabled{opacity:.45;cursor:not-allowed}
  button.mini{padding:3px 8px;font-size:12px}
  section{background:var(--panel);border:1px solid var(--line);border-radius:8px;
          padding:16px 18px;margin-bottom:16px}
  section > h2{font-size:15px;margin:0 0 4px}
  .hint{color:var(--muted);font-size:12.5px;margin:0 0 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  label.f{display:block}
  label.f > span:first-child{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
  input[type=text],input[type=number],select{width:100%;padding:6px 8px;border-radius:5px;
    border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
  .row{display:flex;gap:10px;align-items:flex-end;padding:8px 0;border-bottom:1px dashed var(--line)}
  .row:last-of-type{border-bottom:0}
  .row .grow{flex:1}
  .row .w110{width:110px;flex:none}
  .chk{display:flex;gap:7px;align-items:center;white-space:nowrap}
  .sub{border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-top:12px}
  .sub h3{font-size:13.5px;margin:0 0 10px}
  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:5px 8px 5px 0;vertical-align:bottom}
  th{color:var(--muted);font-weight:500;font-size:12px}
  .msgs{max-width:1100px;margin:0 auto}
  /* La cabecera fija lleva SOLO la barra de botones y una linea de resumen.
     La lista completa de errores y avisos va debajo, en el flujo de la
     pagina: con una configuracion de prueba (sensores simulados, detector
     apagado) son facilmente diez avisos, y fijos ocupaban media pantalla --
     embebido en el monitor, casi todo el marco --, dejando un hueco minimo
     para recorrer el formulario. */
  .resumen{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:1100px;margin:8px auto 0;
           font-size:12.5px}
  .resumen .pill{padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg);
                 cursor:pointer;font:inherit;font-size:12.5px}
  .resumen .pill.e{color:var(--err);border-color:var(--err);background:var(--errbg)}
  .resumen .pill.w{color:var(--warn);border-color:var(--warn);background:var(--warnbg)}
  .resumen .pill.o{color:var(--ok);border-color:var(--ok);background:var(--okbg)}
  .resumen .envio{flex:1;min-width:200px}
  .resumen .envio .msg{margin:0;padding:4px 10px}
  #msgs{margin-bottom:16px;scroll-margin-top:120px}
  #msgs .msg:first-child{margin-top:0}
  #msgs .msg ul{max-height:none}
  body.embebido .bar, body.embebido .resumen, body.embebido main, body.embebido .msgs{max-width:1400px}
  .solo-lectura{color:var(--muted);font-size:12.5px}
  .msg{padding:8px 12px;border-radius:6px;margin-top:8px;font-size:13px}
  .msg ul{margin:6px 0 0;padding-left:20px}
  .msg.e{background:var(--errbg);color:var(--err);border:1px solid var(--err)}
  .msg.w{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn)}
  .msg.o{background:var(--okbg);color:var(--ok);border:1px solid var(--ok)}
  /* Perfil de escenario. Los botones marcan SOLO lo que se esta editando;
     lo que corre en la placa y lo enviado van en un bloque aparte, una fila
     por etapa: mezclarlos en los mismos botones confundia. */
  button.prof.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.prof.on::before{content:"✓ "}
  .etapas{display:grid;grid-template-columns:auto auto 1fr;gap:6px 14px;align-items:baseline;
          font-size:13px;margin:0 0 12px;padding:10px 12px;border-radius:6px;
          background:var(--code);border:1px solid var(--line)}
  .etapas .et{font-weight:600;white-space:nowrap}
  .etapas .et::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;
                      margin-right:6px;vertical-align:-1px}
  .etapas .et.placa::before{background:var(--ok)}
  .etapas .et.enviado::before{background:var(--warn)}
  .etapas .et.form::before{background:var(--accent)}
  .etapas .val{font-weight:600}
  .etapas .nota{color:var(--muted)}
  .etapas .nada{color:var(--muted);font-weight:400}
  .etapas .alerta{color:var(--warn);font-weight:600}
  @media (max-width:600px){ .etapas{grid-template-columns:1fr} .etapas .nota{margin-bottom:6px} }
  .msg.i{background:var(--code);color:var(--ink);border:1px solid var(--accent)}
  pre{background:var(--code);border:1px solid var(--line);border-radius:6px;
      padding:12px;overflow:auto;max-height:340px;font-size:12px}
</style>
</head>
<body>

<header>
  <div class="bar">
    <h1>Generador de <code>config.json</code>
      <small>BioSoft — esquema v1 · destino <code>/biosoft/config.json</code> en la SD del CYD</small></h1>
    <input type="file" id="file" accept=".json,application/json" hidden>
    <button id="btnLoad">Cargar archivo…</button>
    <button id="btnReset">Restaurar defaults</button>
    <button class="primary" id="dl">Descargar config.json</button>
    <button class="primary" id="send" hidden>Enviar a la placa</button>
    <span class="solo-lectura" id="readonlyNote" hidden>Solo lectura: enviar a la placa es para administradores.</span>
  </div>
  <div class="resumen">
    <span id="msgSummary"></span>
    <span class="envio" id="sendStatus" role="status" aria-live="polite"></span>
  </div>
</header>

<main>
  <div class="msgs" id="msgs"></div>
  <div id="app"></div>
</main>

<script>
"use strict";

/* ===========================================================================
 * Defaults: identicos a docs/config.example.json, que a su vez son identicos
 * a los defaults compilados del firmware. Arrancar de aca significa que un
 * archivo generado sin tocar nada no cambia el comportamiento del equipo.
 * =========================================================================== */
const DEFAULTS = {
  schemaVersion: 1,
  runType: "normal",
  requireMega: true,
  menus: {
    fieldIntensity: [{label:"1.0 mT",value:1.0},{label:"2.0 mT",value:2.0}],
    frequency: [{label:"10 Hz",value:10},{label:"50 Hz",value:50}],
    duration: [{label:"00h 01m",value:60000},{label:"00h 05m",value:300000},
               {label:"00h 10m",value:600000},{label:"01h 00m",value:3600000},
               {label:"01h 30m",value:5400000},{label:"02h 00m",value:7200000}],
    fieldTolerance: [{label:"5%",value:5},{label:"10%",value:10}],
    temperatureNormal: [{label:"30~40 C",min:30,max:40},{label:"28~42 C",min:28,max:42},
                        {label:"26~44 C",min:26,max:44}],
    temperatureCritical: [{label:"25~45 C",min:25,max:45},{label:"23~47 C",min:23,max:47},
                          {label:"20~50 C",min:20,max:50}]
  },
  intervals: {
    esp32: {updateScreens:50,reSendStart:4000,reSendStop:4000,reSendReset:4000,updateProgress:5000,
            reSendConfig:4000,splashTimeout:4000,busyTimeout:6000},
    mega: {ping:2000,sendState:5000,measureTemperature:5000,measureCurrent:8500,
           measureMagneticField:2000,updateProgress:1000,sendFlags:25000,sendResult:1000,
           settlingTime:10000}
  },
  control: {enabled:true,kp:0.1,maxStep:0.05,deadBand:0.01,balanceMax:0.2,map:[]},
  coils: [
    {name:"BOB1",enabled:true, calibrationFactor:1.0},
    {name:"BOB2",enabled:true, calibrationFactor:1.0},
    {name:"BOB3",enabled:false,calibrationFactor:1.0},
    {name:"BOB4",enabled:false,calibrationFactor:1.0}
  ],
  detector: { enabled: true, sources: [
    {name:"CEM1",enabled:false,sensor:"mlx90393",bufferSize:32,maxMissedSamples:3,
     range:{mode:"derived",criticalMultiplier:1.25},
     rules:{critical:{threshold:3,cooldown:1,maxEvents:2},
            streak:{threshold:5,cooldown:4,maxEvents:5},
            frequency:{threshold:16,cooldown:16,maxEvents:3}},
     scenario:{base:0,noise:0.1,ramp:0,stepAt:0,step:0,oscAmp:0,oscPeriod:0,dropAt:0,setpointDuty:0.5}},
    {name:"TEMP1",enabled:true,sensor:"ds18b20",bufferSize:32,maxMissedSamples:3,
     range:{mode:"operator"},
     rules:{critical:{threshold:3,cooldown:1,maxEvents:2},
            streak:{threshold:5,cooldown:4,maxEvents:5},
            frequency:{threshold:16,cooldown:16,maxEvents:3}},
     scenario:{base:0,noise:0.1,ramp:0,stepAt:0,step:0,oscAmp:0,oscPeriod:0,dropAt:0}}
  ]},
  currentSensors: [
    {name:"SCT013-1",enabled:true, address:72,channel:0,ratedCurrent:5.0,ratedVoltage:1.0,calibration:0.775,sampleRate:860,integrationTimeMs:200},
    {name:"SCT013-2",enabled:false,address:72,channel:1,ratedCurrent:5.0,ratedVoltage:1.0,calibration:0.775,sampleRate:860,integrationTimeMs:200},
    {name:"SCT013-3",enabled:false,address:73,channel:0,ratedCurrent:5.0,ratedVoltage:1.0,calibration:0.775,sampleRate:860,integrationTimeMs:200},
    {name:"SCT013-4",enabled:false,address:73,channel:1,ratedCurrent:5.0,ratedVoltage:1.0,calibration:0.775,sampleRate:860,integrationTimeMs:200}
  ],
  // Marcadores a proposito: este archivo se versiona en el repo y el
  // generador lo usa de base. Las credenciales reales las escribe el
  // operador en el formulario, nunca viajan aca.
  wifi: [
    {ssid:"RED_1", password:"CLAVE_1"},
    {ssid:"RED_2", password:"CLAVE_2"},
    {ssid:"",      password:""},
    {ssid:"",      password:""},
    {ssid:"",      password:""}
  ],
  broker: {
    server:"broker.example.com",
    port:8883,
    user:"usuario_mqtt",
    password:"password_mqtt",
    clientId:"biosoft-esp32"
  },
  telemetry: {
    groups:{
      measures:{enabled:true,topic:"biosoft/telemetry/measures",interval:2000,retain:true},
      coils:   {enabled:true,topic:"biosoft/telemetry/coils",   interval:5000,retain:true},
      status:  {enabled:true,topic:"biosoft/telemetry/status",  interval:5000,retain:true},
      targets: {enabled:true,topic:"biosoft/telemetry/targets",                retain:true},
      alerts:  {enabled:true,topic:"biosoft/telemetry/alerts",                 retain:false},
      result:  {enabled:true,topic:"biosoft/telemetry/result",                 retain:true}
    },
    fields:{
      magneticField:{enabled:true,name:"CEM1"},
      temperature:{enabled:true,name:"TEMP1"},
      health:{enabled:true,name:"ESTADO"},
      progress:{enabled:true,name:"PROGRESS"},
      elapsedTime:{enabled:true,name:"ELAPSED_TIME"}
    }
  }
};

/* Topes del esquema (seccion 1.3: todo tope de memoria es de compilacion). */
const MAX_MENU_OPTIONS = 8;
// Intensidad y frecuencia tienen tope 3 cada una (ConfigurationOptions::
// MaxFieldIntensityOptions / MaxFrequencyOptions): el mapa de calibracion del
// campo nulo es uno por combinacion, y 3 x 3 = 9 puntos es lo que cabe en el
// Mega (ControlMap::MaxPoints). Una cuarta opcion del menu se ignora en la placa.
const MENU_CAP = {fieldIntensity: 3, frequency: 3};
const menuMax = key => MENU_CAP[key] || MAX_MENU_OPTIONS;
const MAX_MAP_POINTS = 9;       // ControlMap::MaxPoints
const MAX_BALANCE = 0.5;        // CoilChannels::MaxBalance
const MAP_MATCH_INT = 0.001;    // ControlMapLimits::IntensityMatch (mT)
const MAP_MATCH_FREQ = 0.5;     // ControlMapLimits::FrequencyMatch (Hz)
const MAX_WIFI_NETWORKS = 5;   // WiFiConfig::MAX_NETWORKS
const MAX_SSID = 32;
const MAX_WIFI_PASS = 63;      // maximo de WPA2
const MAX_BROKER_HOST = 63;
const MAX_BROKER_USER = 31;
const MAX_BROKER_PASS = 63;
const MAX_BROKER_CLIENTID = 31;
const MAX_LABEL  = 15;   // label de menu, name de bobina, de sensor y de campo
const MAX_TOPIC  = 63;
const MQTT_BUFFER = 384; // Topics::MaxPayloadLength, el buffer de MySystem::_publishTelemetry()

const clone = o => JSON.parse(JSON.stringify(o));
let state = clone(DEFAULTS);

/* ===========================================================================
 * Enteros vs. floats: NO es cosmetico.
 *
 * Verificado contra ArduinoJson 7, la version que compila el firmware:
 *   is<float>()         acepta 1 y 1.0   -> un float se puede escribir entero
 *   is<unsigned long>() acepta 1, RECHAZA 1.0
 *
 * O sea que una clave entera escrita con punto decimal se pierde en silencio.
 * En intervals y bufferSize queda el default compilado; en los menus es peor,
 * porque ConfigLoader los lee con `option["value"] | 0` y el fallback del
 * operador | se aplica justamente cuando is<T>() da false: la opcion queda
 * en 0, y el operador ve un menu con una duracion de 0 ms.
 *
 * Por eso todo campo INT se valida con Number.isInteger antes de dejar
 * descargar. Es la razon principal por la que conviene generar el archivo
 * con esta herramienta en vez de editarlo a mano.
 * =========================================================================== */
const INT = "int", FLT = "float";

// Drivers que el Mega acepta para cada fuente (SensorChoices::parse en
// mega2560/src/sensorchoice.hpp). Un valor fuera de la lista lo rechaza y se
// queda con el anterior: la tarjeta diria "sim" y el equipo seguiria
// leyendo el sensor real, o al reves. CEM1 no admite "none": es la
// realimentacion del lazo de control.
const SOURCE_SENSORS = { CEM1: ["mlx90393", "sim", "scenario"], TEMP1: ["ds18b20", "sim", "scenario", "none"] };

// Direccion (ROM code) del DS18B20 de TEMP1: mismas reglas que
// mega2560/src/onewireaddress.hpp -- 16 digitos hex, con o sin ":" "-" o
// espacios, familia 0x28 y CRC8 Dallas en el ultimo byte. El Mega rechaza
// una direccion mala y sigue con la anterior; aca se frena antes. Mismo
// riesgo de deriva que MAX_BALANCE: si cambia una regla, cambian las dos.
function crc8Dallas(bytes){
  let crc = 0;
  for (let b of bytes){
    for (let i = 0; i < 8; i++){
      const mix = (crc ^ b) & 1;
      crc >>= 1;
      if (mix) crc ^= 0x8C;
      b >>= 1;
    }
  }
  return crc;
}
function parseRomCode(text){
  const hex = String(text).replace(/[:\-\s]/g, "");
  if (!/^[0-9a-fA-F]{16}$/.test(hex)) return {error: "no son 16 digitos hex"};
  const bytes = [];
  for (let i = 0; i < 16; i += 2) bytes.push(parseInt(hex.slice(i, i + 2), 16));
  if (bytes[0] !== 0x28) return {error: "no empieza con 28, asi que no es un DS18B20"};
  if (crc8Dallas(bytes.slice(0, 7)) !== bytes[7]) return {error: "el CRC no coincide: hay un digito mal copiado"};
  return {bytes};
}
const formatRomCode = bytes => bytes.map(b => b.toString(16).toUpperCase().padStart(2, "0")).join(":");

// Escenarios sinteticos (tarjeta 22): la senal se mide en NIVELES relativos a
// los rangos de la corrida, no en valores fisicos (mega2560/src/scenario.hpp):
//   0 = centro del rango normal, +-1 = borde del normal, +-2 = borde del
//   critico, mas alla de 2 = adentro de la zona critica.
// Asi un perfil significa lo mismo con cualquier rango elegido en pantalla.
const SCENARIO_KEYS = [
  ["base", FLT, "Nivel base"],
  ["noise", FLT, "Ruido (niveles, >= 0)"],
  ["ramp", FLT, "Rampa (niveles/min)"],
  ["stepAt", FLT, "Salto a los (s)"],
  ["step", FLT, "Salto (niveles)"],
  ["oscAmp", FLT, "Oscilacion (niveles)"],
  ["oscPeriod", FLT, "Periodo de oscilacion (s)"],
  ["dropAt", FLT, "Sensor caido a los (s, 0 = nunca)"]
];
const QUIET = {base:0,noise:0.1,ramp:0,stepAt:0,step:0,oscAmp:0,oscPeriod:0,dropAt:0};
// Cada perfil fija las DOS fuentes en "scenario" y define su senal. Los que
// prueban el campo prenden CEM1 en el Detector: viene apagada de fabrica, y
// sin eso un "campo inestable" no levantaria ningun flag.
const SCENARIO_PROFILES = [
  ["normal", "Todo normal", "Las dos fuentes en el centro del rango normal, con ruido leve. Debe terminar completed.",
   {cem: {}, temp: {}}],
  ["tempAlta", "Temperatura alta", "TEMP1 salta a la zona critica (+2,5) a los 60 s. Debe cortar por critical.",
   {cem: {}, temp: {stepAt: 60, step: 2.5}}],
  ["tempSube", "Temperatura que sube", "TEMP1 sube 1 nivel por minuto: sale del normal al minuto y pasa el critico a los 2. Ejercita streak y frequency antes del corte.",
   {cem: {}, temp: {ramp: 1}}],
  ["campoInestable", "Campo inestable", "CEM1 oscila +-1,6 niveles cada 4 s, mas rapido de lo que el lazo puede seguir: entra y sale del normal sin llegar al critico.",
   {cem: {oscAmp: 1.6, oscPeriod: 4, noise: 0.2}, temp: {}, cemEnabled: true}],
  ["campoFuera", "Campo fuera de rango", "CEM1 sin planta (no responde al lazo) salta a +2,5 a los 60 s. Debe cortar por critical.",
   {cem: {setpointDuty: 0, stepAt: 60, step: 2.5}, temp: {}, cemEnabled: true}],
  ["sensorCaido", "Sensor de temperatura caido", "TEMP1 deja de dar lecturas a los 90 s. Debe cortar por silencio a los ~105 s (3 lecturas de 5 s perdidas) con TEMP1 SIN LECTURAS.",
   {cem: {}, temp: {dropAt: 90}}]
];

function applyProfile(key){
  const prof = SCENARIO_PROFILES.find(p => p[0] === key);
  if (!prof) return;
  const def = prof[3];
  state.detector.sources.forEach(s => {
    const isCem = s.name === "CEM1";
    s.sensor = "scenario";
    s.scenario = Object.assign({}, QUIET, isCem ? {setpointDuty: 0.5} : {}, isCem ? def.cem : def.temp);
    if (isCem && def.cemEnabled) s.enabled = true;
  });
  render();
}

// Que perfil describe una configuracion: la clave del perfil, "real" (los dos
// sensores reales) o "custom" (cualquier otra cosa: un escenario editado a
// mano, sim, TEMP1 en none...). Se DEDUCE de los valores en vez de recordar
// el ultimo boton apretado: asi tambien acierta con un archivo cargado, con
// la configuracion que trae la placa y despues de editar un numero (que
// deja de ser el perfil, y tiene que dejar de verse como tal).
function profileOf(cfg){
  const sources = cfg && cfg.detector && Array.isArray(cfg.detector.sources) ? cfg.detector.sources : [];
  const realOf = name => name === "CEM1" ? "mlx90393" : "ds18b20";
  // Sin seccion (o sin clave sensor) rigen los compilados: sensores reales.
  if (sources.every(s => s.sensor === undefined || s.sensor === realOf(s.name))) return "real";
  const match = SCENARIO_PROFILES.find(([, , , def]) => sources.every(s => {
    if (s.sensor !== "scenario" || !s.scenario) return false;
    const isCem = s.name === "CEM1";
    if (isCem && def.cemEnabled && s.enabled !== true) return false;
    const want = Object.assign({}, QUIET, isCem ? {setpointDuty: 0.5} : {}, isCem ? def.cem : def.temp);
    return Object.keys(want).every(k => Number(s.scenario[k]) === want[k]);
  }));
  return match ? match[0] : "custom";
}

function profileName(key){
  if (key === "real") return "sensores reales";
  if (key === "custom") return "personalizado (no coincide con ningun perfil)";
  const p = SCENARIO_PROFILES.find(x => x[0] === key);
  return p ? p[1] : key;
}

// Las etapas que el monitor pasa cuando el generador esta embebido:
//   placa   = lo que corre ahora ({config, configId, texto, aviso}; config
//             null = valores de fabrica; texto = por que corre eso, armado
//             por el monitor -- lib/format.ts motivoConfig -- para que exista
//             en un solo lugar), o null si la placa todavia no informo nada;
//   enviado = lo mandado que todavia no corre ({config, configId, fase}:
//             "enviando" o "grabado" esperando el reinicio), o null.
// Abierto con doble clic no hay placa: solo existe la fila "Editando".
let stages = {placa: null, enviado: null};

// Marca el perfil que se esta editando y llena el bloque de etapas. Se llama
// desde paint(), que corre en cada edicion: los cambios de valor no
// re-renderizan.
function updateProfileMarks(){
  if (typeof document.querySelectorAll !== "function") return;
  const form = profileOf(state);
  document.querySelectorAll("button.prof").forEach(b => {
    const key = b.dataset.real ? "real" : b.dataset.profile;
    b.classList.toggle("on", key === form);
    b.setAttribute("aria-pressed", key === form ? "true" : "false");
  });
  const box = document.getElementById("profileStatus");
  if (!box) return;

  const row = (cls, label, value, note) =>
    '<span class="et ' + cls + '">' + label + '</span><span class="val">' + value + '</span>' +
    '<span class="nota">' + note + '</span>';
  const placa = stages.placa;
  const enviado = stages.enviado;
  const placaProf = placa ? profileOf(placa.config || {}) : null;
  const enviadoProf = enviado && enviado.config ? profileOf(enviado.config) : null;

  let h = "";
  if (EMBEDDED) {
    // "default" no es un perfil sino la ausencia de configuracion: se dice
    // asi, con el motivo, en vez de "sensores reales" a secas (que es cierto
    // -- de fabrica los sensores son los reales -- pero esconde el porque).
    const motivo = placa && placa.texto
      ? '<span class="' + (placa.aviso ? "alerta" : "") + '">' + esc(placa.texto) + '</span>' : "";
    h += placa
      ? (placa.configId === "default"
          ? row("placa", "En la placa", "Valores de fabrica",
                motivo + ". De fabrica los sensores son los reales.")
          : row("placa", "En la placa", esc(profileName(placaProf)),
                "config " + esc(placa.configId) + " · es lo que corre ahora"))
      : row("placa", "En la placa", '<span class="nada">sin informar</span>',
            "la placa todavia no publico su configuracion");
    if (!enviado)
      h += row("enviado", "Enviado", '<span class="nada">nada pendiente</span>',
               "no hay ningun envio esperando aplicarse");
    else if (enviado.fase === "enviando")
      h += row("enviado", "Enviado", enviadoProf ? esc(profileName(enviadoProf)) : "...",
               "enviandose a la placa");
    else
      h += row("enviado", "Enviado", enviadoProf ? esc(profileName(enviadoProf)) : "?",
               "config " + esc(enviado.configId || "?") + " · la placa confirmo y la grabo en la SD; " +
               "se aplica cuando reinicie");
  }
  let nota;
  if (!EMBEDDED) nota = "queda en el archivo al descargarlo";
  else if (enviado && enviadoProf === form) nota = "mismo perfil que lo enviado";
  else if (!enviado && placa && placaProf === form) nota = "mismo perfil que la placa";
  else nota = "sin enviar: no corre en la placa hasta enviarlo y reiniciarla";
  h += row("form", "Editando", esc(profileName(form)), nota);
  box.innerHTML = h;
}

const getPath = p => p.split(".").reduce((o,k) => o[k], state);
function setPath(p, v){
  const parts = p.split(".");
  const last = parts.pop();
  parts.reduce((o,k) => o[k], state)[last] = v;
}

/* ---------- helpers de render ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function num(path, kind, label){
  const step = kind === INT ? "1" : "any";
  return '<label class="f"><span>' + esc(label) + '</span>' +
    '<input type="number" step="' + step + '" data-path="' + path + '" data-kind="' + kind + '"' +
    ' value="' + getPath(path) + '"></label>';
}
function txt(path, label, maxlen){
  return '<label class="f"><span>' + esc(label) + '</span>' +
    '<input type="text" maxlength="' + (maxlen || 60) + '" data-path="' + path + '" data-kind="str"' +
    ' value="' + esc(getPath(path) ?? "") + '"></label>';
}
function chk(path, label){
  return '<label class="chk"><input type="checkbox" data-path="' + path + '" data-kind="bool"' +
    (getPath(path) ? " checked" : "") + '> <span>' + esc(label) + '</span></label>';
}
function sel(path, label, opts){
  const v = String(getPath(path));
  return '<label class="f"><span>' + esc(label) + '</span>' +
    '<select data-path="' + path + '" data-kind="str">' +
    opts.map(o => '<option value="' + o + '"' + (o === v ? " selected" : "") + '>' + o + '</option>').join("") +
    '</select></label>';
}

/* ===========================================================================

const EMBEDDED = typeof window !== "undefined" && window.parent !== window;

function render(){
  document.getElementById("app").innerHTML =
    sRunType() + sMenus() + sIntervals() + sControl() + sCoils() + sDetector() + sCurrent() + sTelemetry() +
    (EMBEDDED ? "" : sWifi() + sBroker()) + sPreview();

    'toman duty&middot;(1+balance) y las del mux duty&middot;(1&minus;balance); se mide en banco para cada ' +

/* ===========================================================================
 * Edicion
 *
 * Los cambios de valor solo actualizan el estado y revalidan: NO re-renderizan,
 * porque reconstruir el DOM en cada tecla haria perder el foco del campo que se
 * esta escribiendo. Solo las operaciones estructurales (agregar/quitar opcion,
 * cargar archivo, restaurar defaults) vuelven a renderizar.
 * =========================================================================== */
document.addEventListener("input", onEdit);
document.addEventListener("change", onEdit);

function onEdit(e){
  const el = e.target;
  const path = el.dataset && el.dataset.path;
  if (!path) return;
  const kind = el.dataset.kind;
  let v;
  if (kind === "bool") v = el.checked;
  else if (kind === "str"){
    v = el.value;
    // address y channel de los ADS1115 son numericos aunque su widget sea un
    // <select>. Solo ahi: detector.sources[].address es el ROM code del
    // DS18B20, un texto, y parseInt lo dejaria en 28.
    if (/^currentSensors\.\d+\.(address|channel)$/.test(path)) v = parseInt(v, 10);
  } else {
    v = el.value === "" ? NaN : Number(el.value);
  }
  setPath(path, v);
  // Cambiar el sensor de una fuente cambia que campos tiene (escenario,
  // direccion del DS18B20): es estructural, se vuelve a dibujar.
  if (/^detector\.sources\.\d+\.sensor$/.test(path)) { render(); return; }
  validate();
}

document.addEventListener("click", e => {
  const add = e.target.dataset && e.target.dataset.add;
  const del = e.target.dataset && e.target.dataset.del;
  if (e.target.dataset && e.target.dataset.mapadd){
    if (!Array.isArray(state.control.map)) state.control.map = [];
    if (state.control.map.length < MAX_MAP_POINTS)
      state.control.map.push({intensity:0, frequency:0, duty:0, balance:0});
    render();
  } else if (e.target.dataset && e.target.dataset.mapfill){
    fillMapGaps();
    render();
  } else if (e.target.dataset && e.target.dataset.mapdel !== undefined){
    state.control.map.splice(parseInt(e.target.dataset.mapdel, 10), 1);
    render();
  } else if (add){
    const m = MENUS.find(x => x.key === add);
    state.menus[add].push(m.range ? {label:"", min:0, max:0} : {label:"", value:0});
    render();
  } else if (del){
    state.menus[del].splice(parseInt(e.target.dataset.i, 10), 1);
    render();
  } else if (e.target.dataset && e.target.dataset.profile){
    applyProfile(e.target.dataset.profile);
  } else if (e.target.dataset && e.target.dataset.real){
    realSensors();
  }
});

document.getElementById("btnReset").addEventListener("click", () => { state = clone(DEFAULTS); render(); });
document.getElementById("btnLoad").addEventListener("click", () => document.getElementById("file").click());

/* ===========================================================================
 * Validacion
 *
 * Dos niveles, y la diferencia importa:
 *   error -> el firmware descartaria ese valor (o el archivo entero) EN
 *            SILENCIO. Bloquea la descarga.
 *   aviso -> el archivo es valido, pero la combinacion tiene una consecuencia
 *            que recien se ve en banco. No bloquea.
 * =========================================================================== */
let errors = [], warns = [], info = "";
const err  = m => errors.push(m);
const warn = m => warns.push(m);

const isInt = v => Number.isFinite(v) && Number.isInteger(v);
const isNum = v => Number.isFinite(v);

/* Combinaciones intensidad x frecuencia que el operador puede elegir en la
 * pantalla. Un menu vacio cae a los defaults compilados (como en el firmware),
 * y los que exceden el tope se ignoran en la placa, asi que no cuentan. */
function menuCombos(){
  const pick = key => {
    const l = (state.menus[key] && state.menus[key].length ? state.menus[key] : DEFAULTS.menus[key])
      .slice(0, menuMax(key)).map(o => o.value).filter(isNum);
    return [...new Set(l)];
  };
  const out = [];
  pick("fieldIntensity").forEach(i => pick("frequency").forEach(f => out.push({intensity: i, frequency: f})));
  return out;
}
const mapMatches = (p, c) => isNum(p.intensity) && isNum(p.frequency) &&
  Math.abs(p.intensity - c.intensity) <= MAP_MATCH_INT && Math.abs(p.frequency - c.frequency) <= MAP_MATCH_FREQ;

function fillMapGaps(){
  if (!Array.isArray(state.control.map)) state.control.map = [];
  menuCombos().forEach(c => {
    if (state.control.map.length >= MAX_MAP_POINTS) return;
    if (!state.control.map.some(p => mapMatches(p, c)))
      state.control.map.push({intensity: c.intensity, frequency: c.frequency, duty: 0, balance: 0});
  });
}

function validateControlMap(){
  const c = state.control;
  const bmax = c.balanceMax;
  const bmaxOk = isNum(bmax) && bmax >= 0 && bmax <= MAX_BALANCE;
  if (!bmaxOk)
    err("control.balanceMax tiene que estar entre 0 y " + MAX_BALANCE + ": el Mega lo rechaza fuera de ese " +
        "rango y se queda con su valor anterior.");
  if (!Array.isArray(c.map)){
    err("control.map tiene que ser una lista de puntos.");
    return;
  }
  if (c.map.length > MAX_MAP_POINTS)
    err("control.map tiene " + c.map.length + " puntos: el Mega guarda " + MAX_MAP_POINTS +
        " como maximo (3 intensidades x 3 frecuencias) y los demas se ignoran.");
  c.map.forEach((p, i) => {
    const tag = "Mapa, punto " + (i + 1);
    if (!isNum(p.intensity) || p.intensity <= 0 || p.intensity > 100)
      err(tag + ": la intensidad tiene que estar entre 0 (excluido) y 100 mT.");
    if (!isNum(p.frequency) || p.frequency <= 0 || p.frequency > 1000)
      err(tag + ": la frecuencia tiene que estar entre 0 (excluida) y 1000 Hz.");
    if (!isNum(p.duty) || p.duty <= 0 || p.duty > 1)
      err(tag + ": el duty tiene que ser mayor que 0 y no pasar de 1" +
          (p.duty === 0 ? " (todavia sin medir en banco)." : "."));
    if (!isNum(p.balance) || Math.abs(p.balance) > MAX_BALANCE)
      err(tag + ": el balance tiene que estar entre -" + MAX_BALANCE + " y " + MAX_BALANCE + ".");
    else if (bmaxOk && Math.abs(p.balance) > bmax)
      err(tag + ": |balance| " + Math.abs(p.balance) + " supera control.balanceMax (" + bmax +
          "): el Mega rechazaria el arranque de campo nulo en este punto, no lo recortaria.");
    c.map.forEach((q, j) => {
      if (j > i && mapMatches(p, q))
        err(tag + " y " + (j + 1) + ": misma intensidad y frecuencia. Un punto por combinacion.");
    });
  });

  // Cobertura: el campo nulo sin punto se rechaza en el Mega (la pantalla
  // muestra "NO INICIO"). Mejor avisar aca, antes de llegar al banco.
  const combos = menuCombos();
  const faltan = combos.filter(cb => !c.map.some(p => mapMatches(p, cb)));
  if (faltan.length)
    warn("Campo nulo no disponible para " + faltan.map(cb => cb.intensity + " mT / " + cb.frequency + " Hz").join(", ") +
         ": no tienen punto en control.map y el Mega rechaza ese arranque. El campo X sigue funcionando " +
         "(parte de duty 0, sin mapa).");
  const sobran = c.map.filter(p => !combos.some(cb => mapMatches(p, cb)));
  if (sobran.length)
    warn("control.map tiene " + sobran.length + " punto(s) que no coinciden con ninguna combinacion de los " +
         "menus de intensidad y frecuencia: nunca se van a usar.");
}

function validate(){
  errors = []; warns = []; info = "";

  /* --- 0. runType --- */
  if (!RUN_TYPES.includes(state.runType))
    err('Tipo de corrida "' + state.runType + '": el firmware solo entiende "normal" o "test". ' +
        'Cualquier otro valor lo lee como "normal", y las corridas de prueba entrarian al historico ' +
        'como experimentos.');
  else if (state.runType === "test")
    warn("Tipo de corrida test: todas las corridas con esta tarjeta salen marcadas como PRUEBA y el " +
         "monitor remoto no las lista junto a los experimentos. Para un experimento real, volver a normal.");
  if (state.requireMega === false)
    warn("No se exige la placa de control: sin Mega conectado se puede iniciar y recorrer las " +
         "pantallas sin que nada se energice. Solo para banco.");
  else if (state.requireMega !== true)
    err("requireMega tiene que ser true o false: con cualquier otra cosa el ESP32 lo ignora y exige el Mega.");

  /* --- 1. menus --- */
  MENUS.forEach(m => {
    const list = state.menus[m.key];
    if (list.length === 0)
      warn('Menu "' + m.title + '" vacio: la pantalla usaria los defaults compilados.');
    if (list.length > menuMax(m.key))
      err('Menu "' + m.title + '" tiene ' + list.length + ' opciones: a partir de la ' +
          (menuMax(m.key) + 1) + ' se ignoran' +
          (MENU_CAP[m.key] ? " (el mapa del campo nulo no pasa de 3 x 3 = 9 combinaciones)." : "."));
    list.forEach((o, i) => {
      const tag = m.title + " — opcion " + (i + 1);
      if (!o.label || !o.label.trim()) err(tag + ": falta la etiqueta.");
      else if (o.label.length > MAX_LABEL)
        warn(tag + ": la etiqueta se truncara a " + MAX_LABEL + " caracteres.");
      if (m.range){
        if (!isNum(o.min) || !isNum(o.max)) err(tag + ": min y max tienen que ser numeros.");
        else if (o.min >= o.max) err(tag + ": min (" + o.min + ") tiene que ser menor que max (" + o.max + ").");
      } else if (!isNum(o.value)){
        err(tag + ": el valor tiene que ser un numero.");
      } else if (m.kind === INT && !isInt(o.value)){
        err(tag + ": " + m.title + " es un entero. Escrito con decimales, ConfigLoader lo lee con " +
            '"value | 0" y el fallback se aplica cuando el tipo no coincide: la opcion quedaria en 0.');
      } else if (o.value <= 0){
        err(tag + ": el valor tiene que ser mayor que 0.");
      }
    });
  });

  // El Detector del Mega da por sentado que los dos rangos de temperatura
  // estan ANIDADOS: criticalMin <= normalMin < normalMax <= criticalMax (ver
  // Source::addSample en mega2560/src/detector.hpp).
  //
  // La pantalla Configuraciones YA NO deja armar un par que no lo cumpla:
  // al elegir uno de los dos rangos rellena el otro combo solo con los
  // compatibles. Asi que no hace falta que todos los pares sirvan -- lo que
  // si hace falta es que ninguna opcion quede HUERFANA: una opcion sin
  // ningun compatible del otro lado se puede elegir y deja el otro combo
  // vacio, sin forma de completar la configuracion.
  const normales = state.menus.temperatureNormal || [];
  const criticos = state.menus.temperatureCritical || [];
  const anidado = (n, c) => c.min <= n.min && n.min < n.max && n.max <= c.max;
  const rangoOk = o => isNum(o.min) && isNum(o.max);

  normales.forEach((n, ni) => {
    if (!rangoOk(n)) return;
    if (criticos.filter(rangoOk).some(c => anidado(n, c))) return;
    err("Rango normal opcion " + (ni + 1) + " (" + n.min + "~" + n.max + "): ningun rango critico " +
        "lo contiene. Elegirlo en la pantalla dejaria el combo de temperatura critica vacio.");
  });

  criticos.forEach((c, ci) => {
    if (!rangoOk(c)) return;
    if (normales.filter(rangoOk).some(n => anidado(n, c))) return;
    err("Rango critico opcion " + (ci + 1) + " (" + c.min + "~" + c.max + "): no contiene a ningun " +
        "rango normal. Elegirlo en la pantalla dejaria el combo de temperatura normal vacio.");
  });

  /* --- 2. intervals --- */
  const chkInterval = (grp, meta) => meta.forEach(([k, lbl]) => {
    const v = state.intervals[grp][k];
    if (!isInt(v))
      err("Intervalo " + lbl + " (" + grp + "." + k + "): tiene que ser un entero en ms. " +
          "Con decimales, is<unsigned long>() lo rechaza y queda el default compilado.");
    else if (v <= 0)
      err("Intervalo " + lbl + " (" + grp + "." + k + "): un 0 se rechaza, esa tarea nunca correria.");
  });
  chkInterval("esp32", INTERVALS_ESP32);
  chkInterval("mega", INTERVALS_MEGA);

  const mt = state.intervals.mega.measureTemperature;
  if (isInt(mt) && mt < 1000)
    err("measureTemperature en " + mt + " ms: ThermometerDS18B20::update() bloquea ~750 ms por " +
        "llamada aunque no haya sensor en el bus, asi que no puede bajar de 1000.");
  // Los dos timeouts de pantalla: por debajo de 1 s el splash no llega a
  // verse y el Busy se rinde antes de que el Mega alcance a contestar.
  [["splashTimeout","Duracion del splash"],["busyTimeout","Espera en pantalla Procesando"]]
    .forEach(([k, lbl]) => {
      const v = state.intervals.esp32[k];
      if (isInt(v) && v < 1000)
        err("Intervalo " + lbl + " (esp32." + k + ") en " + v + " ms: es un timeout de pantalla, " +
            "no puede bajar de 1000.");
    });

  // El Busy espera el state_data que el Mega difunde cada sendState; con
  // menos margen que eso, Detener siempre cae por el timeout en vez de por
  // la confirmacion real.
  const bt = state.intervals.esp32.busyTimeout, ss = state.intervals.mega.sendState;
  if (isInt(bt) && isInt(ss) && bt <= ss)
    warn("busyTimeout (" + bt + " ms) no supera a mega.sendState (" + ss + " ms): la pantalla " +
         "Procesando se va a rendir por timeout antes de recibir la confirmacion del Mega.");

  const st = state.intervals.mega.settlingTime;
  if (isInt(st) && st < DEFAULTS.intervals.mega.settlingTime)
    warn("settlingTime por debajo del default (" + DEFAULTS.intervals.mega.settlingTime + " ms): " +
         "acerca el primer flag posible al arranque, cuando el lazo de control todavia no convergio.");

  /* --- 3. control --- */
  if (!isNum(state.control.kp) || state.control.kp <= 0) err("control.kp tiene que ser mayor que 0.");
  if (!isNum(state.control.maxStep) || state.control.maxStep <= 0) err("control.maxStep tiene que ser mayor que 0.");
  if (!isNum(state.control.deadBand) || state.control.deadBand < 0) err("control.deadBand no puede ser negativo.");
  if (!state.control.enabled)
    warn("control.enabled en false: el lazo mide y reporta pero NO excita las bobinas. Es el modo de " +
         "sensado para bring-up, no una corrida real.");
  validateControlMap();

  /* --- 4. coils --- */
  const usados = new Set();
  state.coils.forEach((c, i) => {
    const tag = "Bobina " + (i + 1);
    if (!c.name || !c.name.trim())
      err(tag + ": falta el nombre. El frame config_coil identifica el canal por nombre, no por indice.");
    else if (c.name.length > MAX_LABEL)
      warn(tag + ": el nombre se truncara a " + MAX_LABEL + " caracteres.");
    else if (usados.has(c.name))
      err(tag + ': el nombre "' + c.name + '" esta repetido, y es lo que usa findByName() para ' +
          "resolver a que canal aplicar el frame.");
    if (c.name) usados.add(c.name);
    if (!isNum(c.calibrationFactor) || c.calibrationFactor < 0.1 || c.calibrationFactor > 5.0)
      err(tag + ": calibrationFactor fuera del rango 0,1 a 5,0 — el Mega lo rechaza y deja 1.0.");
  });
  const on = state.coils.map((c, i) => c.enabled ? i : -1).filter(i => i >= 0);
  if (on.length === 0)
    warn("Ninguna bobina habilitada: no habria campo en ningun modo.");
  else if (on.every(i => i % 2 === 0) || on.every(i => i % 2 === 1))
    warn("Todas las bobinas habilitadas caen en el mismo grupo de fase (1 y 3 directa, 2 y 4 mux): " +
         "el modo de campo nulo no cancelaria nada y no seria verificable.");

  /* --- 5. detector --- */
  if (state.detector.enabled === false)
    warn("Detector apagado: ninguna fuente puede generar flags ni cortar el experimento, aunque " +
         "la temperatura o el campo salgan de rango. Solo para banco.");
  else if (state.detector.enabled !== true)
    err("detector.enabled tiene que ser true o false: con cualquier otra cosa el ESP32 no lo manda " +
        "y el Mega se queda con el detector encendido.");
  state.detector.sources.forEach(s => {
    const allowed = SOURCE_SENSORS[s.name];
    if (allowed && !allowed.includes(s.sensor))
      err(s.name + ': sensor "' + s.sensor + '" no es valido (' + allowed.join(", ") + '). ' +
          "El Mega lo rechaza y sigue con el driver que tenia, sin avisar en pantalla.");
    if (s.sensor === "scenario") {
      const sc = s.scenario || {};
      const tag = s.name + " / escenario";
      SCENARIO_KEYS.forEach(([k, , lbl]) => {
        if (!isNum(sc[k])) err(tag + ": " + lbl + " tiene que ser un numero.");
      });
      ["noise", "stepAt", "oscPeriod", "dropAt"].forEach(k => {
        if (isNum(sc[k]) && sc[k] < 0)
          err(tag + ": " + k + " no puede ser negativo; el Mega lo ignora y deja el valor anterior.");
      });
      if (s.name === "CEM1" && (!isNum(sc.setpointDuty) || sc.setpointDuty < 0 || sc.setpointDuty > 1))
        err(tag + ": el duty que da el objetivo tiene que estar entre 0 y 1.");
      if (isNum(sc.oscAmp) && sc.oscAmp !== 0 && !(sc.oscPeriod > 0))
        warn(tag + ": hay amplitud de oscilacion pero periodo 0, asi que no oscila.");
      if (isNum(sc.stepAt) && sc.stepAt > 0 && sc.stepAt < 10)
        warn(tag + ": el salto ocurre antes de los 10 s de estabilizacion; el Detector recien lo ve despues.");
    }
    if (s.name === "CEM1" && (s.sensor === "sim" || s.sensor === "scenario"))
      warn("CEM1 no es el sensor real: el lazo regula contra un campo inventado, asi que la etapa de " +
           "potencia y las bobinas quedan BLOQUEADAS (el duty se calcula y se muestra, no sale), y las " +
           "corridas salen marcadas PRUEBA.");
    if (s.name === "TEMP1" && s.sensor === "ds18b20" && String(s.address ?? "").trim()) {
      const rom = parseRomCode(s.address);
      if (rom.error)
        err("TEMP1: direccion del DS18B20 \"" + s.address + "\": " + rom.error + ". El Mega la " +
            "rechazaria y seguiria con la anterior. Se copia del log del Mega al arrancar ([ONEWIRE]).");
    }
    if (s.name === "TEMP1" && s.sensor === "scenario")
      warn("TEMP1 con escenario: la temperatura es calculada, no medida. Las corridas salen marcadas PRUEBA.");
    if (s.name === "TEMP1" && s.sensor === "sim")
      warn("TEMP1 con sensor sim: la temperatura sale de la entrada A1, no del DS18B20. No mide la " +
           "temperatura del gabinete -- nunca para un experimento con animales.");
    const mm = s.maxMissedSamples;
    if (!isInt(mm) || mm < 1 || mm > 20)
      err(s.name + ": las lecturas perdidas antes del corte tienen que ser un entero entre 1 y 20. " +
          "Fuera de rango el Mega lo ignora y se queda con 3.");
    // Una fuente vigilada sin sensor no da lecturas, y desde la tarjeta 25 el
    // silencio corta: el experimento se cortaria en cada corrida.
    if (s.name === "TEMP1" && s.sensor === "none" && s.enabled)
      err("TEMP1 vigilada sin termometro (sensor none): sin lecturas, el corte por silencio la " +
          "cortaria en cada corrida. Desmarcar 'Vigilada por el Detector' o elegir un sensor.");
    const bs = s.bufferSize;
    if (!isInt(bs) || bs < 8 || bs > 32)
      err(s.name + ": bufferSize tiene que ser un entero entre 8 y 32 (tope de RAM del Mega).");
    if (s.range.mode === "derived"){
      const cm = s.range.criticalMultiplier;
      if (!isNum(cm) || cm < 1.0 || cm > 3.0)
        err(s.name + ": criticalMultiplier fuera del rango 1,0 a 3,0.");
    }
    RULES.forEach(([k, lbl]) => {
      const r = s.rules[k], tag = s.name + " / regla " + lbl;
      if (!isInt(r.threshold) || r.threshold < 1 || (isInt(bs) && r.threshold > bs))
        err(tag + ": threshold tiene que ser un entero entre 1 y bufferSize (" + bs + "). " +
            "Si algo cae fuera, el Mega descarta la regla entera y queda su default compilado.");
      if (!isInt(r.cooldown) || r.cooldown < 0 || r.cooldown > 64)
        err(tag + ": cooldown tiene que ser un entero entre 0 y 64.");
      if (!isInt(r.maxEvents) || r.maxEvents < 1 || r.maxEvents > 10)
        err(tag + ": maxEvents tiene que ser un entero entre 1 y 10.");
    });
    if (!s.enabled)
      warn(s.name + " deshabilitada: se sigue midiendo y mostrando en pantalla, pero no puede " +
           "generar flags ni cortar el experimento.");
  });
  const temp1 = state.detector.sources.find(s => s.name === "TEMP1");
  if (temp1 && isInt(mt) && isInt(temp1.bufferSize))
    info = "Ventana del Detector para TEMP1: " + temp1.bufferSize + " muestras x " + mt + " ms = " +
           (temp1.bufferSize * mt / 1000).toFixed(0) + " s de tiempo real. La regla de frecuencia " +
           "cuenta dentro de esa ventana, asi que cambiar measureTemperature corre su significado.";

  /* --- 6. currentSensors --- */
  const slots = new Set();
  state.currentSensors.forEach((c, i) => {
    const tag = "Canal de corriente " + (i + 1);
    if (c.address !== 72 && c.address !== 73)
      err(tag + ": address tiene que ser 72 (0x48) o 73 (0x49).");
    if (c.channel !== 0 && c.channel !== 1)
      err(tag + ": channel tiene que ser 0 o 1 — el ADS1115 no tiene un par diferencial 2 ni 3.");
    const slot = c.address + "/" + c.channel;
    if (slots.has(slot))
      err(tag + ": el par (address " + c.address + ", channel " + c.channel + ") esta repetido. " +
          "Ese par es la identidad fisica de la entrada y es como se matchea con su slot.");
    slots.add(slot);
    if (!c.name || !c.name.trim())
      err(tag + ": falta el nombre, que es el identificador que viaja en current_data.");
    else if (c.name.length > MAX_LABEL)
      warn(tag + ": el nombre se truncara a " + MAX_LABEL + " caracteres.");
    if (!isInt(c.sampleRate) || c.sampleRate <= 0)
      err(tag + ": sampleRate tiene que ser un entero positivo (SPS).");
    if (!isInt(c.integrationTimeMs) || c.integrationTimeMs <= 0)
      err(tag + ": integrationTimeMs tiene que ser un entero positivo.");
    [["ratedCurrent", "la corriente nominal"], ["ratedVoltage", "la tension nominal"],
     ["calibration", "el factor de calibracion"]].forEach(([k, lbl]) => {
      if (!isNum(c[k]) || c[k] <= 0) err(tag + ": " + lbl + " tiene que ser mayor que 0.");
    });
  });
  [72, 73].forEach(addr => {
    const mod = state.currentSensors.filter(c => c.enabled && c.address === addr);
    if (mod.length === 2 && mod[0].sampleRate !== mod[1].sampleRate)
      warn("Modulo 0x" + addr.toString(16) + ": sus dos canales habilitados piden sampleRate distinto (" +
           mod[0].sampleRate + " y " + mod[1].sampleRate + "). Es un registro del ADS1115 que ambos " +
           "comparten: gana el ultimo que se configura, en silencio.");
  });

  /* --- 8. wifi --- */
  const redes = state.wifi.filter(n => n.ssid.trim());
  if (redes.length === 0) {
    warn("Ninguna red WiFi cargada: la seccion no se escribe y quedan las compiladas en secrets.h.");
  }
  state.wifi.forEach((n, i) => {
    const tag = "Red WiFi " + (i + 1);
    if (!n.ssid.trim()) {
      // Fila vacia: es lo normal en las que sobran. Pero una clave sin SSID
      // es casi seguro un renglon a medio cargar.
      if (n.password.trim()) err(tag + ": tiene contrasena pero no SSID.");
      return;
    }
    if (n.ssid.length > MAX_SSID) err(tag + ': el SSID no puede pasar de ' + MAX_SSID + " caracteres.");
    if (n.password.length > MAX_WIFI_PASS)
      err(tag + ": la contrasena no puede pasar de " + MAX_WIFI_PASS + " caracteres (tope de WPA2).");
    if (!n.password.trim())
      warn(tag + ' ("' + n.ssid + '"): sin contrasena, se conectaria como red abierta.');
  });
  const ssids = redes.map(n => n.ssid.trim());
  ssids.forEach((ssid, i) => {
    if (ssids.indexOf(ssid) !== i)
      warn('Red WiFi "' + ssid + '" repetida: la segunda entrada nunca se llega a probar.');
  });
  if (redes.length > MAX_WIFI_NETWORKS)
    err("No entran mas de " + MAX_WIFI_NETWORKS + " redes (WiFiConfig::MAX_NETWORKS).");

  /* --- 9. broker --- */
  if (!state.broker.server.trim())
    warn("Broker sin host: se usa el compilado en secrets.h.");
  else if (state.broker.server.length > MAX_BROKER_HOST)
    err("El host del broker no puede pasar de " + MAX_BROKER_HOST + " caracteres.");
  if (!isInt(state.broker.port) || state.broker.port <= 0 || state.broker.port > 65535)
    err("El puerto del broker tiene que ser un entero entre 1 y 65535.");
  // El dashboard esta fuera de la red del equipo: sin TLS las credenciales y
  // los datos del experimento viajan en claro por internet.
  else if (state.broker.port === 1883)
    warn("Puerto 1883: es MQTT sin cifrar. Con el broker fuera de la red local, las credenciales y " +
         "la telemetria viajarian en texto plano. El puerto con TLS suele ser 8883.");
  if (state.broker.user.length > MAX_BROKER_USER)
    err("El usuario del broker no puede pasar de " + MAX_BROKER_USER + " caracteres.");
  if (state.broker.password.length > MAX_BROKER_PASS)
    err("La contrasena del broker no puede pasar de " + MAX_BROKER_PASS + " caracteres.");
  if (state.broker.clientId.length > MAX_BROKER_CLIENTID)
    err("El clientId no puede pasar de " + MAX_BROKER_CLIENTID + " caracteres.");

  /* --- 7. telemetry --- */
  const topicsUsados = new Map();
  TELEMETRY_GROUPS.forEach(([k, lbl, desc, periodic]) => {
    const g = state.telemetry.groups[k];
    if (!g.topic.trim()) { err('Grupo de telemetria "' + lbl + '": falta el topic MQTT.'); }
    else if (g.topic.length > MAX_TOPIC) {
      warn('Grupo "' + lbl + '": el topic se truncara a ' + MAX_TOPIC + " caracteres.");
    }
    else if (g.topic !== DEFAULTS.telemetry.groups[k].topic) {
      warn('Grupo "' + lbl + '": topic cambiado a "' + g.topic + '". Hay que actualizar el ' +
           "dashboard o ese grupo no llega.");
    }

    // Dos grupos en el mismo topic mezclan formas de JSON distintas en una
    // sola suscripcion, y el Decoder no tiene como saber cual recibio.
    if (g.enabled && g.topic.trim()) {
      if (topicsUsados.has(g.topic))
        err('Los grupos "' + topicsUsados.get(g.topic) + '" y "' + lbl + '" publican en el mismo ' +
            'topic ("' + g.topic + '"): el Decoder no puede distinguir un mensaje del otro.');
      else topicsUsados.set(g.topic, lbl);
    }

    if (periodic && (!isInt(g.interval) || g.interval <= 0))
      err('Cadencia del grupo "' + lbl + '": tiene que ser un entero positivo en ms.');

    // Una alerta retenida se le entrega a cada nuevo suscriptor como si
    // acabara de ocurrir: el dashboard mostraria una alerta vieja de un
    // experimento terminado hace rato como si fuera actual.
    if (k === "alerts" && g.retain)
      warn('Grupo "Alertas" con retencion: son eventos, no estado. El broker le entregaria la ' +
           "ultima alerta a cualquiera que se conecte despues, como si acabara de ocurrir.");
  });
  if (TELEMETRY_GROUPS.every(([k]) => !state.telemetry.groups[k].enabled))
    warn("Todos los grupos de telemetria estan deshabilitados: no se publica nada al monitor remoto.");
  if (!state.telemetry.groups.result.enabled)
    warn("Grupo Resultado deshabilitado: el monitor remoto no se entera de por que termino un " +
         "experimento, ni siquiera cuando corta por una alerta critica.");
  TELEMETRY_FIELDS.forEach(([k, lbl]) => {
    const f = state.telemetry.fields[k];
    if (f.enabled && !f.name.trim())
      err('Campo de telemetria "' + lbl + '": esta habilitado pero no tiene clave.');
    else if (f.name.length > MAX_LABEL)
      warn('Campo de telemetria "' + lbl + '": la clave se truncara a ' + MAX_LABEL + " caracteres.");
    else if (f.enabled && f.name !== DEFAULTS.telemetry.fields[k].name)
      warn('Campo "' + lbl + '" renombrado a "' + f.name + '": el dashboard espera "' +
           DEFAULTS.telemetry.fields[k].name + '". Si no se actualiza alla, ese valor deja de llegar.');
  });
  checkPayload("mediciones", ["magneticField", "temperature"]);
  checkPayload("estado",     ["health", "progress", "elapsedTime"]);
  const pm = payloadBytes(["magneticField", "temperature"]);
  const ps = payloadBytes(["health", "progress", "elapsedTime"]);
  info += (info ? " · " : "") + "Payload MQTT de los campos con clave configurable: " + pm +
          " bytes el grupo de mediciones y " + ps + " el de estado, sobre un buffer de " +
          MQTT_BUFFER + ". Los demas grupos usan claves fijas y cortas.";

  paint();
}

/* Peso del payload MQTT contra el char[128] de _publishTelemetry().
 *
 * Deliberadamente NO es una validacion: es informativo, y vale la pena saber
 * por que. El firmware guarda cada clave en un `char name[16]` (Topics::
 * TelemetryField) y trunca al copiar, asi que ninguna clave puede superar los
 * 15 caracteres por mas larga que venga en el archivo. Con ese tope, la tanda
 * mas pesada -- mediciones, 3 floats -- da 4 + 3x(15+3+12) = 94 bytes, y la de
 * estado 81. El buffer de 128 no puede desbordar.
 *
 * O sea que la guarda de _publishTelemetry() (no publicar en vez de mandar un
 * JSON cortado) es defensiva de verdad: correcta, pero inalcanzable mientras
 * los buffers de nombre midan 16. Poner aca un error que bloquee la descarga
 * por algo que no puede pasar seria peor que no tenerlo: sugeriria un riesgo
 * inexistente y mandaria a acortar claves sin motivo. Se muestra el numero y
 * listo. Si alguna vez se agranda MaxFieldNameLength, este calculo es el que
 * dice cuanto margen queda. */
const WORST = {magneticField:12, temperature:12, health:10, progress:3, elapsedTime:10};

function payloadBytes(keys){
  const on = keys.filter(k => state.telemetry.fields[k].enabled);
  if (on.length === 0) return 0;
  let bytes = 2 + (on.length - 1);   // llaves mas las comas
  // Se mide sobre el nombre YA truncado, que es el que el firmware publica.
  on.forEach(k => { bytes += Math.min(state.telemetry.fields[k].name.length, MAX_LABEL) + 3 + WORST[k]; });
  return bytes;
}

function checkPayload(batch, keys){
  const on = keys.filter(k => state.telemetry.fields[k].enabled);
  if (on.length === 0)
    warn("Tanda de " + batch + ": no hay ningun campo habilitado, esa publicacion no se manda.");
}

/* ===========================================================================
 * Salida
 * =========================================================================== */
function buildJson(){
  // Mismo orden de claves que el esquema, para que el archivo sea diffeable
  // contra docs/config.example.json.
  return {
    schemaVersion: 1,
    runType: state.runType,
    requireMega: state.requireMega,
    menus: state.menus,
    intervals: state.intervals,
    control: state.control,
    coils: state.coils,
    // address vacia no se escribe (rige la del firmware); una valida sale
    // normalizada, "28:3F:...", que es como la imprime el Mega.
    detector: Object.assign({}, state.detector, {
      sources: state.detector.sources.map(s => {
        const copy = Object.assign({}, s);
        const text = String(s.address ?? "").trim();
        if (!text) delete copy.address;
        else {
          const rom = parseRomCode(text);
          copy.address = rom.bytes ? formatRomCode(rom.bytes) : text;
        }
        return copy;
      })
    }),
    currentSensors: state.currentSensors,
    telemetry: state.telemetry,
    // Las filas sin SSID son lugares vacios del formulario, no redes: se
    // descartan en vez de escribir entradas que el firmware ignoraria.
    // Embebido no van: las credenciales no viajan por MQTT.
    ...(EMBEDDED ? {} : {
      wifi: state.wifi.filter(n => n.ssid.trim()),
      broker: state.broker
    })
  };
}

function paint(){
  document.getElementById("preview").textContent = JSON.stringify(buildJson(), null, 2);
  document.getElementById("dl").disabled = errors.length > 0;
  document.getElementById("send").disabled = errors.length > 0;

  const li = arr => "<ul>" + arr.map(m => "<li>" + esc(m) + "</li>").join("") + "</ul>";
  let h = "";
  if (errors.length === 0 && warns.length === 0)
    h += '<div class="msg o">Sin errores ni avisos. El archivo se puede descargar.</div>';
  if (errors.length)
    h += '<div class="msg e"><b>' + errors.length + ' error(es)</b> — la descarga esta bloqueada: ' +
         "el firmware descartaria estos valores en silencio." + li(errors) + "</div>";
  if (warns.length)
    h += '<div class="msg w"><b>' + warns.length + ' aviso(s)</b> — el archivo es valido, pero estas ' +
         "combinaciones tienen consecuencias que recien se ven en banco." + li(warns) + "</div>";
  if (info) h += '<div class="msg o">' + esc(info) + "</div>";
  document.getElementById("msgs").innerHTML = h;

  // El resumen fijo: cuantos errores y avisos hay, y un toque lleva a la
  // lista (que esta arriba del formulario, fuera de la cabecera fija).
  let r = "";
  if (errors.length) r += '<button type="button" class="pill e" data-ir="msgs">' + errors.length + " error(es)</button> ";
  if (warns.length) r += '<button type="button" class="pill w" data-ir="msgs">' + warns.length + " aviso(s)</button> ";
  if (!errors.length && !warns.length) r += '<span class="pill o">Sin errores ni avisos</span>';
  document.getElementById("msgSummary").innerHTML = r;
  updateProfileMarks();
}

// Un solo listener (delegado) para las pastillas del resumen, que se
// redibujan con cada validacion.
document.getElementById("msgSummary").addEventListener("click", ev => {
  if (ev.target && ev.target.dataset && ev.target.dataset.ir)
    document.getElementById("msgs").scrollIntoView({behavior: "smooth", block: "start"});
});

function download(){
  if (errors.length) return;
  const blob = new Blob([JSON.stringify(buildJson(), null, 2) + "\n"], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "config.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* Cargar un archivo existente para editarlo. Se mergea sobre los defaults en
 * vez de reemplazar el estado entero: un archivo al que le falta una seccion
 * tiene que comportarse aca igual que en el firmware (seccion 1.1 del esquema,
 * los defaults compilados nunca desaparecen). */
function loadParsed(parsed){
  state = clone(DEFAULTS);
  ["runType", "requireMega", "menus", "intervals", "control", "coils", "detector", "currentSensors", "telemetry"]
    .forEach(k => { if (parsed[k] !== undefined) state[k] = parsed[k]; });
  // wifi y broker tambien: antes no se cargaban, y abrir una tarjeta para
  // editarla y volver a descargarla BORRABA las credenciales en silencio --
  // la placa perdia la red en el proximo reinicio. Las filas de WiFi son
  // fijas en el formulario, asi que se completan hasta el tope.
  if (Array.isArray(parsed.wifi)) {
    state.wifi = parsed.wifi.slice(0, MAX_WIFI_NETWORKS)
      .map(n => ({ssid: String(n.ssid || ""), password: String(n.password || "")}));
    while (state.wifi.length < MAX_WIFI_NETWORKS) state.wifi.push({ssid: "", password: ""});
  }
  if (parsed.broker && typeof parsed.broker === "object")
    state.broker = Object.assign(clone(DEFAULTS.broker), parsed.broker);
  // Un archivo anterior a detector.enabled trae la seccion sin esa clave:
  // en el firmware eso es "encendido", y asi tiene que verse aca.
  if (state.detector.enabled === undefined) state.detector.enabled = true;
  // Un archivo anterior al mapa trae `control` sin balanceMax ni map: se completan con
  // los de fabrica (mapa vacio), no se dejan undefined.
  state.control = Object.assign(clone(DEFAULTS.control), state.control);
  // `tare` ya no existe (el campo se mide como RMS, que no necesita tara): un
  // archivo viejo que la traiga se lee, pero no se vuelve a escribir.
  delete state.control.tare;
  // Una fuente sin `scenario` toma el de fabrica, para que elegir el
  // sensor "scenario" en el formulario tenga numeros que editar.
  state.detector.sources.forEach(s => {
    const def = DEFAULTS.detector.sources.find(d => d.name === s.name);
    if (!s.scenario && def) s.scenario = clone(def.scenario);
  });
  render();
}

document.getElementById("file").addEventListener("change", ev => {
  const f = ev.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let parsed;
    try { parsed = JSON.parse(r.result); }
    catch (e){ alert("El archivo no es JSON valido:\n\n" + e.message); return; }
    if (parsed.schemaVersion !== 1)
      alert("schemaVersion " + parsed.schemaVersion + " — el firmware solo entiende la 1 y " +
            "descartaria el archivo entero. Se carga igual para que lo puedas corregir.");
    loadParsed(parsed);
  };
  r.readAsText(f);
  ev.target.value = "";
});

// Estado del ultimo envio a la placa, que pasa el monitor. Va en la cabecera
// fija, al lado del boton Enviar, porque es ahi donde se esta mirando.
function showSendStatus(st){
  const box = document.getElementById("sendStatus");
  if (!st || !st.text) { box.innerHTML = ""; return; }
  const cls = {ok: "o", error: "e", progress: "i"}[st.kind] || "i";
  box.innerHTML = '<div class="msg ' + cls + '"><b>' + esc(st.text) + '</b>' +
    (st.detail ? '<br>' + esc(st.detail) : '') + '</div>';
}

if (EMBEDDED) {
  document.body.classList.add("embebido");
  document.getElementById("dl").hidden = true;
  const send = document.getElementById("send");
  send.hidden = false;
  send.addEventListener("click", () => {
    validate();
    if (errors.length) return;
    window.parent.postMessage({type: "biosoft-send", config: buildJson()}, window.location.origin);
  });
  // Solo se aceptan mensajes del monitor que lo embebe (mismo origen).
  window.addEventListener("message", ev => {
    if (ev.origin !== window.location.origin || !ev.data) return;
    if (ev.data.type === "biosoft-load" && ev.data.config) loadParsed(ev.data.config);
    if (ev.data.type === "biosoft-board") {
      stages = {placa: ev.data.placa || null, enviado: ev.data.enviado || null};
      updateProfileMarks();
    }
    if (ev.data.type === "biosoft-status") showSendStatus(ev.data.status);
    // Un usuario de solo lectura ve y edita (para descargar o mirar), pero no
    // envia: el servidor lo rechazaria igual, mejor no ofrecer el boton.
    if (ev.data.type === "biosoft-readonly") {
      document.getElementById("send").hidden = true;
      document.getElementById("readonlyNote").hidden = false;
      document.getElementById("dl").hidden = false;
    }
  });
}

render();
if (EMBEDDED) window.parent.postMessage({type: "biosoft-ready"}, window.location.origin);
</script>
</body>
