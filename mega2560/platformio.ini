; BioSoft - Mega2560 (control físico: campo, corriente, temperatura, relés)
; Migrado desde el sketch de Arduino IDE "SoftMega2560".

; `native` es un entorno solo-de-tests (ver [env:native] abajo), no tiene
; src/ propio y falla si se intenta compilar con `pio run`. Lo excluimos del
; build por defecto para que `pio run` / el botón "Build" del IDE solo
; compilen el firmware real; los tests nativos se corren aparte con
; `pio test -e native`.
[platformio]
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

lib_deps =
    bblanchon/ArduinoJson@7.4.2
    robtillaart/AD9833@0.4.5
    adafruit/Adafruit ADS1X15@2.6.2
    adafruit/Adafruit MLX90393@2.0.5
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit Unified Sensor@1.1.15
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@4.0.4

; RAM: con los valores por defecto (pensados para la ESP32) el Mega quedaba
; con ~200 bytes libres y se colgaba al procesar las primeras tramas (heap y
; stack pisandose). El Mega usa como mucho 7 tareas y el nombre mas largo es
; MEASURE_MAGNETIC_FIELD (22 + '\0'): un nombre truncado no matchea en
; onTimer() y la tarea no corre nunca, asi que MAX_TASK_NAME no baja de 24.
build_flags =
    -D MAX_TASKS=10
    -D MAX_TASK_NAME=24
    ; Cola TX en bytes de tramas armadas (seriallink.hpp): entra una trama
    ; maxima (256 + 5) y unos cuantos acks. Un sendCommand sin lugar
    ; devuelve false; los que reintentan (config_*, start/stop/reset) lo
    ; vuelven a mandar.
    -D TX_BUFFER_SIZE=384
    ; Cada JsonDocument reserva su primer pool entero aunque lleve 2 claves:
    ; 16 slots = 96 bytes por default en AVR. Con 8 (48 bytes) un ack ocupa
    ; la mitad; los documentos grandes solo piden mas pools.
    -D ARDUINOJSON_POOL_CAPACITY=8

monitor_speed = 115200

; Entorno de tests unitarios: corre en la PC (sin placa), compila con el
; compilador del host en vez del toolchain AVR. Usado para testear la lógica
; pura (detección de peligro, framing del protocolo serie, máquinas de estado)
; antes de programar el Mega. Ver la sección "Commands" del CLAUDE.md raíz.
[env:native]
platform = native
test_framework = unity
build_flags =
    -D UNIT_TEST
    -std=gnu++17
; Los archivos de src/ (sketch .ino + managers de hardware real) no se
; compilan para los tests: los tests incluyen directamente los .hpp que
; necesitan, ya que todo el código es header-only.
test_build_src = no
lib_deps =
    bblanchon/ArduinoJson@7.4.2
    fabiobatsilva/ArduinoFake@0.4.0
