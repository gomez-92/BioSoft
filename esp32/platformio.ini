; BioSoft - ESP32 (pantalla / HMI)
; Migrado desde el sketch de Arduino IDE "SoftEsp32".

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv

lib_deps =
    lvgl/lvgl@9.1.0
    bodmer/TFT_eSPI@2.5.34
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    bblanchon/ArduinoJson@7.4.2
    knolleary/PubSubClient@2.8

build_flags =
    ; ---- LVGL: usar include/lv_conf.h ----
    -D LV_CONF_INCLUDE_SIMPLE=1
    -I include

    ; ---- TFT_eSPI: config equivalente a User_Setup.h (ILI9341, 240x320) ----
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D USE_HSPI_PORT=1

monitor_speed = 115200
